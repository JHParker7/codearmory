name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in as much detail as you can.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Gatekeeper
        - Blueprints
        - Conductor
        - Armory CLI
        - Infra / Docker Compose
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version / environment
      placeholder: |
        CodeArmory version: alpha-x.y.z
        OS: Ubuntu 24.04
        Docker: 27.x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
