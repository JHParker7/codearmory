name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gatekeeper-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run gatekeeper unit tests
        run: cd src/systems/gatekeeper; go test .

  blueprints-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run blueprints unit tests
        run: cd src/systems/blueprints; go test .

  conductor-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run conductor unit tests
        run: cd src/systems/conductor; go test .

  cli-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run cli unit tests
        run: cd src/cli; go test .

  integration-tests:
    runs-on: ubuntu-latest
    needs:
      - gatekeeper-unit-test
      - blueprints-unit-test
      - conductor-unit-test
      - cli-unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install \
            -r tests/gatekeeper/requirements.txt \
            -r tests/conductor/requirements.txt \
            -r tests/blueprints/requirements.txt \
            -r tests/cli/requirements.txt

      - name: Build CLI binary
        run: go build -o "${{ runner.temp }}/armory" .
        working-directory: src/cli

      - name: Deploy compose stack
        run: docker compose up -d --build --wait
        working-directory: infra/local

      - name: Wait for application services
        run: |
          for port in 8080 8081 8082; do
            echo "Waiting for port $port..."
            timeout 60 bash -c "until curl -s -o /dev/null --max-time 2 http://localhost:$port/; do sleep 1; done"
            echo "Port $port is ready"
          done

      - name: Run gatekeeper integration tests
        env:
          API_URL: http://localhost:8080
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gatekeeper
        run: pytest tests/gatekeeper -v

      - name: Run blueprints integration tests
        env:
          BLUEPRINTS_URL: http://localhost:8081
          GATEKEEPER_URL: http://localhost:8080
        run: pytest tests/blueprints -v

      - name: Run conductor integration tests
        env:
          CONDUCTOR_URL: http://localhost:8082
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gatekeeper
        run: pytest tests/conductor -v

      - name: Run CLI integration tests
        env:
          CONDUCTOR_URL: http://localhost:8082
          ARMORY_BIN: ${{ runner.temp }}/armory
        run: pytest tests/cli -v

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs
        working-directory: infra/local

  release:
    needs: integration-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      deployments: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog@6.0.0
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push gatekeeper
        uses: docker/build-push-action@v6
        with:
          context: src/systems/gatekeeper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/gatekeeper:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/gatekeeper:alpha-latest
      - name: Build and push blueprints
        uses: docker/build-push-action@v6
        with:
          context: src/systems/blueprints
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/blueprints:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/blueprints:alpha-latest
      - name: Build and push conductor
        uses: docker/build-push-action@v6
        with:
          context: src/systems/conductor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/conductor:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/conductor:alpha-latest
      - name: Build and push gatekeeper integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/gatekeeper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/gatekeeper-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/gatekeeper-tests:alpha-latest
      - name: Build and push blueprints integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/blueprints
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/blueprints-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/blueprints-tests:alpha-latest
      - name: Build and push conductor integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/conductor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/conductor-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/conductor-tests:alpha-latest

  build-cli:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o armory${{ matrix.ext }} .
        working-directory: src/cli
      - name: Rename binary
        run: mv src/cli/armory${{ matrix.ext }} armory_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
      - name: Upload to release
        run: gh release upload v${{ needs.release.outputs.new_release_version }} armory_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
