name: test_build_release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gatekeeper-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run gatekeeper unit tests
        run: cd src/systems/gatekeeper; go test .

  blueprints-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run blueprints unit tests
        run: cd src/systems/blueprints; go test .

  conductor-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run conductor unit tests
        run: cd src/systems/conductor; go test .

  cli-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run cli unit tests
        run: cd src/cli; go test .

  forge-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run forge unit tests
        run: cd src/systems/forge; go test .

  registry-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run registry unit tests
        run: cd src/systems/registry; go test .

  workflows-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run workflows unit tests
        run: cd src/systems/workflows; go test .

  hooks-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run hooks unit tests
        run: cd src/systems/hooks; go test .

  tickets-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run tickets unit tests
        run: cd src/systems/tickets; go test .

  release:
    needs:
      - gatekeeper-unit-test
      - blueprints-unit-test
      - conductor-unit-test
      - cli-unit-test
      - forge-unit-test
      - registry-unit-test
      - workflows-unit-test
      - hooks-unit-test
      - tickets-unit-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      deployments: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog@6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push gatekeeper
        uses: docker/build-push-action@v6
        with:
          context: src/systems/gatekeeper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/gatekeeper:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/gatekeeper:alpha-latest
      - name: Build and push blueprints
        uses: docker/build-push-action@v6
        with:
          context: src/systems/blueprints
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/blueprints:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/blueprints:alpha-latest
      - name: Build and push conductor
        uses: docker/build-push-action@v6
        with:
          context: src/systems/conductor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/conductor:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/conductor:alpha-latest
      - name: Build and push forge
        uses: docker/build-push-action@v6
        with:
          context: src/systems/forge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/forge:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/forge:alpha-latest
      - name: Build and push registry
        uses: docker/build-push-action@v6
        with:
          context: src/systems/registry
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/registry:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/registry:alpha-latest
      - name: Build and push gatekeeper integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/gatekeeper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/gatekeeper-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/gatekeeper-tests:alpha-latest
      - name: Build and push blueprints integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/blueprints
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/blueprints-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/blueprints-tests:alpha-latest
      - name: Build and push conductor integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/conductor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/conductor-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/conductor-tests:alpha-latest
      - name: Build and push forge integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/forge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/forge-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/forge-tests:alpha-latest
      - name: Build and push registry integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/registry
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/registry-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/registry-tests:alpha-latest
      - name: Build and push workflows
        uses: docker/build-push-action@v6
        with:
          context: src/systems/workflows
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/workflows:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/workflows:alpha-latest
      - name: Build and push tickets
        uses: docker/build-push-action@v6
        with:
          context: src/systems/tickets
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/tickets:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/tickets:alpha-latest
      - name: Build and push hooks
        uses: docker/build-push-action@v6
        with:
          context: src/systems/hooks
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/hooks:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/hooks:alpha-latest
      - name: Build and push workflows integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/workflows
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/workflows-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/workflows-tests:alpha-latest
      - name: Build and push tickets integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/tickets
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/tickets-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/tickets-tests:alpha-latest
      - name: Build and push hooks integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/hooks
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/hooks-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/hooks-tests:alpha-latest
      - name: Build and push egress-proxy
        uses: docker/build-push-action@v6
        with:
          context: src/systems/egress-proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/egress-proxy:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/egress-proxy:alpha-latest
      - name: Build and push containers
        uses: docker/build-push-action@v6
        with:
          context: src/systems/containers
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/containers:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/containers:alpha-latest
      - name: Build and push gitea_integration
        uses: docker/build-push-action@v6
        with:
          context: src/systems/gitea_integration
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/gitea_integration:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/gitea_integration:alpha-latest
      - name: Build and push gitea_integration integration tests
        uses: docker/build-push-action@v6
        with:
          context: tests/gitea_integration
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/gitea_integration-tests:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/gitea_integration-tests:alpha-latest
      - name: Build and push mcp
        uses: docker/build-push-action@v6
        with:
          context: src/systems/mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/code-armory-app/mcp:alpha-${{ needs.release.outputs.new_release_version }}
            ghcr.io/code-armory-app/mcp:alpha-latest

  build-cli:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o armory${{ matrix.ext }} .
        working-directory: src/cli
      - name: Rename binary
        run: mv src/cli/armory${{ matrix.ext }} armory_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
      - name: Upload to release
        run: gh release upload v${{ needs.release.outputs.new_release_version }} armory_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
