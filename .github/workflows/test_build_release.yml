name: test_build_release

on:
  push:
    branches:
      - main
      - beta
      - alpha
  pull_request:
    branches:
      - main
      - beta
      - alpha

permissions:
  contents: read

jobs:
  gatekeeper-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run gatekeeper unit tests
        run: cd src/systems/gatekeeper; go test .

  blueprints-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run blueprints unit tests
        run: cd src/systems/blueprints; go test .

  builder-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run builder unit tests
        run: cd src/systems/builder; go test .

  conductor-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run conductor unit tests
        run: cd src/systems/conductor; go test .

  cli-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run cli unit tests
        run: cd src/cli; go test .

  forge-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run forge unit tests
        run: cd src/systems/forge; go test .

  registry-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run registry unit tests
        run: cd src/systems/registry; go test .

  workflows-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run workflows unit tests
        run: cd src/systems/workflows; go test .

  hooks-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run hooks unit tests
        run: cd src/systems/hooks; go test .

  tickets-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Run tickets unit tests
        run: cd src/systems/tickets; go test .

  release:
    needs:
      - gatekeeper-unit-test
      - blueprints-unit-test
      - builder-unit-test
      - conductor-unit-test
      - cli-unit-test
      - forge-unit-test
      - registry-unit-test
      - workflows-unit-test
      - hooks-unit-test
      - tickets-unit-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      deployments: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_latest: ${{ steps.meta.outputs.image_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog@6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # alpha/beta are prerelease channels in .releaserc.json, so semantic-release
      # marks their GitHub releases as pre-release automatically. The image tag uses a
      # branch-derived prefix (none / beta- / alpha-) over the clean X.Y.Z version.
      - name: Compute image tags
        id: meta
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          version="${{ steps.semantic.outputs.new_release_version }}"
          base="${version%%-*}"
          case "${{ github.ref_name }}" in
            main)  prefix="";       latest="latest" ;;
            beta)  prefix="beta-";  latest="beta-latest" ;;
            alpha) prefix="alpha-"; latest="alpha-latest" ;;
            *)     prefix="${{ github.ref_name }}-"; latest="${{ github.ref_name }}-latest" ;;
          esac
          echo "image_tag=${prefix}${base}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${latest}" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - name: gatekeeper
            context: src/systems/gatekeeper
          - name: blueprints
            context: src/systems/blueprints
          - name: builder
            context: src/systems/builder
          - name: conductor
            context: src/systems/conductor
          - name: forge
            context: src/systems/forge
          - name: registry
            context: src/systems/registry
          - name: workflows
            context: src/systems/workflows
          - name: tickets
            context: src/systems/tickets
          - name: hooks
            context: src/systems/hooks
          - name: egress-proxy
            context: src/systems/egress-proxy
          - name: containers
            context: src/systems/containers
          - name: gitea_integration
            context: src/systems/gitea_integration
          - name: mcp
            context: src/systems/mcp
          - name: outpost-gateway
            context: src/systems/outpost-gateway
          - name: chaos
            context: src/systems/chaos
          - name: argo
            context: src/systems/argo
          - name: outpost
            context: src/systems/outpost
          - name: gatekeeper-tests
            context: tests/gatekeeper
          - name: blueprints-tests
            context: tests/blueprints
          - name: conductor-tests
            context: tests/conductor
          - name: forge-tests
            context: tests/forge
          - name: registry-tests
            context: tests/registry
          - name: workflows-tests
            context: tests/workflows
          - name: tickets-tests
            context: tests/tickets
          - name: hooks-tests
            context: tests/hooks
          - name: gitea_integration-tests
            context: tests/gitea_integration
          - name: outpost-gateway-tests
            context: tests/outpost-gateway
          - name: chaos-tests
            context: tests/chaos
          - name: argo-tests
            context: tests/argo
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/code-armory-app/${{ matrix.name }}:${{ needs.release.outputs.image_tag }}
            ghcr.io/code-armory-app/${{ matrix.name }}:${{ needs.release.outputs.image_latest }}

  build-cli:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o armory${{ matrix.ext }} .
        working-directory: src/cli
      - name: Rename binary
        run: mv src/cli/armory${{ matrix.ext }} armory_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
      - name: Upload to release
        run: gh release upload v${{ needs.release.outputs.new_release_version }} armory_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
