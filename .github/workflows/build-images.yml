name: build-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (without leading v, e.g. 1.4.1)"
        required: true
        type: string

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gatekeeper
            context: src/systems/gatekeeper
          - name: blueprints
            context: src/systems/blueprints
          - name: conductor
            context: src/systems/conductor
          - name: forge
            context: src/systems/forge
          - name: registry
            context: src/systems/registry
          - name: workflows
            context: src/systems/workflows
          - name: tickets
            context: src/systems/tickets
          - name: hooks
            context: src/systems/hooks
          - name: egress-proxy
            context: src/systems/egress-proxy
          - name: containers
            context: src/systems/containers
          - name: gitea_integration
            context: src/systems/gitea_integration
          - name: mcp
            context: src/systems/mcp
          - name: outpost-gateway
            context: src/systems/outpost-gateway
          - name: chaos
            context: src/systems/chaos
          - name: argo
            context: src/systems/argo
          - name: outpost
            context: src/systems/outpost
          - name: gatekeeper-tests
            context: tests/gatekeeper
          - name: blueprints-tests
            context: tests/blueprints
          - name: conductor-tests
            context: tests/conductor
          - name: forge-tests
            context: tests/forge
          - name: registry-tests
            context: tests/registry
          - name: workflows-tests
            context: tests/workflows
          - name: tickets-tests
            context: tests/tickets
          - name: hooks-tests
            context: tests/hooks
          - name: gitea_integration-tests
            context: tests/gitea_integration
          - name: outpost-gateway-tests
            context: tests/outpost-gateway
          - name: chaos-tests
            context: tests/chaos
          - name: argo-tests
            context: tests/argo
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/code-armory-app/${{ matrix.name }}:alpha-${{ inputs.version }}
            ghcr.io/code-armory-app/${{ matrix.name }}:alpha-latest
