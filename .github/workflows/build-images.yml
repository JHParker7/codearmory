name: build-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (without leading v, e.g. 1.4.1)"
        required: true
        type: string
      channel:
        description: "Release channel the tag belongs to"
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - main

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gatekeeper
            context: src/systems/gatekeeper
          - name: builder
            context: src/systems/builder
          - name: conductor
            context: src/systems/conductor
          - name: forge
            context: src/systems/forge
          - name: egress-proxy
            context: src/systems/egress-proxy
          - name: registry
            context: src/systems/registry
          - name: workflows
            context: src/systems/workflows
          - name: hooks
            context: src/systems/hooks
          - name: git
            context: src/systems/git
          - name: tickets
            context: src/systems/tickets
          - name: containers
            context: src/systems/containers
          - name: outpost-gateway
            context: src/systems/outpost-gateway
          - name: outpost
            context: src/systems/outpost
          - name: portal
            context: src/systems/portal
          - name: gatekeeper-tests
            context: tests/gatekeeper
          - name: conductor-tests
            context: tests/conductor
          - name: forge-tests
            context: tests/forge
          - name: registry-tests
            context: tests/registry
          - name: workflows-tests
            context: tests/workflows
          - name: hooks-tests
            context: tests/hooks
          - name: tickets-tests
            context: tests/tickets
          - name: outpost-gateway-tests
            context: tests/outpost-gateway
          - name: portal-tests
            context: tests/portal
          - name: portal-frontend-tests
            context: tests/portal-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Compute image tags
        id: meta
        run: |
          case "${{ inputs.channel }}" in
            main)  prefix="";       latest="latest" ;;
            beta)  prefix="beta-";  latest="beta-latest" ;;
            alpha) prefix="alpha-"; latest="alpha-latest" ;;
          esac
          echo "image_tag=${prefix}${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${latest}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/code-armory-app/${{ matrix.name }}:${{ steps.meta.outputs.image_tag }}
            ghcr.io/code-armory-app/${{ matrix.name }}:${{ steps.meta.outputs.image_latest }}
