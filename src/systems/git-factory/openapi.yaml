openapi: 3.1.0
info:
  title: codearmory_git_factory
  version: 0.1.0
  description: >
    Example codearmory service. Replace the widgets resource with your own.
    All endpoints require an Authorization: Bearer <jwt> and are authorised by
    gatekeeper (forward_auth: true).
servers:
  - url: http://localhost:9001
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200": { description: OK }
  /widgets:
    get:
      summary: List the caller's widgets
      responses:
        "200":
          description: Array of widgets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Widget" }
        "401": { description: Unauthorized }
    post:
      summary: Create a widget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWidget" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
        "400": { description: Invalid body }
        "401": { description: Unauthorized }
        "409": { description: Name already exists }
  /widgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get a widget
      responses:
        "200":
          description: Widget
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
        "404": { description: Not found }
    put:
      summary: Update a widget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWidget" }
      responses:
        "200": { description: Updated }
        "404": { description: Not found }
    delete:
      summary: Delete a widget
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
components:
  schemas:
    Widget:
      type: object
      properties:
        id: { type: string }
        owner: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateWidget:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
