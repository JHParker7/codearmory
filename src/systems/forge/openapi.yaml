openapi: 3.1.0
info:
  title: Forge — Sandboxed Code Execution
  description: |
    Runs user-submitted commands in isolated containers (Kubernetes or Docker).
    Executions are queued and processed asynchronously by a worker pool.

    ## Authentication

    All endpoints require a Gatekeeper-issued Bearer token:
    `Authorization: Bearer <token>`

    Forge verifies permissions directly with Gatekeeper rather than trusting
    the `X-User-ID` header injected by Conductor, to prevent privilege escalation
    via a compromised gateway.

    ## Allowed images

    The operator configures an explicit allowlist of permitted container images
    via the `ALLOWED_IMAGES` environment variable. Submissions referencing an
    image not in the allowlist are rejected with `400 Bad Request`.

    ## Environment variable restrictions

    The `env` map must use POSIX-compliant key names (`[A-Za-z_][A-Za-z0-9_]*`).
    Keys that could redirect interpreter or linker behaviour (e.g. `LD_PRELOAD`,
    `PYTHONPATH`, `NODE_OPTIONS`) are explicitly blocked.
  version: 1.0.0
  contact:
    email: jhp1403@gmail.com

servers:
  - url: http://localhost:8083
    description: Local development server

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      security: []
      responses:
        '200':
          description: Service is healthy

  /executions:
    post:
      summary: Submit execution
      operationId: submitExecution
      description: |
        Queues a new sandboxed execution. Returns `202 Accepted` immediately with
        the `execution_id`. Poll `GET /executions/{id}` for status and output.

        Constraints:
        - `image` must appear in the `ALLOWED_IMAGES` allowlist
        - `timeout` defaults to 30 s, capped at 3600 s
        - `env` keys must match `[A-Za-z_][A-Za-z0-9_]*` and must not be in the
          blocked-key denylist (interpreter/linker override variables)

        Permission: `createExecution` on `forge/executions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            example:
              image: alpine:3.19
              command: [sh, -c, echo hello]
              env:
                MY_VAR: hello
              timeout: 60
      responses:
        '202':
          description: Execution queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      summary: List executions
      operationId: listExecutions
      description: |
        Returns the last 100 executions submitted by the caller, ordered by
        `created_at` descending. `stdout` and `stderr` are not included in list
        responses; use `GET /executions/{id}` to retrieve output.

        Permission: `listExecution` on `forge/executions`.
      parameters:
        - name: project
          in: query
          schema:
            type: string
          description: Filter by project (workspace) label
      responses:
        '200':
          description: List of executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Execution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /executions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      summary: Get execution
      operationId: getExecution
      description: |
        Returns the full execution record, including `stdout` and `stderr` once
        the execution has completed. Only the submitting user can retrieve their
        own executions.

        Permission: `getExecution` on `forge/executions/{id}`.
      responses:
        '200':
          description: Execution record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Cancel execution
      operationId: cancelExecution
      description: |
        Cancels a `pending` or `running` execution. Returns `409` when the
        execution has already reached a terminal state.

        Permission: `deleteExecution` on `forge/executions/{id}`.
      responses:
        '204':
          description: Execution cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Execution already in a terminal state
          content:
            text/plain:
              schema:
                type: string

  /runner-classes:
    get:
      summary: List runner classes
      operationId: listRunnerClasses
      description: |
        Returns all runner classes ordered by name.

        Permission: `listRunnerClass` on `forge/runner-classes`.
      responses:
        '200':
          description: List of runner classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunnerClass'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create runner class
      operationId: createRunnerClass
      description: |
        Creates a new runner class. Returns `409` if a class with the same name
        already exists.

        Permission: `createRunnerClass` on `forge/runner-classes`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerClassBody'
      responses:
        '201':
          description: Runner class created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerClass'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Runner class already exists
          content:
            text/plain:
              schema:
                type: string

  /runner-classes/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Runner class name

    get:
      summary: Get runner class
      operationId: getRunnerClass
      description: |
        Permission: `getRunnerClass` on `forge/runner-classes/{name}`.
      responses:
        '200':
          description: Runner class
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerClass'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update runner class
      operationId: updateRunnerClass
      description: |
        Replaces all mutable fields of the named runner class. Changes take effect
        immediately for new submissions — no restart required.

        Permission: `updateRunnerClass` on `forge/runner-classes/{name}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerClassBody'
      responses:
        '200':
          description: Updated runner class
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerClass'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete runner class
      operationId: deleteRunnerClass
      description: |
        Deletes the named runner class. In-flight executions using this class are
        unaffected; only new submissions are rejected.

        Permission: `deleteRunnerClass` on `forge/runner-classes/{name}`.
      responses:
        '204':
          description: Runner class deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /runtime-backends:
    get:
      summary: List runtime backends
      operationId: listRuntimeBackends
      description: |
        Returns all runtime backends ordered by name. Read access is granted to
        users so a client can show which backend a runner class targets; create,
        update, and delete are admin-only.

        Permission: `listRuntimeBackend` on `forge/runtime-backends`.
      responses:
        '200':
          description: List of runtime backends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuntimeBackend'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create runtime backend
      operationId: createRuntimeBackend
      description: |
        Creates a runtime backend (admin only). Returns `409` if one with the same
        name already exists. A `kata` or `gvisor` backend validates that its
        `runtime_class` config key is set.

        Permission: `createRuntimeBackend` on `forge/runtime-backends`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeBackendBody'
      responses:
        '201':
          description: Runtime backend created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBackend'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Runtime backend already exists
          content:
            text/plain:
              schema:
                type: string

  /runtime-backends/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Runtime backend name

    get:
      summary: Get runtime backend
      operationId: getRuntimeBackend
      description: |
        Permission: `getRuntimeBackend` on `forge/runtime-backends/{name}`.
      responses:
        '200':
          description: Runtime backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBackend'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update runtime backend
      operationId: updateRuntimeBackend
      description: |
        Replaces the backend's mutable fields (admin only). The registry evicts its
        cached runtime so the change applies to new jobs without a restart.

        Permission: `updateRuntimeBackend` on `forge/runtime-backends/{name}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeBackendBody'
      responses:
        '200':
          description: Updated runtime backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBackend'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete runtime backend
      operationId: deleteRuntimeBackend
      description: |
        Deletes the named backend (admin only). The `default` backend cannot be
        deleted and returns `409`.

        Permission: `deleteRuntimeBackend` on `forge/runtime-backends/{name}`.
      responses:
        '204':
          description: Runtime backend deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot delete the default runtime backend
          content:
            text/plain:
              schema:
                type: string

  /volumes:
    post:
      operationId: createVolume
      summary: Create a shared workspace volume
      description: |
        Provisions a run-scoped shared volume (a RAM/tmpfs-backed PVC in Kubernetes,
        a tmpfs named volume in Docker) that a workflow's steps attach via the
        `volumes` key on a run. Enforces the admin's per-workflow total-size cap
        (`FORGE_MAX_WORKFLOW_VOLUME_MB`): a request that would push the workflow's
        summed volume size over the cap is rejected with 409. Creating the same
        `(workflow_id, name)` twice is idempotent.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolumeRequest'
      responses:
        '201':
          description: Volume created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        '200':
          description: Volume already existed (idempotent create)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        '400':
          description: Invalid request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Per-workflow volume size cap exceeded
    get:
      operationId: listVolume
      summary: List a workflow's active volumes
      security: [{ bearerAuth: [] }]
      parameters:
        - name: workflow_id
          in: query
          schema:
            type: string
          description: Restrict to this workflow's volumes (all active volumes when omitted).
      responses:
        '200':
          description: Volumes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Volume'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteVolume
      summary: Tear down a workflow's volumes
      description: |
        Deletes every active volume for `workflow_id` (the run-teardown path), or a
        single one when `name` is also given. Idempotent — an already-gone volume is
        a no-op.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: workflow_id
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
          description: Delete only this named volume within the workflow.
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        '400':
          description: workflow_id is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token issued by the Gatekeeper service

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Execution UUID

  schemas:
    SubmitRequest:
      type: object
      required:
        - image
        - command
      properties:
        image:
          type: string
          description: Container image. Must be in the operator-configured allowlist.
          example: alpine:3.19
        command:
          type: array
          items:
            type: string
          minItems: 1
          description: Command and arguments passed to the container entrypoint
          example: [sh, -c, echo hello]
        env:
          type: object
          additionalProperties:
            type: string
          description: |
            Environment variables injected into the container.
            Keys must match `[A-Za-z_][A-Za-z0-9_]*`. Interpreter/linker
            override keys (e.g. `LD_PRELOAD`, `PYTHONPATH`) are blocked.
        timeout:
          type: integer
          description: Execution timeout in seconds. Defaults to 30, capped at 3600.
          default: 30
          minimum: 1
          maximum: 3600
        runner_class:
          type: string
          description: |
            Resource tier for the execution. Defaults to `standard`. Must be an
            enabled runner class. Returns `400` if the class does not exist or is
            disabled.
          default: standard
          example: standard
        project:
          type: string
          description: Project (workspace) label to tag the execution with
        secret_refs:
          type: object
          additionalProperties:
            type: string
          description: |
            Maps a target env var name to a credential reference, resolved at
            dispatch and injected into the runtime env only — never persisted or
            logged. Supported references:
              * `secret:<name>` — a gatekeeper org secret (e.g. a git SSH deploy
                key or token for GitHub/Bitbucket). Requires org membership.
              * `gitea:<owner>/<repo>` — mints a short-lived Forgejo clone URL
                (`https://user:token@host/owner/repo.git`) for the caller's
                linked account.
            Target keys follow the same rules as `env` and may not collide with a
            plaintext `env` key.
          example:
            REPO_URL: gitea:codearmory/codearmory
            GIT_DEPLOY_KEY: secret:github-deploy-key
        output_env:
          type: array
          items:
            type: string
          description: |
            Names of environment variables to capture from the command's shell
            after it runs (the values a script exported/computed). Captured into
            the execution's `outputs` map — used by workflows as the step output.
            Requires a shell (`-c`) command. At most 32 names.
        checkout:
          allOf:
            - $ref: '#/components/schemas/CheckoutSpec'
          description: |
            When set, forge `git clone`s a repo into the sandbox working dir and
            `cd`s into it before running `command` — the actions/checkout
            equivalent. The clone URL is read at runtime from the env var named by
            `checkout.env` (default `GIT_CLONE_URL`), typically populated by a
            `git:`/`gitea:` `secret_ref`. Requires `git` in the image and a shell
            (`-c`) command; a clone failure fails the whole execution.
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/VolumeMount'
          description: |
            Shared workspace volumes to attach to the sandbox. Each references a
            volume created via `POST /volumes` by its `(workflow_id, name)` handle
            and mounts it at `mount_path`. Used to share a checked-out repo and
            build artifacts between the steps of a workflow run. Each referenced
            volume must already exist and belong to the caller.
        build:
          allOf:
            - $ref: '#/components/schemas/BuildSpec'
          description: |
            When set, this is an image-build execution: forge derives `image` (its
            Kaniko builder) and `command` (the assembled build invocation)
            from the spec, so any `image`/`command` you send are ignored. Built with
            Kaniko (daemonless). Requires a **privileged** runner class on a **kata**
            or **gvisor** backend (root + writable rootfs, safe behind the VM/Sentry
            boundary); rejected on the shared-kernel docker/kubernetes backends.
        copy:
          allOf:
            - $ref: '#/components/schemas/CopySpec'
          description: |
            When set, this is a volume-copy execution: forge derives `image` (its
            minimal runner image) and `command` (a synthesised `cp` script) from the
            spec, so any `image`/`command` you send are ignored. Copies declared paths
            between the attached `volumes` — the primitive behind scatter-clone (seed a
            per-leg volume from the base workspace) and gather (union finished legs back
            into the base). Needs no CSI clone and no ReadWriteMany.
        resolve:
          allOf:
            - $ref: '#/components/schemas/ResolveSpec'
          description: |
            When set, this is a resolve-paths execution: forge derives `image` (its
            minimal runner image) and `command` (a synthesised find | grep) from the
            spec, so any `image`/`command` you send are ignored. Scans an attached
            volume and captures the entries whose path matches a regex (the fan-out set
            behind a scatter) as the named `output`, read back via `outputs`.

    ResolveSpec:
      type: object
      required: [regex]
      description: |
        Resolve-paths configuration (see SubmitRequest.resolve). Lists the entries of an
        attached volume whose relative path matches a regex.
      properties:
        volume:
          type: string
          description: Name of the attached volume to scan (a `volumes[].name`). Defaults to the workdir mount, else the single mount.
        regex:
          type: string
          description: POSIX ERE (grep -E) matched against each entry's path relative to the volume root.
          example: ^services/[^/]+$
        mode:
          type: string
          enum: [dir, file]
          description: Match directories (default) or files.
        max_depth:
          type: integer
          description: Bound how deep to descend (find -maxdepth). 0/unset = unlimited.
        output:
          type: string
          description: Env var / output key the sorted, newline-separated match list is captured into. Default "paths".

    CopySpec:
      type: object
      required: [sources]
      description: |
        Volume-copy configuration (see SubmitRequest.copy). Copies files between
        attached shared volumes; the destination is the mount marked `workdir: true`,
        sources are the other mounts (attach them read_only).
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CopySource'
          description: Read-only source volumes to copy from, each with the paths to copy.
        disjoint:
          type: boolean
          description: |
            Fail the copy if two sources would write the same relative path — turns a
            multi-leg gather into a checked union instead of a silent last-writer-wins.
            Leave off for a single-source clone. The whole-tree "." path is not allowed
            when set.

    CopySource:
      type: object
      required: [volume]
      description: One source volume and the relative paths to copy from it.
      properties:
        volume:
          type: string
          description: Name of an attached volume (a `volumes[].name`) that is not the destination.
        paths:
          type: array
          items:
            type: string
          description: |
            Relative paths within the source's mount to copy (preserving their relative
            location under the destination). Empty or ["."] means the whole tree (clone);
            not allowed when `disjoint` is set.

    BuildSpec:
      type: object
      description: Container-image build configuration (see SubmitRequest.build).
      properties:
        context:
          type: string
          description: Build-context directory (default /workspace — usually an attached shared volume).
          example: /workspace
        dockerfile:
          type: string
          description: Dockerfile path relative to the context. Default "Dockerfile".
          example: docker/Dockerfile
        destinations:
          type: array
          items:
            type: string
          description: Image refs to build and push. Required unless no_push.
          example: [registry.example.com/acme/app:1.2.3, registry.example.com/acme/app:latest]
        build_args:
          type: object
          additionalProperties:
            type: string
          description: Dockerfile ARG values.
        target:
          type: string
          description: Stage to build in a multi-stage Dockerfile (optional).
        registry_auth:
          type: string
          description: |
            Name of the env var (set via a `secret_refs` entry) holding a Docker
            config.json used to authenticate the push. Default REGISTRY_AUTH.
            Required when pushing.
        no_push:
          type: boolean
          description: Build without pushing (a validation/PR build).

    VolumeMount:
      type: object
      required: [workflow_id, name]
      description: Attaches a shared workspace volume to an execution.
      properties:
        workflow_id:
          type: string
          description: The workflow-run scope the volume was created under.
        name:
          type: string
          description: The volume's logical handle within the workflow (a DNS-1123 label).
          example: workspace
        mount_path:
          type: string
          description: Absolute path to mount the volume at. Defaults to /workspace.
          example: /workspace
        read_only:
          type: boolean
          description: Mount read-only. Defaults to false.
        workdir:
          type: boolean
          description: |
            Set the container working directory to `mount_path`, so the command
            runs inside the shared volume (e.g. a checked-out repo). At most one
            attached volume per execution may set this.

    CreateVolumeRequest:
      type: object
      required: [workflow_id]
      properties:
        workflow_id:
          type: string
          description: The workflow-run scope. Volumes sharing it count against the per-workflow size cap and are torn down together.
        name:
          type: string
          description: Logical handle within the workflow (DNS-1123 label). Defaults to `workspace`.
          example: workspace
        size_mb:
          type: integer
          description: Requested size in MB (floored to 16, bounded by FORGE_MAX_VOLUME_MB).
          example: 1024
        medium:
          type: string
          enum: [memory, disk]
          description: '`memory` (default) is RAM/tmpfs-backed; `disk` is node-disk-backed.'
        mount_path:
          type: string
          description: Default mount path recorded for the volume. Defaults to /workspace.
        runner_class:
          type: string
          description: Resolve the backend from this runner class (if `backend` is unset).
        backend:
          type: string
          description: Runtime backend to provision the volume on. Defaults to the class's backend, else `default`.

    Volume:
      type: object
      properties:
        resource_name:
          type: string
          description: The concrete backend object (PVC / docker volume) name, derived from (workflow_id, name).
        workflow_id:
          type: string
        name:
          type: string
        size_mb:
          type: integer
        medium:
          type: string
        mount_path:
          type: string
        backend:
          type: string
        status:
          type: string
          enum: [active, deleted]
        created_at:
          type: string
          format: date-time

    CheckoutSpec:
      type: object
      description: actions/checkout-style clone configuration (see SubmitRequest.checkout).
      properties:
        env:
          type: string
          description: |
            Env var holding the authenticated clone URL. Must also be set by
            `secret_refs` or `env`. Defaults to `GIT_CLONE_URL`.
          default: GIT_CLONE_URL
        path:
          type: string
          description: |
            Directory (relative to the working dir) to clone into and cd into.
            Must be a relative path of `[A-Za-z0-9._/-]` with no `..`. When the
            working dir is a shared workspace volume (a `workdir: true` mount, as
            `forge/git-clone` sets), an unset path clones into the volume root so
            the volume itself is the working tree; otherwise it defaults to the
            repo name derived from the `git:`/`gitea:` ref, else `repo`.
          example: src
        ref:
          type: string
          description: |
            Branch or tag to check out (`git clone --branch`). Empty clones the
            remote's default branch. Commit SHAs are not supported here.
          example: main
        depth:
          type: integer
          minimum: 0
          description: |
            `git clone --depth`. Omit for a shallow depth-1 clone (like
            actions/checkout); `0` requests a full clone.
          example: 1

    Execution:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        image:
          type: string
          example: alpine:3.19
        command:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        timeout:
          type: integer
          description: Configured timeout in seconds
        runner_class:
          type: string
          description: Runner class used for this execution.
          example: standard
        project:
          type: string
          description: Free-text project (workspace) label; a view filter, not a permission boundary
        checkout:
          allOf:
            - $ref: '#/components/schemas/CheckoutSpec'
          nullable: true
          description: actions/checkout-style clone configuration, if requested at submit.
        status:
          type: string
          enum: [pending, running, completed, failed, timed_out, cancelled]
        exit_code:
          type: integer
          nullable: true
          description: Container exit code. Present when status is `completed` or `failed`.
        stdout:
          type: string
          nullable: true
          description: |
            Standard output (up to 1 MB). Present on `GET /executions/{id}` once
            execution is complete. Not included in list responses.
        stderr:
          type: string
          nullable: true
          description: |
            Standard error (up to 1 MB). Present on `GET /executions/{id}` once
            execution is complete. Not included in list responses.
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        ended_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    RunnerClass:
      type: object
      properties:
        name:
          type: string
          description: Unique identifier for the runner class.
          example: standard
        memory_mb:
          type: integer
          description: Memory limit in megabytes.
          example: 256
        cpu_millicores:
          type: integer
          description: CPU limit in millicores (1000 = one full core).
          example: 500
        pids_limit:
          type: integer
          description: Maximum number of processes the container may create.
          example: 64
        tmpfs_mb:
          type: integer
          description: Size of the writable /tmp tmpfs in megabytes.
          example: 64
        disk_gb:
          type: integer
          description: |
            Reserved for a future VM-style backend (per-class disk size);
            currently ignored by all backends.
          example: 10
        backend:
          type: string
          description: |
            Name of the runtime backend this class runs on. Defaults to
            `default` (the backend seeded from the legacy RUNTIME env).
          example: default
        enabled:
          type: boolean
          description: Whether this class can be selected for new submissions.
          example: true

    RunnerClassBody:
      type: object
      required:
        - name
        - memory_mb
        - cpu_millicores
        - pids_limit
        - tmpfs_mb
        - enabled
      properties:
        name:
          type: string
          description: Unique name for the runner class. Ignored on PUT (name comes from path).
          example: gpu-small
        memory_mb:
          type: integer
          description: Memory limit in megabytes. Minimum 64.
          minimum: 64
          example: 512
        cpu_millicores:
          type: integer
          description: CPU limit in millicores. Minimum 100.
          minimum: 100
          example: 1000
        pids_limit:
          type: integer
          description: Maximum process count. Minimum 8.
          minimum: 8
          example: 64
        tmpfs_mb:
          type: integer
          description: /tmp size in megabytes. Minimum 16.
          minimum: 16
          example: 64
        disk_gb:
          type: integer
          description: |
            Reserved for a future VM-style backend (per-class disk size);
            currently ignored by all backends. Minimum 0.
          minimum: 0
          example: 20
        backend:
          type: string
          description: |
            Runtime backend name. Empty defaults to `default`. Must reference a
            backend created via `/runtime-backends`.
          example: default
        enabled:
          type: boolean
          description: Whether the class can be selected for new submissions.
          example: true

    RuntimeBackend:
      type: object
      properties:
        name:
          type: string
          description: Unique backend name. Runner classes reference it by name.
          example: kata-prod
        type:
          type: string
          enum: [docker, kubernetes, kata, gvisor]
          description: Runtime implementation this backend selects.
          example: kata
        enabled:
          type: boolean
          description: Whether the backend may be used by new jobs.
          example: true
        config:
          type: object
          additionalProperties:
            type: string
          description: |
            Non-secret backend settings. For kata: `runtime_class` (required, the
            Kubernetes RuntimeClass, e.g. `kata-qemu`). For gvisor: `runtime_class`
            (required, the gVisor RuntimeClass, e.g. `gvisor` — no /dev/kvm
            needed). kubernetes accepts an optional `runtime_class` (else
            K8S_RUNTIME_CLASS). docker reads env instead.
          example:
            runtime_class: kata-qemu
        secret_refs:
          type: object
          additionalProperties:
            type: string
          description: |
            Maps a logical key to the NAME of an environment variable read via the
            secret() convention — only env var names are stored and returned, never
            secret values. The built-in backends (docker/kubernetes/kata/gvisor)
            need none.
          example: {}
        created_at:
          type: string
          format: date-time

    RuntimeBackendBody:
      type: object
      required:
        - name
        - type
        - enabled
      properties:
        name:
          type: string
          description: Unique backend name. Ignored on PUT (name comes from path).
          example: kata-prod
        type:
          type: string
          enum: [docker, kubernetes, kata, gvisor]
          example: kata
        enabled:
          type: boolean
          example: true
        config:
          type: object
          additionalProperties:
            type: string
        secret_refs:
          type: object
          additionalProperties:
            type: string

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        text/plain:
          schema:
            type: string

    Unauthorized:
      description: Missing or invalid Authorization header
      content:
        text/plain:
          schema:
            type: string

    Forbidden:
      description: Insufficient permissions
      content:
        text/plain:
          schema:
            type: string

    NotFound:
      description: Execution not found or not owned by the caller
      content:
        text/plain:
          schema:
            type: string
