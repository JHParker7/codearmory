openapi: 3.0.3
info:
  title: Git Credential Broker
  version: 0.1.0
  description: >
    Backend-agnostic git credential broker. Users link git backends (GitHub,
    GitLab, Forgejo, or a generic git server); the broker mints short-lived clone
    credentials on demand and serves forge/workflows via an internal endpoint.
    Credential material is encrypted at rest and never returned in backend reads.
servers:
  - url: /git
paths:
  /backends:
    get:
      summary: List the caller's linked git backends (no secrets)
      operationId: listBackend
      responses:
        "200":
          description: Array of backends
    post:
      summary: Link a new git backend
      operationId: createBackend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackend"
      responses:
        "201":
          description: Created
        "409":
          description: A backend with the same name or host already exists
  /backends/{id}:
    get:
      summary: Get a backend (no secrets)
      operationId: getBackend
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Backend }
        "404": { description: Not found }
    put:
      summary: Update a backend's base URL and/or auth
      operationId: updateBackend
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Updated }
    delete:
      summary: Unlink a backend
      operationId: deleteBackend
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Deleted }
  /backends/{id}/test:
    post:
      summary: Verify a backend can mint credentials
      operationId: testBackend
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: '{ ok, backend_type, auth_mode, expires_at }' }
  /credentials:
    post:
      summary: Mint a credential for a repository URL
      operationId: mintCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo_url]
              properties:
                repo_url: { type: string }
      responses:
        "200": { description: Credential with authenticated clone_url }
        "404": { description: No backend linked for the repo host }
components:
  schemas:
    CreateBackend:
      type: object
      required: [name, type, base_url, auth]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [github, gitlab, forgejo, generic]
        base_url: { type: string }
        auth:
          type: object
          properties:
            mode: { type: string, enum: [app, pat, token, oauth, admin, basic] }
            app_id: { type: integer }
            installation_id: { type: integer }
            private_key: { type: string }
            token: { type: string }
            username: { type: string }
            password: { type: string }
            refresh_token: { type: string }
            client_id: { type: string }
            client_secret: { type: string }
            admin_token: { type: string }
