openapi: 3.1.0
info:
  title: Builder
  version: 0.1.0
  description: >
    Org-level service control plane. Org admins enable, disable, configure,
    register and remove services for their org. A null/"default" org is the
    baseline every org inherits. Phase 1 is the declarative desired-state store;
    a reconciling controller (Phase 2) deploys enabled services into per-org
    namespaces.
servers:
  - url: /builder
paths:
  /orgs/{id}/services:
    get:
      summary: List the effective service state for an org
      description: >
        Returns the live service catalog overlaid with the default-scope baseline
        and the org's overrides. Use the literal id "default" to view/manage the
        baseline (platform admins only).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "org id, or 'default'" }
      responses:
        "200":
          description: Effective service list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceView" }
        "403": { description: Forbidden }
  /orgs/{id}/services/{service}:
    get:
      summary: Get the effective state of one service for an org
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Effective service state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceView" }
    put:
      summary: Enable/disable/configure a service for an org
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetServiceRequest" }
      responses:
        "200":
          description: Resulting effective state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceView" }
        "400": { description: Invalid request (e.g. core service, bad custom fields) }
        "403": { description: Forbidden }
    delete:
      summary: Remove an org override (revert to the default baseline) or delete a custom service
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "404": { description: No override configured }
components:
  schemas:
    ServiceView:
      type: object
      properties:
        service: { type: string }
        enabled: { type: boolean }
        kind: { type: string, enum: [platform, custom] }
        source: { type: string, enum: [catalog, default, override, custom, core] }
        config: { type: object, additionalProperties: true }
        image: { type: string }
        port: { type: integer }
        description: { type: string }
        core: { type: boolean }
    SetServiceRequest:
      type: object
      properties:
        enabled: { type: boolean, description: "defaults to true when omitted" }
        kind: { type: string, enum: [platform, custom], default: platform }
        config: { type: object, additionalProperties: true }
        image: { type: string, description: "required for kind=custom" }
        port: { type: integer, description: "required for kind=custom" }
        description: { type: string }
