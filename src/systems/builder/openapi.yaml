openapi: 3.1.0
info:
  title: Builder
  version: 0.1.0
  description: >
    Global service control plane. The system admin enables, disables, configures,
    registers and removes platform services for the whole instance via a single
    global baseline — there is no per-org scope. Phase 1 is the declarative
    desired-state store; a reconciling controller (Phase 2) deploys enabled
    services into the cluster.
servers:
  - url: /builder
paths:
  /services:
    get:
      summary: List the effective global service state
      description: >
        Returns the live service catalog overlaid with the global baseline rows.
        System admin only.
      responses:
        "200":
          description: Effective service list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceView" }
        "403": { description: Forbidden }
  /services/{service}:
    get:
      summary: Get the effective state of one service
      parameters:
        - { name: service, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Effective service state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceView" }
    put:
      summary: Enable/disable/configure a service globally
      parameters:
        - { name: service, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetServiceRequest" }
      responses:
        "200":
          description: Resulting effective state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceView" }
        "400": { description: Invalid request (e.g. core service, bad custom fields) }
        "403": { description: Forbidden }
    delete:
      summary: Remove a service baseline row (revert to catalog default) or delete a custom service
      parameters:
        - { name: service, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "404": { description: No baseline row configured }
components:
  schemas:
    ServiceView:
      type: object
      properties:
        service: { type: string }
        enabled: { type: boolean, description: "false for a catalog service with no baseline row (deployed/registered only once enabled); core services are always true" }
        kind: { type: string, enum: [platform, custom] }
        source: { type: string, enum: [catalog, default, override, custom, core] }
        config: { type: object, additionalProperties: true }
        image: { type: string }
        port: { type: integer }
        description: { type: string }
        core: { type: boolean }
    SetServiceRequest:
      type: object
      properties:
        enabled: { type: boolean, description: "defaults to true when omitted" }
        kind: { type: string, enum: [platform, custom], default: platform }
        config: { type: object, additionalProperties: true }
        image: { type: string, description: "required for kind=custom" }
        port: { type: integer, description: "required for kind=custom" }
        description: { type: string }
