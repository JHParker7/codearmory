openapi: 3.1.0
info:
  title: Tickets — Task Tracker
  description: |
    General-purpose task tracker. Tickets are org-scoped and may reference
    workflow runs, forge executions, and other linked resources.

    ## Owner-first per-record resources

    A per-record endpoint comes in two shapes:

    - `/tickets/{ns}/{id}` — preferred. The permission resource names the OWNER
      (`{ns}/tickets/tickets/{id}`), so gatekeeper evaluates the check against the
      namespace that actually holds the record. `{ns}` is the owner's username and
      is returned as `namespace` on every ticket, so a client that listed a ticket
      already has what it needs to address it. A namespace that is not the record's
      own is refused with `404`.
    - `/tickets/{id}` — legacy, caller-scoped. The resource carries no owner, so
      gatekeeper scopes it to whoever asked and the check is the same for any id;
      access rests entirely on this service's own owner filter. Retained so existing
      clients keep working, and for rows created before `namespace` existed (their
      `namespace` is empty). It will be removed once the CLI and portal migrate.

    Collection endpoints (`GET`/`POST /tickets`) stay caller-scoped: "show me mine"
    is a caller-relative question with no single owner to name.

    ## Authentication

    All endpoints require a Gatekeeper-issued Bearer token:
    `Authorization: Bearer <token>`

    Authorisation is delegated to Gatekeeper. Requests from outside the ticket
    owner's org receive `404 Not Found` rather than `403 Forbidden` to avoid
    information disclosure.
  version: 1.0.0
  contact:
    email: jhp1403@gmail.com

servers:
  - url: http://localhost:8086
    description: Local development server

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      security: []
      responses:
        '200':
          description: Service is healthy

  /tickets:
    post:
      summary: Create ticket
      operationId: createTicket
      description: |
        Creates a ticket scoped to the caller's user ID and org.
        Status defaults to `open`; priority defaults to `medium`.

        Permission: `createTicket` on `tickets/tickets`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      summary: List tickets
      operationId: listTickets
      description: |
        Returns the last 100 tickets the caller created or that belong to their org.
        Supports optional query filters.

        Permission: `listTicket` on `tickets/tickets`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: assignee_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by assignee user ID
        - name: project
          in: query
          schema:
            type: string
          description: Filter by project (workspace) label
      responses:
        '200':
          description: List of tickets (comments array is empty in list responses)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      summary: Get ticket
      operationId: getTicket
      description: |
        Returns a ticket with its comments. Returns `404` when the ticket does not
        exist or is outside the caller's org.

        Permission: `getTicket` on `{ns}/tickets/tickets/{id}` when called as
        `/tickets/{ns}/{id}`, or `tickets/tickets/{id}` on the legacy `/tickets/{id}`
        form. See the note on owner-first resources below.
      responses:
        '200':
          description: Ticket with comments
          headers:
            ETag:
              description: |
                The ticket's current version. Send it back as `If-Match` on `PUT`
                to make the update conditional.
              schema:
                type: string
                example: '"7"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update ticket
      operationId: updateTicket
      description: |
        Replaces all mutable ticket fields. Omitting `status` or `priority`
        preserves the current value.

        **Optimistic concurrency.** Without `If-Match` this is last-write-wins:
        two callers can both read a ticket, both write, and both believe they
        won, silently discarding the first change. Send the `ETag` from a `GET`
        (or from a previous `PUT`) as `If-Match` to make the write conditional —
        the server applies it only if nobody else has changed the ticket since,
        and returns `412` otherwise with the current version in the `ETag` header
        so the client knows what to rebase onto.

        `If-Match` is optional and clients that omit it are unaffected, so this is
        additive. `If-Match: *` requires only that the ticket exists. A malformed
        value is rejected with `400` rather than ignored: silently dropping the
        condition would turn a request that asked for safety into an overwrite.

        Permission: `updateTicket` on `{ns}/tickets/tickets/{id}` when called as
        `/tickets/{ns}/{id}`, or `tickets/tickets/{id}` on the legacy `/tickets/{id}`
        form.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: |
            The ticket version the caller believes is current, as returned in
            `ETag`. `*` matches any existing ticket.
          schema:
            type: string
            example: '"7"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Updated ticket with current comments
          headers:
            ETag:
              description: The ticket's new version after this write.
              schema:
                type: string
                example: '"8"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: |
            The `If-Match` version did not match: somebody else changed the ticket
            first and nothing was written. Re-read the ticket and retry.
          headers:
            ETag:
              description: The ticket's current version, to rebase onto.
              schema:
                type: string
                example: '"9"'

    delete:
      summary: Delete ticket
      operationId: deleteTicket
      description: |
        Soft-deletes the ticket. Hidden from all subsequent API responses.

        Permission: `deleteTicket` on `{ns}/tickets/tickets/{id}` when called as
        `/tickets/{ns}/{id}`, or `tickets/tickets/{id}` on the legacy `/tickets/{id}`
        form.
      responses:
        '204':
          description: Ticket deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/Id'

    post:
      summary: Add comment
      operationId: addComment
      description: |
        Appends a comment to the ticket. The caller must have org-level access to
        the parent ticket.

        Permission: `createComment` on `{ns}/tickets/tickets/{id}` when called as
        `/tickets/{ns}/{id}/comments`, or `tickets/tickets/{id}` on the legacy form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketComment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{id}/comments/{comment_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      summary: Delete comment
      operationId: deleteComment
      description: |
        Soft-deletes a comment. The comment author or any user with org-level ticket
        access may delete. Returns `403` when neither condition is met.

        Permission: `deleteComment` on `{ns}/tickets/tickets/{id}/comments/{comment_id}`
        when called with a namespace, or the `tickets/`-prefixed form on the legacy path.
      responses:
        '204':
          description: Comment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token issued by the Gatekeeper service

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID

  schemas:
    Ticket:
      type: object
      properties:
        ticket_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          example: Deploy v1.2 to production
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
          default: open
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        project:
          type: string
          description: Free-text project (workspace) label; a view filter, not a permission boundary
        board_id:
          type: string
          format: uuid
          description: The board this ticket belongs to. Every ticket has a board.
        version:
          type: integer
          format: int64
          readOnly: true
          description: |
            Optimistic-concurrency token, incremented by the server on every write
            and also served as the `ETag` header. Send it back as `If-Match` on
            `PUT` to avoid silently overwriting a concurrent change.
        created_by:
          type: string
          format: uuid
          readOnly: true
        org_id:
          type: string
          readOnly: true
        assignee_id:
          type: string
          format: uuid
          nullable: true
        workflow_id:
          type: string
          format: uuid
          nullable: true
        run_id:
          type: string
          format: uuid
          nullable: true
        forge_execution_id:
          type: string
          format: uuid
          nullable: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/TicketComment'
          description: Populated on GET /tickets/{id}; empty array in list responses
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    TicketComment:
      type: object
      properties:
        comment_id:
          type: string
          format: uuid
          readOnly: true
        ticket_id:
          type: string
          format: uuid
          readOnly: true
        author_id:
          type: string
          format: uuid
          readOnly: true
        body:
          type: string
          example: Deployment complete, closing.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    CreateTicketRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: Deploy v1.2 to production
        description:
          type: string
        status:
          type: string
          description: >-
            Status column for the new ticket. Omitting defaults to the board's
            left-most column. Must be one of the board's configured status
            columns.
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        project:
          type: string
          description: Project (workspace) label to tag the ticket with
        board_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Board to place the ticket on. Every ticket has a board: omitting or
            passing null/"" places it on the caller's default board (created on
            first use).
        assignee_id:
          type: string
          format: uuid
          nullable: true
        workflow_id:
          type: string
          format: uuid
          nullable: true
        run_id:
          type: string
          format: uuid
          nullable: true
        forge_execution_id:
          type: string
          format: uuid
          nullable: true

    UpdateTicketRequest:
      type: object
      properties:
        title:
          type: string
          description: Omitting (or empty) preserves the current title
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
          description: Omitting preserves the current status
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: Omitting preserves the current priority
        project:
          type: string
          description: Project (workspace) label; omitting (or empty) preserves the current value
        board_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Omitting preserves the current board; "" re-homes the ticket to the
            caller's default board (tickets always have a board)
        assignee_id:
          type: string
          format: uuid
          nullable: true
        workflow_id:
          type: string
          format: uuid
          nullable: true
        run_id:
          type: string
          format: uuid
          nullable: true
        forge_execution_id:
          type: string
          format: uuid
          nullable: true

    AddCommentRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          example: Deployment complete, closing.

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        text/plain:
          schema:
            type: string

    Unauthorized:
      description: Missing or invalid Authorization header
      content:
        text/plain:
          schema:
            type: string

    Forbidden:
      description: Insufficient permissions
      content:
        text/plain:
          schema:
            type: string

    NotFound:
      description: Resource not found or not accessible to the caller
      content:
        text/plain:
          schema:
            type: string
