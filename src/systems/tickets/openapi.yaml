openapi: 3.1.0
info:
  title: Tickets — Task Tracker
  description: |
    General-purpose task tracker. Tickets are org-scoped and may reference
    workflow runs, forge executions, and other linked resources.

    ## Authentication

    All endpoints require a Gatekeeper-issued Bearer token:
    `Authorization: Bearer <token>`

    Authorisation is delegated to Gatekeeper. Requests from outside the ticket
    owner's org receive `404 Not Found` rather than `403 Forbidden` to avoid
    information disclosure.
  version: 1.0.0
  contact:
    email: jhp1403@gmail.com

servers:
  - url: http://localhost:8086
    description: Local development server

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      security: []
      responses:
        '200':
          description: Service is healthy

  /tickets:
    post:
      summary: Create ticket
      operationId: createTicket
      description: |
        Creates a ticket scoped to the caller's user ID and org.
        Status defaults to `open`; priority defaults to `medium`.

        Permission: `createTicket` on `tickets/tickets`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      summary: List tickets
      operationId: listTickets
      description: |
        Returns the last 100 tickets the caller created or that belong to their org.
        Supports optional query filters.

        Permission: `listTicket` on `tickets/tickets`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: assignee_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by assignee user ID
        - name: project
          in: query
          schema:
            type: string
          description: Filter by project (workspace) label
      responses:
        '200':
          description: List of tickets (comments array is empty in list responses)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      summary: Get ticket
      operationId: getTicket
      description: |
        Returns a ticket with its comments. Returns `404` when the ticket does not
        exist or is outside the caller's org.

        Permission: `getTicket` on `tickets/tickets/{id}`.
      responses:
        '200':
          description: Ticket with comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update ticket
      operationId: updateTicket
      description: |
        Replaces all mutable ticket fields. Omitting `status` or `priority`
        preserves the current value.

        Permission: `updateTicket` on `tickets/tickets/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Updated ticket with current comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete ticket
      operationId: deleteTicket
      description: |
        Soft-deletes the ticket. Hidden from all subsequent API responses.

        Permission: `deleteTicket` on `tickets/tickets/{id}`.
      responses:
        '204':
          description: Ticket deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/Id'

    post:
      summary: Add comment
      operationId: addComment
      description: |
        Appends a comment to the ticket. The caller must have org-level access to
        the parent ticket.

        Permission: `createComment` on `tickets/tickets/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketComment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{id}/comments/{comment_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      summary: Delete comment
      operationId: deleteComment
      description: |
        Soft-deletes a comment. The comment author or any user with org-level ticket
        access may delete. Returns `403` when neither condition is met.

        Permission: `deleteComment` on `tickets/tickets/{id}/comments/{comment_id}`.
      responses:
        '204':
          description: Comment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token issued by the Gatekeeper service

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID

  schemas:
    Ticket:
      type: object
      properties:
        ticket_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          example: Deploy v1.2 to production
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
          default: open
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        project:
          type: string
          description: Free-text project (workspace) label; a view filter, not a permission boundary
        board_id:
          type: string
          format: uuid
          nullable: true
          description: The board this ticket belongs to (null = unassigned)
        created_by:
          type: string
          format: uuid
          readOnly: true
        org_id:
          type: string
          readOnly: true
        assignee_id:
          type: string
          format: uuid
          nullable: true
        workflow_id:
          type: string
          format: uuid
          nullable: true
        run_id:
          type: string
          format: uuid
          nullable: true
        forge_execution_id:
          type: string
          format: uuid
          nullable: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/TicketComment'
          description: Populated on GET /tickets/{id}; empty array in list responses
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    TicketComment:
      type: object
      properties:
        comment_id:
          type: string
          format: uuid
          readOnly: true
        ticket_id:
          type: string
          format: uuid
          readOnly: true
        author_id:
          type: string
          format: uuid
          readOnly: true
        body:
          type: string
          example: Deployment complete, closing.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    CreateTicketRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: Deploy v1.2 to production
        description:
          type: string
        status:
          type: string
          description: >-
            Status column for the new ticket. Omitting defaults to the board's
            left-most column (or the org/global left-most status when
            unassigned). Must be one of the board's configured status columns.
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        project:
          type: string
          description: Project (workspace) label to tag the ticket with
        board_id:
          type: string
          format: uuid
          nullable: true
          description: Board to place the ticket on (omit/null = unassigned)
        assignee_id:
          type: string
          format: uuid
          nullable: true
        workflow_id:
          type: string
          format: uuid
          nullable: true
        run_id:
          type: string
          format: uuid
          nullable: true
        forge_execution_id:
          type: string
          format: uuid
          nullable: true

    UpdateTicketRequest:
      type: object
      properties:
        title:
          type: string
          description: Omitting (or empty) preserves the current title
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
          description: Omitting preserves the current status
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: Omitting preserves the current priority
        project:
          type: string
          description: Project (workspace) label; omitting (or empty) preserves the current value
        board_id:
          type: string
          format: uuid
          nullable: true
          description: Omitting preserves the current board; "" clears it (unassign)
        assignee_id:
          type: string
          format: uuid
          nullable: true
        workflow_id:
          type: string
          format: uuid
          nullable: true
        run_id:
          type: string
          format: uuid
          nullable: true
        forge_execution_id:
          type: string
          format: uuid
          nullable: true

    AddCommentRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          example: Deployment complete, closing.

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        text/plain:
          schema:
            type: string

    Unauthorized:
      description: Missing or invalid Authorization header
      content:
        text/plain:
          schema:
            type: string

    Forbidden:
      description: Insufficient permissions
      content:
        text/plain:
          schema:
            type: string

    NotFound:
      description: Resource not found or not accessible to the caller
      content:
        text/plain:
          schema:
            type: string
