openapi: 3.1.0
info:
  title: Argo — Argo CD Sync Control Plane
  description: |
    Thin control plane for Argo CD application sync, the second integration
    proving the outpost framework generalises. Holds no Argo credentials: it
    enqueues sync commands for an outpost and records the app state the outpost
    reports back.

    User-facing endpoints require a Gatekeeper bearer token. `/internal/events`
    is authenticated with a shared-key HMAC (`X-Internal-Token`).
  version: 1.0.0
  contact:
    email: jhp1403@gmail.com

servers:
  - url: http://localhost:8091
    description: Local development server

security:
  - bearerAuth: []

paths:
  /healthz:
    get: { summary: Health check, operationId: healthz, security: [], responses: { '200': { description: OK } } }
  /apps:
    get:
      summary: List apps
      operationId: listApp
      responses:
        '200':
          description: Apps visible to the caller
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/App' } } } }
  /apps/{name}:
    get:
      summary: Get an app
      operationId: getApp
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The app, content: { application/json: { schema: { $ref: '#/components/schemas/App' } } } }
        '404': { description: Not found }
  /apps/{name}/sync:
    post:
      summary: Trigger a sync
      operationId: syncApp
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outpost_id: { type: string }
                revision: { type: string }
      responses:
        '202': { description: Sync accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Sync' } } } }
        '400': { description: Unknown outpost for app }
        '502': { description: Outpost-gateway unreachable }
  /syncs/{id}:
    get:
      summary: Get a sync
      operationId: getSync
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The sync, content: { application/json: { schema: { $ref: '#/components/schemas/Sync' } } } }
        '404': { description: Not found }
  /internal/events:
    post:
      summary: Ingest an outpost event (internal)
      operationId: internalEvent
      security: []
      responses: { '200': { description: Accepted }, '401': { description: Invalid token } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    App:
      type: object
      properties:
        app_id: { type: string }
        org_id: { type: string }
        outpost_id: { type: string }
        name: { type: string }
        sync_status: { type: string }
        health_status: { type: string }
        revision: { type: string }
        operation_phase: { type: string }
        created_at: { type: string, format: date-time }
    Sync:
      type: object
      properties:
        sync_id: { type: string }
        app_name: { type: string }
        revision: { type: string }
        status: { type: string, enum: [pending, running, Synced, Failed] }
        message: { type: string }
        created_at: { type: string, format: date-time }
