openapi: 3.1.0
info:
  title: Hooks — Webhook Receiver
  description: |
    Webhook receiver and pipeline rule engine. Accepts generic webhook payloads,
    matches them against configurable pipeline rules, and triggers workflow runs.

    ## Authentication

    The webhook receiver (`POST /hooks`) is **unauthenticated** at the HTTP level.
    Per-rule HMAC-SHA256 verification (`X-Hub-Signature-256`) is used instead.

    All other endpoints require a Gatekeeper-issued Bearer token:
    `Authorization: Bearer <token>`

    Gatekeeper evaluates the token and the requested (action, resource) pair.
    Requests from outside the rule owner's org receive `404 Not Found` rather than
    `403 Forbidden` to avoid information disclosure.
  version: 1.0.0
  contact:
    email: jhp1403@gmail.com

servers:
  - url: http://localhost:8087
    description: Local development server

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      security: []
      responses:
        '200':
          description: Service is healthy

  /hooks:
    post:
      summary: Receive webhook event
      operationId: receiveWebhook
      security: []
      description: |
        Accepts a generic webhook payload, matches it against active pipeline rules,
        and triggers the corresponding workflow runs.

        If a matching rule has a `secret` configured, the request must include a valid
        `X-Hub-Signature-256: sha256=<hex>` header (same format as GitHub webhooks).
        Rules without a secret accept any matching request.

        Always returns `200` even when no rules matched or some triggers failed.
        Check `status` and `triggers[].status` in the response for per-rule outcomes.

        The `X-Hook-Event` request header overrides `event` in the body when present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
            example:
              repo: myorg/myrepo
              event: push
              ref: refs/heads/main
              commit: abc123def456
              pusher: alice
              message: "fix: update config"
      responses:
        '200':
          description: Event processed (including partial failures)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /rules:
    post:
      summary: Create pipeline rule
      operationId: createRule
      description: |
        Creates a new pipeline rule. The rule is scoped to the caller's user ID
        and org (if any). Permission: `createRule` on `hooks/rules`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleRequest'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      summary: List pipeline rules
      operationId: listRules
      description: |
        Returns rules the caller created or that belong to their org.
        Permission: `listRule` on `hooks/rules`.
      responses:
        '200':
          description: List of pipeline rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rules/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      summary: Get pipeline rule
      operationId: getRule
      description: |
        Returns a single pipeline rule. Returns `404` when the rule does not exist
        or is outside the caller's org. Permission: `getRule` on `hooks/rules/{id}`.
      responses:
        '200':
          description: Pipeline rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update pipeline rule
      operationId: updateRule
      description: |
        Replaces all mutable fields of a pipeline rule.

        **Secret update semantics:** omit the `secret` field (or send `null`) to leave the
        existing secret unchanged; send `""` to clear it; send a non-empty string to replace it.

        Permission: `updateRule` on `hooks/rules/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleRequest'
      responses:
        '200':
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete pipeline rule
      operationId: deleteRule
      description: |
        Soft-deletes the rule. The rule is hidden from all subsequent API responses.
        Permission: `deleteRule` on `hooks/rules/{id}`.
      responses:
        '204':
          description: Rule deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events:
    get:
      summary: List hook events
      operationId: listEvents
      description: |
        Returns the last 100 webhook events visible to the caller (i.e. those
        associated with rules the caller owns or that belong to their org).

        Permission: `listEvent` on `hooks/events`.
      parameters:
        - name: repo
          in: query
          required: false
          schema:
            type: string
          description: Filter events by repository identifier
          example: myorg/myrepo
      responses:
        '200':
          description: List of hook events (triggers not included in list view)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HookEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /events/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      summary: Get hook event
      operationId: getEvent
      description: |
        Returns a single webhook event with its associated trigger records.
        Returns `404` when the event has no triggers associated with rules accessible
        to the caller (or when the caller has no active rule for the repo).

        Permission: `getEvent` on `hooks/events/{id}`.
      responses:
        '200':
          description: Hook event with triggers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token issued by the Gatekeeper service

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID

  schemas:
    WebhookPayload:
      type: object
      required:
        - repo
        - event
      properties:
        repo:
          type: string
          description: Repository identifier used to match pipeline rules
          example: myorg/myrepo
        event:
          type: string
          description: |
            Event type (e.g. `push`, `merge`, `tag`).
            Overridden by the `X-Hook-Event` request header when present.
          example: push
        ref:
          type: string
          description: Git ref
          example: refs/heads/main
        commit:
          type: string
          description: Commit SHA
          example: abc123def456
        pusher:
          type: string
          description: Username who triggered the event
          example: alice
        message:
          type: string
          description: Commit or event message
          example: "fix: update config"

    PipelineRule:
      type: object
      description: |
        A pipeline rule maps incoming webhook events to a workflow run.
        The `secret` field is write-only and never appears in responses.
      properties:
        rule_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          example: deploy-on-main-push
        repo:
          type: string
          description: Repository identifier (exact match)
          example: myorg/myrepo
        events:
          type: array
          items:
            type: string
          description: Event types that trigger this rule
          example: [push]
        ref_filter:
          type: string
          description: |
            Ref filter. Empty = any ref. Exact string = exact match.
            Suffix `/*` = prefix glob (e.g. `refs/heads/*`).
          example: refs/heads/main
        workflow_id:
          type: string
          format: uuid
          description: Workflow to trigger on match
        input_mapping:
          type: object
          additionalProperties:
            type: string
          description: |
            Maps workflow input keys to webhook payload field names.
            E.g. `{"COMMIT_SHA": "commit", "BRANCH": "ref"}`.
        created_by:
          type: string
          readOnly: true
        org_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    CreateRuleRequest:
      type: object
      required:
        - name
        - repo
        - events
        - workflow_id
      properties:
        name:
          type: string
          example: deploy-on-main-push
        repo:
          type: string
          example: myorg/myrepo
        events:
          type: array
          items:
            type: string
          minItems: 1
          example: [push]
        ref_filter:
          type: string
          example: refs/heads/main
        workflow_id:
          type: string
          format: uuid
        secret:
          type: string
          nullable: true
          description: |
            HMAC-SHA256 secret for `X-Hub-Signature-256` verification.
            On create: omit or `null` for no secret; non-empty string to enable HMAC.
            On update: omit/`null` = leave unchanged; `""` = clear; non-empty = replace.
        input_mapping:
          type: object
          additionalProperties:
            type: string

    HookEvent:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          readOnly: true
        repo:
          type: string
        event_type:
          type: string
        ref:
          type: string
        payload:
          type: object
          additionalProperties:
            type: string
        rules_matched:
          type: integer
          description: Number of rules that matched (including HMAC failures that were skipped)
        status:
          type: string
          enum: [received, triggered, failed, partial]
          description: |
            `received` — no rules matched; `triggered` — all dispatches succeeded;
            `failed` — all dispatches failed; `partial` — mixed results.
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/HookTrigger'
          description: Present on GET /events/{id}; empty array on list responses
        created_at:
          type: string
          format: date-time
          readOnly: true

    HookTrigger:
      type: object
      properties:
        trigger_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        rule_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
          nullable: true
          description: Set when the workflow run was created successfully
        status:
          type: string
          enum: [pending, triggered, failed]
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        text/plain:
          schema:
            type: string

    Unauthorized:
      description: Missing or invalid Authorization header
      content:
        text/plain:
          schema:
            type: string

    Forbidden:
      description: Insufficient permissions
      content:
        text/plain:
          schema:
            type: string

    NotFound:
      description: Resource not found or not accessible
      content:
        text/plain:
          schema:
            type: string

    InternalError:
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
