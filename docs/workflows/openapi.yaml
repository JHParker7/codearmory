openapi: 3.1.0
info:
  title: Workflows — CI/CD Pipeline Orchestrator
  description: |
    Sequences HTTP steps against registered backend services. Workflows are
    named, ordered lists of steps; each step makes one HTTP request to a
    registered service. Runs are queued and executed by a background worker pool.

    ## Authentication

    All endpoints (except `/healthz` and the internal trigger endpoint) require
    a Gatekeeper-issued Bearer token: `Authorization: Bearer <token>`

    Authorisation is delegated to Gatekeeper. Requests from outside the resource
    owner's org receive `404 Not Found` rather than `403 Forbidden`.

    The internal endpoint `POST /internal/workflows/{id}/runs` uses HMAC-SHA256
    authentication via `X-Hooks-Token` and `X-Hooks-Timestamp` headers (hooks
    service only).

    ## Input substitution

    `${KEY}` placeholders in step `path`, `body`, and `headers` are replaced
    with values from the run's `inputs` map at execution time. Unrecognised keys
    are left as-is.
  version: 1.0.0
  contact:
    email: jhp1403@gmail.com

servers:
  - url: http://localhost:8085
    description: Local development server

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      security: []
      responses:
        '200':
          description: Service is healthy

  /workflows:
    post:
      summary: Create workflow
      operationId: createWorkflow
      description: |
        Creates a new workflow definition. Maximum 50 steps.
        Step `method` defaults to `POST`; `timeout_secs` defaults to 30 (max 3600).
        Steps without a `name` are named `step-N` (zero-indexed).

        Permission: `createWorkflow` on `workflows/workflows`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      summary: List workflows
      operationId: listWorkflows
      description: |
        Returns the last 100 workflows the caller created or that belong to their org.

        Permission: `listWorkflow` on `workflows/workflows`.
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /workflows/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      summary: Get workflow
      operationId: getWorkflow
      description: Permission: `getWorkflow` on `workflows/workflows/{id}`.
      responses:
        '200':
          description: Workflow definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update workflow
      operationId: updateWorkflow
      description: |
        Replaces all mutable workflow fields including the full step list.
        Permission: `updateWorkflow` on `workflows/workflows/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '200':
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete workflow
      operationId: deleteWorkflow
      description: |
        Soft-deletes the workflow. Hidden from all subsequent API responses.
        Permission: `deleteWorkflow` on `workflows/workflows/{id}`.
      responses:
        '204':
          description: Workflow deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /workflows/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/Id'

    post:
      summary: Trigger workflow run
      operationId: triggerRun
      description: |
        Queues a new run of the workflow. The caller's Bearer token is stored
        temporarily and forwarded as the `Authorization` header on each step
        request. The token is cleared once the run reaches a terminal state.

        Returns `202 Accepted` immediately; poll `GET /runs/{id}` for completion.

        Permission: `triggerRun` on `workflows/runs`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerRunRequest'
      responses:
        '202':
          description: Run queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /internal/workflows/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/Id'

    post:
      summary: Internal — trigger run (hooks service only)
      operationId: internalTriggerRun
      security: []
      description: |
        Trigger endpoint used exclusively by the hooks service. Not intended for
        direct consumer use.

        Requires two request headers signed with the shared `HOOKS_TRIGGER_KEY`:
        - `X-Hooks-Token`: `hex(HMAC-SHA256(key, "hooks:{workflow_id}:{triggered_by}:{timestamp}"))`
        - `X-Hooks-Timestamp`: Unix timestamp (seconds) used in the HMAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - triggered_by
              properties:
                triggered_by:
                  type: string
                org_id:
                  type: string
                inputs:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '202':
          description: Run queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
        '401':
          description: Missing or invalid HMAC token
        '404':
          $ref: '#/components/responses/NotFound'

  /runs:
    get:
      summary: List runs
      operationId: listRuns
      description: |
        Returns the last 100 runs triggered by the caller or belonging to their org.
        Supports an optional `workflow_id` filter.

        Permission: `listRun` on `workflows/runs`.
      parameters:
        - name: workflow_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter runs by workflow ID
      responses:
        '200':
          description: List of runs (step_runs is empty array in list responses)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /runs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      summary: Get run
      operationId: getRun
      description: |
        Returns a run with its per-step execution records.

        Permission: `getRun` on `workflows/runs/{id}`.
      responses:
        '200':
          description: Run with step records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Cancel run
      operationId: cancelRun
      description: |
        Cancels a run that is in `pending` or `running` state. Returns `409` if the
        run has already reached a terminal state.

        Permission: `cancelRun` on `workflows/runs/{id}`.
      responses:
        '204':
          description: Run cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Run is not in a cancellable state (already terminal)
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token issued by the Gatekeeper service

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID

  schemas:
    WorkflowStep:
      type: object
      required:
        - service
        - path
      properties:
        name:
          type: string
          description: Human label. Defaults to `step-N` (zero-indexed).
          example: build
        service:
          type: string
          description: Registered service name from the `SERVICES` env var
          example: forge
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
          default: POST
        path:
          type: string
          description: Path on the target service. Must start with `/`. Supports `${KEY}` substitution.
          example: /executions
        body:
          description: Optional JSON request body. Supports `${KEY}` substitution.
          nullable: true
        headers:
          type: object
          additionalProperties:
            type: string
          description: Extra request headers. Values support `${KEY}` substitution.
        expected_status:
          type: integer
          description: |
            If set, only this exact HTTP status code is treated as success.
            Otherwise any 2xx response succeeds.
          example: 201
        timeout_secs:
          type: integer
          description: Per-step timeout in seconds. Defaults to 30, capped at 3600.
          default: 30
          maximum: 3600

    Workflow:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          example: deploy-staging
        description:
          type: string
        created_by:
          type: string
          format: uuid
          readOnly: true
        org_id:
          type: string
          readOnly: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    CreateWorkflowRequest:
      type: object
      required:
        - name
        - steps
      properties:
        name:
          type: string
          example: deploy-staging
        description:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
          minItems: 1
          maxItems: 50

    TriggerRunRequest:
      type: object
      properties:
        inputs:
          type: object
          additionalProperties:
            type: string
          description: |
            Key-value pairs substituted into step `path`, `body`, and `headers`
            via `${KEY}` placeholders at execution time.
          example:
            VERSION: v1.2.3
            ENV: staging

    WorkflowRun:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
          readOnly: true
        workflow_id:
          type: string
          format: uuid
        triggered_by:
          type: string
          format: uuid
          readOnly: true
        org_id:
          type: string
          readOnly: true
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        current_step:
          type: integer
          description: Zero-indexed index of the step currently executing
        inputs:
          type: object
          additionalProperties:
            type: string
        step_runs:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepRun'
          description: Populated on GET /runs/{id}; empty array in list and trigger responses
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        ended_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    WorkflowStepRun:
      type: object
      properties:
        step_run_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        step_index:
          type: integer
        step_name:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        response_status:
          type: integer
          nullable: true
          description: HTTP status code returned by the step's target service
        response_body:
          type: string
          nullable: true
          description: Response body (up to 1 MB) from the step's target service
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        text/plain:
          schema:
            type: string

    Unauthorized:
      description: Missing or invalid Authorization header
      content:
        text/plain:
          schema:
            type: string

    Forbidden:
      description: Insufficient permissions
      content:
        text/plain:
          schema:
            type: string

    NotFound:
      description: Resource not found or not accessible to the caller
      content:
        text/plain:
          schema:
            type: string
