openapi: 3.1.0
info:
  title: Events — Event Collector and Reactor
  description: |
    The platform's event plane. Every service emits JSON events here; **triggers** whose
    field-based filters match dispatch **actions** (run a pipeline, open a ticket, notify,
    call a webhook, enqueue an outpost command).

    Supersedes the former `hooks` service: the webhook adapters and pipeline dispatch moved
    here, and the git-specific rule model (`source` + `events` + `ref_filter`) was replaced by
    the general envelope + filter documented below.

    ## Authentication

    Three distinct schemes, by endpoint class:

    - **`POST /internal/events`** — trusted internal emitters, authenticated by an HMAC-SHA256
      token over the event's identity, tenant, subject and payload digest, keyed by the shared
      `EVENTS_TRIGGER_KEY`. Sent as `X-Events-Token` + `X-Events-Timestamp`; the timestamp must
      be within 30 seconds.
    - **`POST /hooks`, `/hooks/git`, `/hooks/gitea`** — public webhook endpoints, authenticated
      by a provider HMAC over the raw body keyed by `EVENTS_WEBHOOK_SECRET`. Accepted in either
      `X-Hub-Signature-256: sha256=<hex>` (GitHub/Forgejo) or `X-Gitea-Signature: <hex>` form.
      With no secret configured these endpoints reject everything.
    - **`POST /hooks/github`** — verified against the App's own `GITHUB_APP_WEBHOOK_SECRET`.
      Registered only when `GITHUB_APP_ID` is set.

    Every other endpoint requires a Gatekeeper-issued bearer token:
    `Authorization: Bearer <token>`. Records belonging to another tenant are reported as
    `404 Not Found` rather than `403 Forbidden`, so the API never confirms that an id exists
    for someone else.

    ## Tenancy on public webhooks

    A third-party provider's payload carries no codearmory identity, so the tenant comes from
    the endpoint URL: `?org_id=<id>` or `?user_id=<id>`. The webhook secret attests that
    whoever configured the webhook holds it — not that the repo belongs to that tenant. The two
    are bound only by being configured together in the provider's webhook settings.

    ## GitHub App integration

    When `GITHUB_APP_ID` is configured, `POST /hooks/github` is registered. It normalises
    `push` and `pull_request` deliveries into envelopes and, for each pipeline run a matched
    trigger starts, opens a GitHub **check run** on the pushed commit and watches it to
    completion (success / failure / cancelled, or `timed_out` after two hours).
  version: 1.0.0
  contact:
    email: jhp1403@gmail.com

servers:
  - url: http://localhost:8093
    description: Direct service access
  - url: http://localhost:8080/events
    description: Via Conductor API gateway

tags:
  - name: Triggers
    description: Tenant-scoped subscriptions — a filter plus the actions it dispatches
  - name: Events
    description: The append-only event log
  - name: Intake
    description: Event and webhook ingestion

paths:
  /triggers:
    post:
      tags: [Triggers]
      summary: Create a trigger
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trigger' }
        '400': { description: name or actions missing, or invalid JSON }
        '401': { description: Missing or invalid token }
    get:
      tags: [Triggers]
      summary: List the caller's triggers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Trigger' }
        '401': { description: Missing or invalid token }

  /triggers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Triggers]
      summary: Get a trigger
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trigger' }
        '404': { description: Not found, or owned by another tenant }
    put:
      tags: [Triggers]
      summary: Update a trigger
      description: |
        Replaces the mutable fields (`name`, `match`, `actions`, `enabled`). Identity and
        tenant are fixed at creation and cannot be changed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trigger' }
        '404': { description: Not found, or owned by another tenant }
    delete:
      tags: [Triggers]
      summary: Delete a trigger
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '404': { description: Not found, or owned by another tenant }

  /triggers/test-match:
    post:
      tags: [Triggers]
      summary: Dry-run a filter against an event
      description: Answers "would this trigger fire?" without persisting anything.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                match: { $ref: '#/components/schemas/Match' }
                event: { $ref: '#/components/schemas/Event' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched: { type: boolean }
                  error:
                    type: string
                    description: Present when the filter itself is malformed

  /events:
    get:
      tags: [Events]
      summary: List the tenant's recent events
      security: [{ bearerAuth: [] }]
      parameters:
        - name: type
          in: query
          schema: { type: string }
          description: Exact event type to filter by (e.g. `repo.push`)
      responses:
        '200':
          description: Newest first, capped at 200
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }

  /events/{id}:
    get:
      tags: [Events]
      summary: Get one event
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { description: Not found, or belonging to another tenant }

  /internal/events:
    post:
      tags: [Intake]
      summary: Ingest an event from a trusted internal emitter
      description: |
        Authenticated by the shared-key HMAC, not a bearer token. Storage is idempotent on the
        event id, so at-least-once redelivery is safe.
      parameters:
        - name: X-Events-Token
          in: header
          required: true
          schema: { type: string }
        - name: X-Events-Timestamp
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
      responses:
        '202':
          description: Accepted; trigger evaluation runs asynchronously
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        '400': { description: Invalid envelope }
        '401': { description: Bad token, or timestamp outside the 30s window }

  /hooks:
    post:
      tags: [Intake]
      summary: Generic webhook
      description: |
        The catch-all for systems with no dedicated adapter. Becomes an envelope with
        `type = "ci.<event>"`, `source = subject = <source>`, and every payload key under
        `data`. The `ci.` prefix keeps a generic sender from minting a `repo.push` that looks
        like it came from a verified git adapter.
      parameters:
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/UserIDQuery'
        - name: X-Hook-Event
          in: header
          schema: { type: string }
          description: Overrides `event` in the body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, event]
              properties:
                source: { type: string, example: ci/myapp }
                event: { type: string, example: build.failed }
                payload:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '202': { description: Accepted }
        '400': { description: source or event missing }
        '401': { description: Missing or invalid signature }

  /hooks/git:
    post:
      tags: [Intake]
      summary: Normalized git webhook
      description: |
        The provider-neutral push endpoint used by `git_factory`. Unlike the provider
        adapters, the tenant is read from the signed body rather than the URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, event]
              properties:
                repo: { type: string, example: alice/myapp }
                event: { type: string, example: push }
                ref: { type: string, example: main }
                commit: { type: string }
                pusher: { type: string }
                message: { type: string }
                org_id: { type: string }
                user_id: { type: string }
      responses:
        '202': { description: Accepted }
        '400': { description: repo or event missing }
        '401': { description: Missing or invalid signature }

  /hooks/gitea:
    post:
      tags: [Intake]
      summary: Forgejo / Gitea webhook
      description: |
        Accepts the provider's native nested payload. `push` and `pull_request` are translated;
        any other event type is acknowledged with `200` and ignored so the provider does not
        retry. `ping` is acknowledged.
      parameters:
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/UserIDQuery'
        - name: X-Gitea-Event
          in: header
          schema: { type: string }
        - name: X-Forgejo-Event
          in: header
          schema: { type: string }
      responses:
        '202': { description: Accepted and translated }
        '200': { description: Ping, or an event type not translated }
        '400': { description: Missing event header }
        '401': { description: Missing or invalid signature }

  /hooks/github:
    post:
      tags: [Intake]
      summary: GitHub App webhook
      description: |
        Registered only when `GITHUB_APP_ID` is configured. Verified against the App's own
        webhook secret. For each pipeline run a matched trigger starts, a check run is opened
        on the pushed commit and watched to completion.
      parameters:
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/UserIDQuery'
        - name: X-GitHub-Event
          in: header
          required: true
          schema: { type: string }
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string }
      responses:
        '202': { description: Accepted and translated }
        '200': { description: Ping, installation event, or an unsupported event type }
        '401': { description: Signature verification failed }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    OrgIDQuery:
      name: org_id
      in: query
      schema: { type: string }
      description: Tenant the webhook's events belong to (org). One of org_id/user_id required.
    UserIDQuery:
      name: user_id
      in: query
      schema: { type: string }
      description: Tenant the webhook's events belong to (user). One of org_id/user_id required.

  schemas:
    Event:
      type: object
      description: The JSON envelope every emitter sends and every filter matches against.
      required: [type, source, subject]
      properties:
        id:
          type: string
          description: Unique — the idempotency key. Generated when omitted.
        spec_version: { type: string, default: '1' }
        type:
          type: string
          description: Dotted, namespaced, stable
          example: repo.push
        source:
          type: string
          description: The emitting service
          example: git
        subject:
          type: string
          description: The resource the event is about — what makes triggers addressable per-resource
          example: alice/myapp
        actor: { $ref: '#/components/schemas/Actor' }
        occurred_at: { type: string, format: date-time }
        trace_id: { type: string }
        causation_id:
          type: string
          description: The event or action that caused this one (loop guard)
        data:
          type: object
          description: Type-specific payload; filters reach into it by dotted path
          additionalProperties: true

    Actor:
      type: object
      description: The tenant an event belongs to. At least one field is required.
      properties:
        org_id: { type: string }
        user_id: { type: string }

    Match:
      type: object
      description: |
        A filter node: either a **group** (any of `all`/`any`/`not` set) or a **leaf**
        condition (`field` set). A group ANDs `all`, ORs `any`, and negates `not`; a leaf
        applies `op` to the value at `field`. The recursion lets a trigger express arbitrary
        boolean logic while the common case stays a flat `all: [...]`.
      properties:
        all:
          type: array
          items: { $ref: '#/components/schemas/Match' }
        any:
          type: array
          items: { $ref: '#/components/schemas/Match' }
        not: { $ref: '#/components/schemas/Match' }
        field:
          type: string
          description: Dotted path into the event
          example: data.ref
        op:
          type: string
          example: eq
        value:
          description: Scalar operand (eq/ne/prefix/glob/regex/gt…)
        values:
          type: array
          description: Set operand (in/not_in)
          items: {}

    Action:
      type: object
      description: One thing a matched trigger does. `config` is kind-specific.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [run_pipeline, create_ticket, notify, webhook_out, enqueue_outpost_command]
        config:
          type: object
          additionalProperties: true
          description: |
            String values are templated: `{{ data.ref }}` interpolates from the event.
            `run_pipeline` takes `pipeline_id` plus an `inputs` map. `webhook_out` takes `url`
            and an optional `sign_secret`, which must be a `secret:<name>` reference resolved
            through gatekeeper — never a literal key.

    TriggerInput:
      type: object
      required: [name, actions]
      properties:
        name: { type: string }
        match: { $ref: '#/components/schemas/Match' }
        actions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Action' }
        enabled: { type: boolean, default: true }

    Trigger:
      allOf:
        - $ref: '#/components/schemas/TriggerInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            org_id: { type: string }
            created_by: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
