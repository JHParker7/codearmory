openapi: 3.1.0
info:
  title: Registry — Service Discovery
  description: |
    Stores the URL, routing metadata, and endpoint manifest for every backend
    service. Conductor reads from the Registry every 30 seconds to keep its
    routing table up to date.

    ## Authentication

    Two static API keys are used — no JWT or Gatekeeper involvement:

    | Key | Endpoints |
    |-----|-----------|
    | `READ_KEY` | `GET /services` |
    | `ADMIN_KEY` | All endpoints (also accepted on read-only endpoints) |

    Pass the key as `Authorization: Bearer <key>`.

    ## SSRF protection

    Service URLs registered via the API are validated against a denylist of
    private and reserved address ranges (RFC-1918, loopback, link-local, IPv6 ULA).
    URLs pre-seeded via the `SERVICES` env var or `MANIFEST_FILE` bypass this check.
  version: 1.0.0
  contact:
    email: jhp1403@gmail.com

servers:
  - url: http://localhost:8084
    description: Local development server

security:
  - adminKey: []

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      security: []
      responses:
        '200':
          description: Service is healthy

  /services:
    get:
      summary: List services
      operationId: listServices
      security:
        - readKey: []
        - adminKey: []
      description: |
        Returns all active services with their role definitions and endpoint
        manifests. Used by Conductor to build its routing table.
      responses:
        '200':
          description: Active services with roles and endpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceWithEndpoints'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Register service
      operationId: createService
      description: |
        Registers a new service. The `name` must be unique. The `url` must use
        `http` or `https` and must not resolve to a private or reserved address.

        `service_key` is stored bcrypt-hashed and is never returned in responses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Service registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A service with this name is already registered
          content:
            text/plain:
              schema:
                type: string

  /services/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    delete:
      summary: Delete service
      operationId: deleteService
      description: Soft-deletes the service. It is excluded from all subsequent list responses.
      responses:
        '204':
          description: Service deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /services/{id}/endpoints:
    parameters:
      - $ref: '#/components/parameters/Id'

    put:
      summary: Update endpoint manifest
      operationId: updateServiceEndpoints
      description: |
        Replaces the full endpoint manifest (roles + endpoints) for the service.
        Optionally updates `url` and `description`.

        All previous roles and endpoints for the service are deleted and replaced
        atomically. Endpoints with an empty `method`, `path`, `action`, or
        `resource` are silently skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEndpointsRequest'
      responses:
        '204':
          description: Manifest updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    readKey:
      type: http
      scheme: bearer
      description: Read-only API key (`READ_KEY`). Accepted on GET /services only.
    adminKey:
      type: http
      scheme: bearer
      description: Admin API key (`ADMIN_KEY`). Accepted on all endpoints.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Service UUID

  schemas:
    Service:
      type: object
      properties:
        service_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Unique service name. Used as the routing key in Conductor.
          example: forge
        url:
          type: string
          format: uri
          example: http://forge:8083
        description:
          type: string
        forward_auth:
          type: boolean
          description: |
            When `true`, Conductor forwards the caller's `Authorization` header
            to the backend unchanged. When `false` (default), Conductor strips the
            bearer token and injects a signed `X-User-ID` header instead.
          default: false
        active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    ServiceRole:
      type: object
      description: Named role that operators should provision in Gatekeeper for users of this service
      properties:
        role_id:
          type: string
          format: uuid
          readOnly: true
        service_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          example: viewer
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true

    ServiceEndpoint:
      type: object
      description: One route in the service's endpoint manifest
      properties:
        endpoint_id:
          type: string
          format: uuid
          readOnly: true
        service_id:
          type: string
          format: uuid
          readOnly: true
        method:
          type: string
          example: GET
        path:
          type: string
          description: Path pattern. Use `{param}` for path parameters.
          example: /executions/{id}
        action:
          type: string
          description: Gatekeeper action string for this endpoint
          example: getExecution
        resource:
          type: string
          description: Gatekeeper resource string for this endpoint
          example: forge/executions
        public:
          type: boolean
          description: When `true`, Conductor skips the permission check for this endpoint
          default: false
        active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    ServiceWithEndpoints:
      allOf:
        - $ref: '#/components/schemas/Service'
        - type: object
          properties:
            roles:
              type: array
              items:
                $ref: '#/components/schemas/ServiceRole'
            endpoints:
              type: array
              items:
                $ref: '#/components/schemas/ServiceEndpoint'

    CreateServiceRequest:
      type: object
      required:
        - name
        - url
      properties:
        name:
          type: string
          example: inventory
        url:
          type: string
          format: uri
          description: |
            Base URL of the service. Must use `http` or `https`.
            Private/reserved addresses are rejected (RFC-1918, loopback, link-local, IPv6 ULA).
            Use SERVICES env var or MANIFEST_FILE to seed internal Docker/Kubernetes URLs.
          example: https://inventory.example.com
        description:
          type: string
        forward_auth:
          type: boolean
          default: false
        service_key:
          type: string
          description: Optional shared secret. Bcrypt-hashed before storage; never returned in responses.

    UpdateEndpointsRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Update the service URL (optional). Subject to SSRF validation.
        description:
          type: string
          description: Update the service description (optional)
        roles:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                example: viewer
              description:
                type: string
          description: Replaces all existing roles. Entries with an empty `name` are skipped.
        endpoints:
          type: array
          items:
            type: object
            required:
              - method
              - path
              - action
              - resource
            properties:
              method:
                type: string
                example: GET
              path:
                type: string
                example: /items/{id}
              action:
                type: string
                example: getItem
              resource:
                type: string
                example: items
              public:
                type: boolean
                default: false
          description: Replaces all existing endpoints. Entries missing required fields are skipped.

  responses:
    BadRequest:
      description: Invalid request body or URL
      content:
        text/plain:
          schema:
            type: string

    Unauthorized:
      description: Missing or invalid API key
      content:
        text/plain:
          schema:
            type: string

    NotFound:
      description: Service not found
      content:
        text/plain:
          schema:
            type: string
