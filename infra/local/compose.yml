# config not for production use. set up to test integration tests on PRs
# Shared OpenTelemetry env for application services. Each one sends OTLP to the
# otelcol service, which forwards traces to Jaeger (UI at http://localhost:16686).
# OTEL_TRACES_SAMPLER=always_on captures every trace locally; production tunes
# sampling via the Helm chart's `otel.sampler` value.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
  OTEL_TRACES_SAMPLER: always_on

services:
  # ── Database ──────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    # No host port binding — postgres is only reachable by services on this
    # internal network. Expose on the host only for local debugging if needed.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Cache ─────────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    # No host port binding — redis is only reachable by services on this network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Application services ──────────────────────────────────────────────────────

  # ── Observability ─────────────────────────────────────────────────────────────
  # The collector receives OTLP from every service and forwards traces to Jaeger
  # (UI on :16686); metrics and logs go to the collector's debug exporter and are
  # visible via `docker compose logs otelcol`. See otelcol.yml.

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
    restart: unless-stopped

  otelcol:
    image: otel/opentelemetry-collector:0.115.1
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otelcol.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  gatekeeper:
    build:
      context: ../../src/systems/gatekeeper
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/gatekeeper
      REDIS_URL: redis://redis:6379/0
      GATEKEEPER_SERVICES: forge=forge-local-secret,workflows=workflows-local-secret,hooks=hooks-local-secret,outpost-gateway=outpost-gateway-local-secret,builder=builder-local-secret,test-service=test-service-local-secret
      SECRETS_LOOKUP_ALLOWED_CALLERS: "forge"
      REGISTRY_URL: http://registry:8084
      REGISTRY_SERVICE_KEY: gatekeeper-registry-read-local-secret
      # Org-service disable-gate: when both are set, gatekeeper denies requests to
      # services an org has disabled in builder. Unset = gate inert (fail-open).
      BUILDER_URL: http://builder:8095
      BUILDER_INTERNAL_KEY: builder-internal-local-secret
      OIDC_ISSUER: http://localhost:8080
      GATEKEEPER_SECRETS_KEY: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
      SIGNUP_RATE_LIMIT: "1000"
      SIGNUP_RATE_WINDOW: 1h
      LOGIN_RATE_LIMIT: "1000"
      LOGIN_RATE_WINDOW: 1h
      # Optional bootstrap admin. When both EMAIL and PASSWORD are set, gatekeeper
      # seeds this account on startup with full access and the "first user becomes
      # admin" fallback is disabled. Both read via secret() so *_FILE mounts work.
      # GATEKEEPER_ADMIN_EMAIL: admin@codearmory.local
      # GATEKEEPER_ADMIN_PASSWORD: changeme123
      # GATEKEEPER_ADMIN_USERNAME: admin   # optional; defaults to the email local-part
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

  registry:
    build:
      context: ../../src/systems/registry
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/registry
      REGISTRY_SERVICE_ACCOUNTS: conductor=registry-read-local-secret,workflows=workflows-registry-local-secret,gatekeeper=gatekeeper-registry-read-local-secret,builder=builder-registry-read-local-secret,registry-test-reader=registry-test-reader-local-secret
      REGISTRY_ADMIN_ACCOUNTS: registry-admin=registry-admin-local-secret
      SERVICES: forge=http://forge:8083,gatekeeper=http://gatekeeper:8081
      CONDUCTOR_URL: http://conductor:8080
      CONDUCTOR_NOTIFY_KEY: conductor-notify-local-secret
      MANIFEST_FILE: /etc/registry/manifest.json
    volumes:
      - ./registry-manifest.json:/etc/registry/manifest.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

  # ── Egress proxy ─────────────────────────────────────────────────────────────
  # Sits on both the default network (internet access) and the internal
  # forge-exec network. Execution containers on forge-exec can only reach the
  # internet through this proxy; direct outbound traffic is blocked by the
  # internal network flag. Default PROXY_ALLOWED_DOMAINS is "*" (public-only: any
  # public host, but the proxy's IP guard still blocks private/internal/metadata
  # addresses). Set FORGE_PROXY_ALLOWED_DOMAINS to a comma-separated domain allowlist
  # to restrict which external hosts containers may contact.

  egress-proxy:
    build:
      context: ../../src/systems/egress-proxy
    environment:
      <<: *otel-env
      PROXY_ALLOWED_DOMAINS: ${FORGE_PROXY_ALLOWED_DOMAINS:-*}
    networks:
      - default
      - forge-exec
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3128/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  forge:
    build:
      context: ../../src/systems/forge
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/forge
      RUNTIME: docker
      GATEKEEPER_URL: http://gatekeeper:8081
      ALLOWED_IMAGES: alpine:3.19,ubuntu:22.04,python:3.12-slim,golang:1.25
      # Must match the forge entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: forge-local-secret
      # Job secret_refs: forge resolves "secret:<name>" via gatekeeper (forge must
      # be in SECRETS_LOOKUP_ALLOWED_CALLERS) and "gitea:<owner>/<repo>" by minting
      # a Forgejo clone URL via gitea-integration. GITEA_INTERNAL_KEY must match the
      # value on the gitea-integration service.
      GITEA_INTERNAL_URL: http://gitea-integration:8088
      GITEA_INTERNAL_KEY: forge-gitea-internal-local-secret
      # Execution containers join the internal forge-exec network and route all
      # outbound traffic through the egress proxy's allowlist. Direct internet
      # access is blocked by the internal: true flag on that network.
      FORGE_NETWORK_MODE: forge-exec
      FORGE_EGRESS_PROXY: http://egress-proxy:3128
      # K8S_NAMESPACE: forge          # set when RUNTIME=kubernetes
      # K8S_RUNTIME_CLASS: gvisor     # optional: use gVisor for stronger isolation
      #
      # Proxmox VM-per-job runtime: the PVE host is external (not part of this
      # compose stack), so there is nothing to start here. To try it, set the token
      # below and create a runtime backend of type "proxmox" via the API whose
      # config points at your PVE host and whose egress_proxy reuses the same
      # FORGE_EGRESS_PROXY URL above. secret_refs {token: "PROXMOX_TOKEN"}.
      # PROXMOX_TOKEN: "root@pam!forge=00000000-0000-0000-0000-000000000000"
    volumes:
      # Mount the Docker socket for the local docker runtime.
      # Remove this when deploying to Kubernetes (use RUNTIME=kubernetes instead).
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # Add the host docker group so the svc user can reach the Docker socket.
      # Set DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) before running compose.
      - "${DOCKER_GID:?DOCKER_GID must be set to the host docker group GID (stat -c '%g' /var/run/docker.sock)}"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
      egress-proxy:
        condition: service_healthy
    restart: on-failure

  conductor:
    build:
      context: ../../src/systems/conductor
    environment:
      <<: *otel-env
      GATEKEEPER_URL: http://gatekeeper:8081
      REGISTRY_URL: http://registry:8084
      REGISTRY_SERVICE_KEY: registry-read-local-secret
      CONDUCTOR_FORWARD_KEY: forge-conductor-shared-local-secret
      # Shared with registry (CONDUCTOR_NOTIFY_KEY) so registry can push route refreshes.
      CONDUCTOR_NOTIFY_KEY: conductor-notify-local-secret
    ports:
      - "8080:8080"
    depends_on:
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
    restart: on-failure

  portal:
    build:
      context: ../../src/systems/portal
    environment:
      <<: *otel-env
      PORT: "3001"
      CONDUCTOR_URL: http://conductor:8080
      METRICS_ENABLED: "true"
    ports:
      - "3001:3001"
    depends_on:
      conductor:
        condition: service_started
    restart: on-failure

  workflows:
    build:
      context: ../../src/systems/workflows
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/workflows
      GATEKEEPER_URL: http://gatekeeper:8081
      SERVICES: registry=http://registry:8084,conductor=http://conductor:8080,hooks=http://hooks:8087
      REGISTRY_URL: http://registry:8084
      REGISTRY_SERVICE_KEY: workflows-registry-local-secret
      GATEKEEPER_SERVICE_KEY: workflows-local-secret
      HOOKS_TRIGGER_KEY: hooks-trigger-local-secret
      WORKFLOWS_TOKEN_KEY: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
      forge:
        condition: service_started
    restart: on-failure

  # ── Outpost integration framework ──────────────────────────────────────────
  # The outpost-gateway is the outpost-facing connection point (enroll,
  # long-poll commands, ingest events) and the Postgres event backbone. The
  # outpost itself runs in (or against) a target cluster with a KUBECONFIG and
  # is not part of the compose stack; run it separately for end-to-end tests.
  outpost-gateway:
    build:
      context: ../../src/systems/outpost-gateway
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/outpost_gateway
      GATEKEEPER_URL: http://gatekeeper:8081
      GATEKEEPER_SERVICE_KEY: outpost-gateway-local-secret
      # Shared HMAC secret for the internal command/event plane. Must match the
      # chaos and argo services' OUTPOST_INTERNAL_KEY.
      OUTPOST_INTERNAL_KEY: outpost-internal-local-secret
      # Maps each integration to its consumer service for event dispatch.
      EVENT_CONSUMERS: chaos=http://chaos:8090,argo=http://argo:8091
    ports:
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
    restart: on-failure

  builder:
    build:
      context: ../../src/systems/builder
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/builder
      GATEKEEPER_URL: http://gatekeeper:8081
      # Must match the builder entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: builder-local-secret
      REGISTRY_URL: http://registry:8084
      # Must match the builder entry in registry's REGISTRY_SERVICE_ACCOUNTS.
      REGISTRY_SERVICE_KEY: builder-registry-read-local-secret
      # Shared with gatekeeper so its disable-gate can read effective org state.
      BUILDER_INTERNAL_KEY: builder-internal-local-secret
    ports:
      - "8095:8095"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
    restart: on-failure

  forgejo:
    image: codeberg.org/forgejo/forgejo:10
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: forgejo-compose-local-secret-key-dev
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://forgejo:3000
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__log__LEVEL: warn
      GITEA_ADMIN_USER: forgejo-admin
      GITEA_ADMIN_PASSWORD: forgejo-local-admin-pass
      GITEA_ADMIN_EMAIL: admin@forgejo.local
    volumes:
      - forgejo_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: on-failure

  forgejo-setup:
    image: alpine:3.23.3
    depends_on:
      forgejo:
        condition: service_healthy
    volumes:
      - forgejo_token:/token
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl >/dev/null 2>&1
        if [ -f /token/token.txt ] && [ -s /token/token.txt ]; then
          echo 'Forgejo token already exists'; exit 0
        fi
        # Forgejo 10 does not auto-create the admin from env vars — create via API if needed.
        curl -sf -X POST http://forgejo:3000/api/v1/admin/users \
          -H 'Content-Type: application/json' \
          -H 'Authorization: basic Zm9yZ2Vqby1hZG1pbjpmb3JnZWpvLWxvY2FsLWFkbWluLXBhc3M=' \
          -d '{"username":"forgejo-admin","password":"forgejo-local-admin-pass","email":"admin@forgejo.local","login_name":"forgejo-admin","source_id":0,"must_change_password":false}' \
          >/dev/null 2>&1 || true
        TOKEN=$(curl -sf \
          -u forgejo-admin:forgejo-local-admin-pass \
          -X POST http://forgejo:3000/api/v1/users/forgejo-admin/tokens \
          -H 'Content-Type: application/json' \
          -d '{"name":"compose-local","scopes":["write:admin","write:organization","write:issue","write:repository","write:user","read:user","read:repository","read:organization"]}' | \
          grep -o '"sha1":"[^"]*"' | cut -d'"' -f4)
        [ -z "$TOKEN" ] && echo 'Failed to create Forgejo token' && exit 1
        printf '%s' "$TOKEN" > /token/token.txt
        chmod 644 /token/token.txt
        echo 'Forgejo token created'
    restart: "no"

  gatekeeper-integration-tests:
    build:
      context: ../../tests/gatekeeper
    environment:
      API_URL: http://gatekeeper:8081
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/gatekeeper
      GATEKEEPER_SERVICE_KEY: test-service:test-service-local-secret
      REDIS_URL: redis://redis:6379/0
    depends_on:
      gatekeeper:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [test]
    restart: no

  registry-integration-tests:
    build:
      context: ../../tests/registry
    environment:
      REGISTRY_URL: http://registry:8084
      REGISTRY_ADMIN_KEY: registry-admin:registry-admin-local-secret
      REGISTRY_READ_KEY: registry-test-reader:registry-test-reader-local-secret
    depends_on:
      registry:
        condition: service_started
    profiles: [test]
    restart: no

  conductor-integration-tests:
    build:
      context: ../../tests/conductor
    environment:
      CONDUCTOR_URL: http://conductor:8080
      CONDUCTOR_NOTIFY_KEY: conductor-notify-local-secret
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/gatekeeper
    depends_on:
      conductor:
        condition: service_started
      postgres:
        condition: service_healthy
    profiles: [test]
    restart: no

  portal-integration-tests:
    build:
      context: ../../tests/portal
    environment:
      PORTAL_URL: http://portal:3001
      API_URL: http://conductor:8080
    depends_on:
      portal:
        condition: service_started
      conductor:
        condition: service_started
    profiles: [test]
    restart: no

  forge-integration-tests:
    build:
      context: ../../tests/forge
    environment:
      FORGE_URL: http://forge:8083
      GATEKEEPER_URL: http://gatekeeper:8081
    depends_on:
      forge:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  workflows-integration-tests:
    build:
      context: ../../tests/workflows
    environment:
      WORKFLOWS_URL: http://workflows:8085
      GATEKEEPER_URL: http://gatekeeper:8081
    depends_on:
      workflows:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  hooks:
    build:
      context: ../../src/systems/hooks
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hooks
      GATEKEEPER_URL: http://gatekeeper:8081
      WORKFLOWS_URL: http://workflows:8085
      GATEKEEPER_SERVICE_KEY: hooks-local-secret
      HOOKS_TRIGGER_KEY: hooks-trigger-local-secret
      # GitHub App integration (optional — configure to enable check runs)
      # GITHUB_APP_ID: ""
      # GITHUB_APP_PRIVATE_KEY: ""       # PEM content or use GITHUB_APP_PRIVATE_KEY_FILE
      # GITHUB_APP_WEBHOOK_SECRET: ""
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      workflows:
        condition: service_started
    restart: on-failure

  hooks-integration-tests:
    build:
      context: ../../tests/hooks
    environment:
      HOOKS_URL: http://hooks:8087
      WORKFLOWS_URL: http://workflows:8085
      GATEKEEPER_URL: http://gatekeeper:8081
    depends_on:
      hooks:
        condition: service_started
      workflows:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  outpost-gateway-integration-tests:
    build:
      context: ../../tests/outpost-gateway
    environment:
      OUTPOST_GATEWAY_URL: http://outpost-gateway:8092
      GATEKEEPER_URL: http://gatekeeper:8081
      OUTPOST_INTERNAL_KEY: outpost-internal-local-secret
    depends_on:
      outpost-gateway:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  mcp:
    build:
      context: ../../src/systems/mcp
    environment:
      CODEARMORY_URL: http://conductor:8080
      # CODEARMORY_TOKEN: set this to a valid bearer token before use
    stdin_open: true
    tty: true
    depends_on:
      conductor:
        condition: service_started
    profiles: [mcp]
    restart: "no"

volumes:
  postgres_data:
  forgejo_data:
  forgejo_token:

networks:
  # forge-exec is an isolated bridge network for execution containers.
  # internal: true blocks all direct egress to the internet; the only outbound
  # path is through the egress-proxy service which enforces a domain allowlist.
  # The fixed name is required so the forge runtime can reference it by name
  # when creating containers (FORGE_NETWORK_MODE=forge-exec).
  forge-exec:
    name: forge-exec
    driver: bridge
    internal: true
