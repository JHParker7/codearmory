services:
  # ── Database ──────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Cache ─────────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Application services ──────────────────────────────────────────────────────

  gatekeeper:
    build:
      context: ../../src/systems/gatekeeper
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gatekeeper
      REDIS_URL: redis://redis:6379/0
      SERVICES: blueprints=http://blueprints:8081,forge=http://forge:8083
      CONDUCTOR_SERVICE_EMAIL: conductor@internal
      CONDUCTOR_SERVICE_PASSWORD: conductor-local-secret
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  blueprints:
    build:
      context: ../../src/systems/blueprints
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/blueprints
      GATEKEEPER_URL: http://gatekeeper:8080
      REDIS_URL: redis://redis:6379/1
      # ENCRYPTION_KEY: <64-hex-char key> — omit to store state as plaintext
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gatekeeper:
        condition: service_started
    restart: on-failure

  forge:
    build:
      context: ../../src/systems/forge
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/forge
      RUNTIME: docker
      # ALLOWED_IMAGES: alpine:3.19,ubuntu:22.04,python:3.12-slim
      # K8S_NAMESPACE: forge          # set when RUNTIME=kubernetes
      # K8S_RUNTIME_CLASS: gvisor     # optional: use gVisor for stronger isolation
    ports:
      - "8083:8083"
    volumes:
      # Mount the Docker socket for the local docker runtime.
      # Remove this when deploying to Kubernetes (use RUNTIME=kubernetes instead).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  conductor:
    build:
      context: ../../src/systems/conductor
    environment:
      GATEKEEPER_URL: http://gatekeeper:8080
      CONDUCTOR_SERVICE_EMAIL: conductor@internal
      CONDUCTOR_SERVICE_PASSWORD: conductor-local-secret
    ports:
      - "8082:8082"
    depends_on:
      gatekeeper:
        condition: service_started
      blueprints:
        condition: service_started
      forge:
        condition: service_started
    restart: on-failure

volumes:
  postgres_data:
