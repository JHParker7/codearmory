# config not for production use. set up to test integration tests on PRs
services:
  # ── Database ──────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    # No host port binding — postgres is only reachable by services on this
    # internal network. Expose on the host only for local debugging if needed.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Cache ─────────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    # No host port binding — redis is only reachable by services on this network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Application services ──────────────────────────────────────────────────────

  gatekeeper:
    build:
      context: ../../src/systems/gatekeeper
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gatekeeper
      REDIS_URL: redis://redis:6379/0
      GATEKEEPER_SERVICES: blueprints=blueprints-local-secret,forge=forge-local-secret,workflows=workflows-local-secret,tickets=tickets-local-secret
      SIGNUP_RATE_LIMIT: "1000"
      SIGNUP_RATE_WINDOW: 1h
      LOGIN_RATE_LIMIT: "1000"
      LOGIN_RATE_WINDOW: 1h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

  registry:
    build:
      context: ../../src/systems/registry
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/registry
      ADMIN_KEY: registry-admin-local-secret
      READ_KEY: registry-read-local-secret
      SERVICES: blueprints=http://blueprints:8081,forge=http://forge:8083,gatekeeper=http://gatekeeper:8080
      MANIFEST_FILE: /etc/registry/manifest.json
    volumes:
      - ./registry-manifest.json:/etc/registry/manifest.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  blueprints:
    build:
      context: ../../src/systems/blueprints
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/blueprints
      GATEKEEPER_URL: http://gatekeeper:8080
      REDIS_URL: redis://redis:6379/1
      # Must match the blueprints entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: blueprints-local-secret
    entrypoint: ["/bin/sh", "-c", "ENCRYPTION_KEY=$(od -An -N32 -tx1 /dev/urandom | tr -d ' \\n') exec ./blueprints"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
    restart: on-failure

  forge:
    build:
      context: ../../src/systems/forge
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/forge
      RUNTIME: docker
      GATEKEEPER_URL: http://gatekeeper:8080
      ALLOWED_IMAGES: alpine:3.19,ubuntu:22.04,python:3.12-slim
      # Must match the forge entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: forge-local-secret
      # K8S_NAMESPACE: forge          # set when RUNTIME=kubernetes
      # K8S_RUNTIME_CLASS: gvisor     # optional: use gVisor for stronger isolation
    volumes:
      # Mount the Docker socket for the local docker runtime.
      # Remove this when deploying to Kubernetes (use RUNTIME=kubernetes instead).
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # Add the host docker group so the svc user can reach the Docker socket.
      # Set DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) before running compose.
      - "${DOCKER_GID:?DOCKER_GID must be set to the host docker group GID (stat -c '%g' /var/run/docker.sock)}"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
    restart: on-failure

  conductor:
    build:
      context: ../../src/systems/conductor
    environment:
      GATEKEEPER_URL: http://gatekeeper:8080
      REGISTRY_URL: http://registry:8084
      REGISTRY_READ_KEY: registry-read-local-secret
      CONDUCTOR_FORWARD_KEY: forge-conductor-shared-local-secret
    ports:
      - "8082:8082"
    depends_on:
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
    restart: on-failure

  workflows:
    build:
      context: ../../src/systems/workflows
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/workflows
      GATEKEEPER_URL: http://gatekeeper:8080
      SERVICES: forge=http://forge:8083,blueprints=http://blueprints:8081,registry=http://registry:8084,conductor=http://conductor:8082
      GATEKEEPER_SERVICE_KEY: workflows-local-secret
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      forge:
        condition: service_started
    restart: on-failure

  tickets:
    build:
      context: ../../src/systems/tickets
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tickets
      GATEKEEPER_URL: http://gatekeeper:8080
      GATEKEEPER_SERVICE_KEY: tickets-local-secret
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
    restart: on-failure

  gatekeeper-integration-tests:
    build:
      context: ../../tests/gatekeeper
    environment:
      API_URL: http://gatekeeper:8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gatekeeper
    depends_on:
      gatekeeper:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles: [test]
    restart: no

  blueprints-integration-tests:
    build:
      context: ../../tests/blueprints
    environment:
      BLUEPRINTS_URL: http://blueprints:8081
      GATEKEEPER_URL: http://gatekeeper:8080
    depends_on:
      blueprints:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  registry-integration-tests:
    build:
      context: ../../tests/registry
    environment:
      REGISTRY_URL: http://registry:8084
      REGISTRY_ADMIN_KEY: registry-admin-local-secret
      REGISTRY_READ_KEY: registry-read-local-secret
    depends_on:
      registry:
        condition: service_started
    profiles: [test]
    restart: no

  conductor-integration-tests:
    build:
      context: ../../tests/conductor
    environment:
      CONDUCTOR_URL: http://conductor:8082
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gatekeeper
    depends_on:
      conductor:
        condition: service_started
      postgres:
        condition: service_healthy
    profiles: [test]
    restart: no

  forge-integration-tests:
    build:
      context: ../../tests/forge
    environment:
      FORGE_URL: http://forge:8083
      GATEKEEPER_URL: http://gatekeeper:8080
    depends_on:
      forge:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  workflows-integration-tests:
    build:
      context: ../../tests/workflows
    environment:
      WORKFLOWS_URL: http://workflows:8085
      GATEKEEPER_URL: http://gatekeeper:8080
    depends_on:
      workflows:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  tickets-integration-tests:
    build:
      context: ../../tests/tickets
    environment:
      TICKETS_URL: http://tickets:8086
      GATEKEEPER_URL: http://gatekeeper:8080
    depends_on:
      tickets:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

volumes:
  postgres_data:
