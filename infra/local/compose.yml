# config not for production use. set up to test integration tests on PRs
# Shared OpenTelemetry env for application services. Each one sends OTLP to the
# otelcol service, which forwards traces to Jaeger (UI at http://localhost:16686).
# OTEL_TRACES_SAMPLER=always_on captures every trace locally; production tunes
# sampling via the Helm chart's `otel.sampler` value.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
  OTEL_TRACES_SAMPLER: always_on

services:
  # ── Database ──────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    # No host port binding — postgres is only reachable by services on this
    # internal network. Expose on the host only for local debugging if needed.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Cache ─────────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    # No host port binding — redis is only reachable by services on this network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Application services ──────────────────────────────────────────────────────

  # ── Observability ─────────────────────────────────────────────────────────────
  # The collector receives OTLP from every service and forwards traces to Jaeger
  # (UI on :16686); metrics and logs go to the collector's debug exporter and are
  # visible via `docker compose logs otelcol`. See otelcol.yml.

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
    restart: unless-stopped

  otelcol:
    image: otel/opentelemetry-collector:0.115.1
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otelcol.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  gatekeeper:
    build:
      context: ../../src/systems
      dockerfile: gatekeeper/Dockerfile
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/gatekeeper
      REDIS_URL: redis://redis:6379/0
      GATEKEEPER_SERVICES: forge=forge-local-secret,workflows=workflows-local-secret,events=events-local-secret,outpost-gateway=outpost-gateway-local-secret,builder=builder-local-secret,tickets=tickets-local-secret,git_connector=git-local-secret,codearmory_git_factory=git-factory-local-secret,gitea_integration=gitea-integration-local-secret,containers=containers-local-secret,test-service=test-service-local-secret,wiki=wiki-local-secret
      SECRETS_LOOKUP_ALLOWED_CALLERS: "forge,containers"
      REGISTRY_URL: http://registry:8084
      REGISTRY_SERVICE_KEY: gatekeeper-registry-read-local-secret
      # Org-service disable-gate: when both are set, gatekeeper denies requests to
      # services an org has disabled in builder. Unset = gate inert (fail-open).
      BUILDER_URL: http://builder:8095
      BUILDER_INTERNAL_KEY: builder-internal-local-secret
      OIDC_ISSUER: http://localhost:8080
      # LOCAL HTTP ONLY — never set this in a deployed environment (the Helm chart
      # leaves it unset, so the cookie stays Secure there).
      #
      # The session cookie is the portal's credential: the SPA no longer keeps the JWT
      # in localStorage, so `armory_session` is what carries a reloaded tab. Chrome
      # refuses to STORE a Secure cookie from a non-secure origin, and this stack is
      # plain http on hostnames like http://portal:3001 — not localhost, so it gets no
      # exemption. Left at the default, the cookie is silently dropped and every
      # browser session dies on refresh.
      COOKIE_SECURE: "false"
      GATEKEEPER_SECRETS_KEY: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
      SIGNUP_RATE_LIMIT: "1000"
      SIGNUP_RATE_WINDOW: 1h
      LOGIN_RATE_LIMIT: "1000"
      LOGIN_RATE_WINDOW: 1h
      # Optional bootstrap admin. When both EMAIL and PASSWORD are set, gatekeeper
      # seeds this account on startup with full access and the "first user becomes
      # admin" fallback is disabled. Both read via secret() so *_FILE mounts work.
      # GATEKEEPER_ADMIN_EMAIL: admin@codearmory.local
      # GATEKEEPER_ADMIN_PASSWORD: changeme123
      # GATEKEEPER_ADMIN_USERNAME: admin   # optional; defaults to the email local-part
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

  registry:
    build:
      context: ../../src/systems
      dockerfile: registry/Dockerfile
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/registry
      REGISTRY_SERVICE_ACCOUNTS: conductor=registry-read-local-secret,workflows=workflows-registry-local-secret,gatekeeper=gatekeeper-registry-read-local-secret,builder=builder-registry-read-local-secret,registry-test-reader=registry-test-reader-local-secret
      REGISTRY_ADMIN_ACCOUNTS: registry-admin=registry-admin-local-secret
      SERVICES: forge=http://forge:8083,gatekeeper=http://gatekeeper:8081
      CONDUCTOR_URL: http://conductor:8080
      CONDUCTOR_NOTIFY_KEY: conductor-notify-local-secret
      MANIFEST_FILE: /etc/registry/manifest.json
    volumes:
      - ./registry-manifest.json:/etc/registry/manifest.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

  # ── Egress proxy ─────────────────────────────────────────────────────────────
  # Sits on both the default network (internet access) and the internal
  # forge-exec network. Execution containers on forge-exec can only reach the
  # internet through this proxy; direct outbound traffic is blocked by the
  # internal network flag. Default PROXY_ALLOWED_DOMAINS is "*" (public-only: any
  # public host, but the proxy's IP guard still blocks private/internal/metadata
  # addresses). Set FORGE_PROXY_ALLOWED_DOMAINS to a comma-separated domain allowlist
  # to restrict which external hosts containers may contact.

  egress-proxy:
    build:
      context: ../../src/systems
      dockerfile: egress-proxy/Dockerfile
    environment:
      <<: *otel-env
      PROXY_ALLOWED_DOMAINS: ${FORGE_PROXY_ALLOWED_DOMAINS:-*}
    networks:
      - default
      - forge-exec
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3128/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  forge:
    build:
      context: ../../src/systems
      dockerfile: forge/Dockerfile
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/forge
      RUNTIME: docker
      GATEKEEPER_URL: http://gatekeeper:8081
      ALLOWED_IMAGES: alpine:3.19,ubuntu:22.04,python:3.12-slim,golang:1.25
      # The forge/git-clone step runs on a forge-controlled minimal git image (users
      # never pick one; it bypasses ALLOWED_IMAGES). To exercise git-clone locally
      # before CI publishes the image, build it from the repo root first:
      #   docker build -t ghcr.io/code-armory-app/runner-git:latest infra/runner-images/git
      FORGE_GIT_IMAGE: ghcr.io/code-armory-app/runner-git:latest
      # Must match the forge entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: forge-local-secret
      # Job secret_refs: forge resolves "secret:<name>" via gatekeeper (forge must
      # be in SECRETS_LOOKUP_ALLOWED_CALLERS), "git:<repo-url>" by minting clone
      # credentials via the core git broker, and "gitea:<owner>/<repo>" via the
      # optional gitea-integration service. The *_INTERNAL_KEY values must match the
      # corresponding service.
      GIT_INTERNAL_URL: http://git:8096
      GIT_INTERNAL_KEY: forge-git-internal-local-secret
      GITEA_INTERNAL_URL: http://gitea-integration:8088
      GITEA_INTERNAL_KEY: forge-gitea-internal-local-secret
      # Execution containers join the internal forge-exec network and route all
      # outbound traffic through the egress proxy's allowlist. Direct internet
      # access is blocked by the internal: true flag on that network.
      FORGE_NETWORK_MODE: forge-exec
      FORGE_EGRESS_PROXY: http://egress-proxy:3128
      # K8S_NAMESPACE: forge          # set when RUNTIME=kubernetes
      # K8S_RUNTIME_CLASS: gvisor     # optional: use gVisor for stronger isolation
    volumes:
      # Mount the Docker socket for the local docker runtime.
      # Remove this when deploying to Kubernetes (use RUNTIME=kubernetes instead).
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # Add the host docker group so the svc user can reach the Docker socket.
      # Set DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) before running compose.
      - "${DOCKER_GID:?DOCKER_GID must be set to the host docker group GID (stat -c '%g' /var/run/docker.sock)}"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
      egress-proxy:
        condition: service_healthy
    restart: on-failure

  conductor:
    build:
      context: ../../src/systems
      dockerfile: conductor/Dockerfile
    environment:
      <<: *otel-env
      GATEKEEPER_URL: http://gatekeeper:8081
      REGISTRY_URL: http://registry:8084
      REGISTRY_SERVICE_KEY: registry-read-local-secret
      CONDUCTOR_FORWARD_KEY: forge-conductor-shared-local-secret
      # Shared with registry (CONDUCTOR_NOTIFY_KEY) so registry can push route refreshes.
      CONDUCTOR_NOTIFY_KEY: conductor-notify-local-secret
      # The suspicious-activity block is keyed on source IP, and in this stack every
      # caller — the browser suite, the pytest suites, a developer's curl — arrives
      # from the same one. The browser tests deliberately exercise logged-out and
      # rejected-session states, so at the shipped threshold of 10 they lock
      # themselves (and everything else) out mid-run for an hour. Raised here for the
      # same reason LOGIN_RATE_LIMIT is; production leaves both unset.
      CONDUCTOR_SUSPECT_THRESHOLD: "100000"
      CONDUCTOR_BLOCK_DURATION: 1m
    ports:
      - "8080:8080"
    depends_on:
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
    restart: on-failure

  portal:
    # The portal BFF is a static Go binary (portal-bff) that serves the built SPA and
    # proxies /api to conductor — no Node runtime in the image. The build context is
    # src/systems so the Dockerfile can reach both ./portal (SPA source) and ./portal-bff.
    build:
      context: ../../src/systems
      dockerfile: portal-bff/Dockerfile
    environment:
      <<: *otel-env
      PORT: "3001"
      CONDUCTOR_URL: http://conductor:8080
    ports:
      - "3001:3001"
    depends_on:
      conductor:
        condition: service_started
    restart: on-failure

  workflows:
    build:
      context: ../../src/systems
      dockerfile: workflows/Dockerfile
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/workflows
      GATEKEEPER_URL: http://gatekeeper:8081
      SERVICES: registry=http://registry:8084,conductor=http://conductor:8080,events=http://events:8093
      REGISTRY_URL: http://registry:8084
      REGISTRY_SERVICE_KEY: workflows-registry-local-secret
      GATEKEEPER_SERVICE_KEY: workflows-local-secret
      EVENTS_TRIGGER_KEY: events-trigger-local-secret
      WORKFLOWS_TOKEN_KEY: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
      forge:
        condition: service_started
    restart: on-failure

  # ── Outpost integration framework ──────────────────────────────────────────
  # The outpost-gateway is the outpost-facing connection point (enroll,
  # long-poll commands, ingest events) and the Postgres event backbone. The
  # outpost itself runs in (or against) a target cluster with a KUBECONFIG and
  # is not part of the compose stack; run it separately for end-to-end tests.
  outpost-gateway:
    build:
      context: ../../src/systems
      dockerfile: outpost-gateway/Dockerfile
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/outpost_gateway
      GATEKEEPER_URL: http://gatekeeper:8081
      GATEKEEPER_SERVICE_KEY: outpost-gateway-local-secret
      # Shared HMAC secret for the internal command/event plane. Must match the
      # chaos and argo services' OUTPOST_INTERNAL_KEY.
      OUTPOST_INTERNAL_KEY: outpost-internal-local-secret
      # Maps each integration to its consumer service for event dispatch.
      EVENT_CONSUMERS: chaos=http://chaos:8090,argo=http://argo:8091
    ports:
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
    restart: on-failure

  builder:
    build:
      context: ../../src/systems
      dockerfile: builder/Dockerfile
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/builder
      GATEKEEPER_URL: http://gatekeeper:8081
      # Must match the builder entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: builder-local-secret
      REGISTRY_URL: http://registry:8084
      # Must match the builder entry in registry's REGISTRY_SERVICE_ACCOUNTS.
      REGISTRY_SERVICE_KEY: builder-registry-read-local-secret
      # Shared with gatekeeper so its disable-gate can read effective org state.
      BUILDER_INTERNAL_KEY: builder-internal-local-secret
    ports:
      - "8095:8095"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
    restart: on-failure

  # ── Tickets / Git / Container-registry (CORE, external images) ───────────────
  # Source lives in their own codearmory-<svc> repos; locally we run the published
  # images (override the tag with CODEARMORY_TAG). If the images are not pullable in
  # your dev environment these stay down — the rest of the core stack is unaffected.
  tickets:
    build:
      context: ../../src/systems
      dockerfile: tickets/Dockerfile
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/tickets
      GATEKEEPER_URL: http://gatekeeper:8081
      # Must match the tickets entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: tickets-local-secret
      EVENTS_URL: http://events:8093
      EVENTS_TRIGGER_KEY: events-trigger-local-secret
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
    restart: on-failure

  wiki:
    build:
      context: ../../src/systems
      dockerfile: wiki/Dockerfile
    environment:
      <<: *otel-env
      GATEKEEPER_URL: http://gatekeeper:8081
      # Must match the wiki entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: wiki-local-secret
      # Content storage: git via git-factory (model B — the wiki acts as its own bot).
      GIT_FACTORY_URL: http://git-factory:9002
      # The wiki logs in as this bot to write project wikis (model B). Provision the bot
      # once, then set WIKI_BOT_PASSWORD in your local env.
      WIKI_BOT_EMAIL: ${WIKI_BOT_EMAIL:-wiki-bot@codearmory.local}
      WIKI_BOT_PASSWORD: ${WIKI_BOT_PASSWORD:-}
      WIKI_NAMESPACE: ${WIKI_NAMESPACE:-codearmory-wiki-bot}
    ports:
      - "8110:8110"
    depends_on:
      gatekeeper:
        condition: service_healthy
      git-factory:
        condition: service_started
      registry:
        condition: service_started
    restart: on-failure

  gitea-integration:
    image: ghcr.io/code-armory-app/gitea_integration:${CODEARMORY_TAG:-alpha}
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/gitea_integration
      GATEKEEPER_URL: http://gatekeeper:8081
      # Must match the gitea_integration entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: gitea-integration-local-secret
      GITEA_URL: http://forgejo:3000
      # Admin token written to the shared volume by forgejo-setup; read via the *_FILE pattern.
      GITEA_ADMIN_TOKEN_FILE: /token/token.txt
      # Must match forge's GITEA_INTERNAL_KEY.
      GITEA_INTERNAL_KEY: forge-gitea-internal-local-secret
    volumes:
      - forgejo_token:/token:ro
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
      forgejo-setup:
        condition: service_completed_successfully
    restart: on-failure

  containers:
    build:
      context: ../../src/systems
      dockerfile: containers/Dockerfile
    environment:
      <<: *otel-env
      GATEKEEPER_URL: http://gatekeeper:8081
      # Must match the containers entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: containers-local-secret
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/containers
      # Forgejo ships a built-in OCI container registry. REGISTRY_URL is optional —
      # when set it seeds the default registry on first boot; additional registries
      # are configurable at runtime via the /registries API.
      REGISTRY_URL: http://forgejo:3000
      GITEA_INTEGRATION_URL: http://gitea-integration:8088
    ports:
      - "8089:8089"
    depends_on:
      gatekeeper:
        condition: service_healthy
      registry:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: on-failure

  forgejo:
    image: codeberg.org/forgejo/forgejo:10
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: forgejo-compose-local-secret-key-dev
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://forgejo:3000
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__log__LEVEL: warn
      GITEA_ADMIN_USER: forgejo-admin
      GITEA_ADMIN_PASSWORD: forgejo-local-admin-pass
      GITEA_ADMIN_EMAIL: admin@forgejo.local
    volumes:
      - forgejo_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: on-failure

  forgejo-setup:
    image: alpine:3.23.3
    depends_on:
      forgejo:
        condition: service_healthy
    volumes:
      - forgejo_token:/token
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl >/dev/null 2>&1
        if [ -f /token/token.txt ] && [ -s /token/token.txt ]; then
          echo 'Forgejo token already exists'; exit 0
        fi
        # Forgejo 10 does not auto-create the admin from env vars — create via API if needed.
        curl -sf -X POST http://forgejo:3000/api/v1/admin/users \
          -H 'Content-Type: application/json' \
          -H 'Authorization: basic Zm9yZ2Vqby1hZG1pbjpmb3JnZWpvLWxvY2FsLWFkbWluLXBhc3M=' \
          -d '{"username":"forgejo-admin","password":"forgejo-local-admin-pass","email":"admin@forgejo.local","login_name":"forgejo-admin","source_id":0,"must_change_password":false}' \
          >/dev/null 2>&1 || true
        TOKEN=$(curl -sf \
          -u forgejo-admin:forgejo-local-admin-pass \
          -X POST http://forgejo:3000/api/v1/users/forgejo-admin/tokens \
          -H 'Content-Type: application/json' \
          -d '{"name":"compose-local","scopes":["write:admin","write:organization","write:issue","write:repository","write:user","read:user","read:repository","read:organization"]}' | \
          grep -o '"sha1":"[^"]*"' | cut -d'"' -f4)
        [ -z "$TOKEN" ] && echo 'Failed to create Forgejo token' && exit 1
        printf '%s' "$TOKEN" > /token/token.txt
        chmod 644 /token/token.txt
        echo 'Forgejo token created'
    restart: "no"

  gatekeeper-integration-tests:
    build:
      context: ../../tests/gatekeeper
    environment:
      API_URL: http://gatekeeper:8081
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/gatekeeper
      GATEKEEPER_SERVICE_KEY: test-service:test-service-local-secret
      REDIS_URL: redis://redis:6379/0
    depends_on:
      gatekeeper:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [test]
    restart: no

  registry-integration-tests:
    build:
      context: ../../tests/registry
    environment:
      REGISTRY_URL: http://registry:8084
      REGISTRY_ADMIN_KEY: registry-admin:registry-admin-local-secret
      REGISTRY_READ_KEY: registry-test-reader:registry-test-reader-local-secret
    depends_on:
      registry:
        condition: service_started
    profiles: [test]
    restart: no

  conductor-integration-tests:
    build:
      context: ../../tests/conductor
    environment:
      CONDUCTOR_URL: http://conductor:8080
      CONDUCTOR_NOTIFY_KEY: conductor-notify-local-secret
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/gatekeeper
    depends_on:
      conductor:
        condition: service_started
      postgres:
        condition: service_healthy
    profiles: [test]
    restart: no

  portal-integration-tests:
    build:
      context: ../../tests/portal
    environment:
      PORTAL_URL: http://portal:3001
      API_URL: http://conductor:8080
    depends_on:
      portal:
        condition: service_started
      conductor:
        condition: service_started
    profiles: [test]
    restart: no

  # Browser E2E for the SPA (Playwright by default; run `-m selenium` for the
  # Selenium half). These are the only tests that exercise how the portal HOLDS a
  # session — the credential is an HttpOnly cookie the app cannot read, so nothing
  # below the browser can tell you whether a reload stays signed in.
  #
  # Depends on gatekeeper's COOKIE_SECURE=false above: over plain http on a non-
  # localhost hostname Chrome refuses to store a Secure cookie, and every session
  # test would fail on an empty session.
  portal-frontend-tests:
    build:
      context: ../../tests/portal-frontend
    environment:
      PORTAL_URL: http://portal:3001
      API_URL: http://conductor:8080
    depends_on:
      portal:
        condition: service_started
      conductor:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  forge-integration-tests:
    build:
      context: ../../tests/forge
    environment:
      FORGE_URL: http://forge:8083
      GATEKEEPER_URL: http://gatekeeper:8081
    depends_on:
      forge:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  workflows-integration-tests:
    build:
      context: ../../tests/workflows
    environment:
      WORKFLOWS_URL: http://workflows:8085
      GATEKEEPER_URL: http://gatekeeper:8081
    depends_on:
      workflows:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  events:
    build:
      context: ../../src/systems
      dockerfile: events/Dockerfile
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/events
      GATEKEEPER_URL: http://gatekeeper:8081
      WORKFLOWS_URL: http://workflows:8085
      TICKETS_URL: http://tickets:8086
      GATEKEEPER_SERVICE_KEY: events-local-secret
      # Shared with workflows (pipeline dispatch + run polling) and with every emitter
      # (git-factory, tickets) that signs an event.
      EVENTS_TRIGGER_KEY: events-trigger-local-secret
      # Keys the provider HMAC on the public webhook endpoints (/hooks, /hooks/git,
      # /hooks/gitea). Unset closes them — an unsigned webhook is never trusted.
      EVENTS_WEBHOOK_SECRET: events-webhook-local-secret
      # GitHub App integration (optional — configure to enable check runs)
      # GITHUB_APP_ID: ""
      # GITHUB_APP_PRIVATE_KEY: ""       # PEM content or use GITHUB_APP_PRIVATE_KEY_FILE
      # GITHUB_APP_WEBHOOK_SECRET: ""
    ports:
      - "8093:8093"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      workflows:
        condition: service_started
    restart: on-failure

  git:
    build:
      context: ../../src/systems
      dockerfile: git/Dockerfile
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/git
      GATEKEEPER_URL: http://gatekeeper:8081
      # Must match the git_connector entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: git-local-secret
      # Encrypts linked-backend credential material at rest (AES-256-GCM).
      GIT_ENCRYPTION_KEY: git-encryption-local-secret
      # Authenticates forge/workflows → /internal/clone-token. Must match forge's
      # GIT_INTERNAL_KEY.
      GIT_INTERNAL_KEY: forge-git-internal-local-secret
    ports:
      - "8096:8096"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
    restart: on-failure

  # The platform's own git host. Core (in-repo) since the git_factory repo was folded
  # in; registered as codearmory_git_factory, which is the service identity the RBAC
  # resources and gatekeeper registration key on — the Go module is git_factory, the
  # registry name is not.
  git-factory:
    build:
      context: ../../src/systems
      dockerfile: git-factory/Dockerfile
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/git_factory
      GATEKEEPER_URL: http://gatekeeper:8081
      # Must match the codearmory_git_factory entry in gatekeeper's GATEKEEPER_SERVICES.
      GATEKEEPER_SERVICE_KEY: git-factory-local-secret
      # Repo storage. A named volume, not a bind mount: the git plane shells out to
      # git-receive-pack, which needs a real filesystem it owns.
      GIT_STORAGE_ROOT: /var/lib/git-factory
      # Push events go to the events service, which fans them out to matching triggers.
      # The key must match the one events and workflows share.
      EVENTS_URL: http://events:8093
      EVENTS_TRIGGER_KEY: events-trigger-local-secret
    volumes:
      - git-factory-data:/var/lib/git-factory
    ports:
      - "9002:9002"
    depends_on:
      postgres:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
    restart: on-failure

  events-integration-tests:
    build:
      context: ../../tests/events
    environment:
      EVENTS_URL: http://events:8093
      EVENTS_WEBHOOK_SECRET: events-webhook-local-secret
      WORKFLOWS_URL: http://workflows:8085
      GATEKEEPER_URL: http://gatekeeper:8081
    depends_on:
      events:
        condition: service_started
      workflows:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  outpost-gateway-integration-tests:
    build:
      context: ../../tests/outpost-gateway
    environment:
      OUTPOST_GATEWAY_URL: http://outpost-gateway:8092
      GATEKEEPER_URL: http://gatekeeper:8081
      OUTPOST_INTERNAL_KEY: outpost-internal-local-secret
    depends_on:
      outpost-gateway:
        condition: service_started
      gatekeeper:
        condition: service_healthy
    profiles: [test]
    restart: no

  mcp:
    build:
      context: ../../src/systems/mcp
    environment:
      CODEARMORY_URL: http://conductor:8080
      # CODEARMORY_TOKEN: set this to a valid bearer token before use
    stdin_open: true
    tty: true
    depends_on:
      conductor:
        condition: service_started
    profiles: [mcp]
    restart: "no"

volumes:
  postgres_data:
  forgejo_data:
  forgejo_token:
  git-factory-data:

networks:
  # forge-exec is an isolated bridge network for execution containers.
  # internal: true blocks all direct egress to the internet; the only outbound
  # path is through the egress-proxy service which enforces a domain allowlist.
  # The fixed name is required so the forge runtime can reference it by name
  # when creating containers (FORGE_NETWORK_MODE=forge-exec).
  forge-exec:
    name: forge-exec
    driver: bridge
    internal: true
