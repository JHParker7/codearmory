# Local OpenTelemetry Collector config. Receives OTLP from every service (the
# codearmory_sdk telemetry.Setup exports traces, metrics, and logs over OTLP/HTTP
# to http://otelcol:4318) and forwards traces to Jaeger for a browsable UI.
# Metrics and logs go to the debug exporter — visible in `docker compose logs
# otelcol` — to keep the local stack lightweight (no Prometheus/Loki/Grafana).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Forward traces to Jaeger all-in-one (OTLP receiver on :4317). View at
  # http://localhost:16686.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
