# The JuiceFS filesystem definition, and the StorageClass that hands it out.
#
# There is no separate `juicefs format` step: the CSI controller formats the
# volume the first time it provisions against this secret, and every node that
# mounts it reads the same secret. That is why the secret carries both halves —
# the metadata engine URL and the object-store coordinates.
apiVersion: v1
kind: Secret
metadata:
  name: juicefs-git-factory
  namespace: juicefs
type: Opaque
stringData:
  # The JuiceFS volume name, recorded in the metadata engine at format time.
  # Changing it later points the driver at a DIFFERENT filesystem rather than
  # renaming this one.
  name: git-factory
  # Sentinel, not a direct connection: the address here is the SENTINEL service,
  # and the client asks it which instance is currently the primary.
  #
  # Read the format carefully, because it does not look like a normal Redis URL —
  # the first element of the host list is the MASTER NAME, not a host, and every
  # Sentinel address shares the single trailing port:
  #
  #   redis[s]://[[USER]:PASSWORD@]MASTER_NAME,SENTINEL[,SENTINEL]:PORT[/DB]
  #
  # so `jfs-meta` below is the monitored master's name (10-meta-redis.yaml,
  # `sentinel monitor jfs-meta ...`) and NOT a hostname that resolves. Getting this
  # wrong yields a connection error naming a host that does not exist, which reads
  # like a DNS problem and is not one.
  #
  # A real deployment adds `:PASSWORD@` here AND sets SENTINEL_PASSWORD in the
  # mount pod's environment — they are two different credentials, and the URL's
  # password is not used to authenticate to Sentinel.
  #
  # The trailing /1 is the Redis database number, and it is part of the
  # filesystem's identity: changing it points at a different (empty) filesystem
  # rather than reconnecting to this one.
  metaurl: redis://jfs-meta,juicefs-sentinel.juicefs.svc.cluster.local:26379/1
  storage: minio
  # THE BUCKET AND THE METADATA ENGINE ARE A MATCHED PAIR, and JuiceFS enforces it:
  # formatting a fresh engine against a prefix that already holds blocks fails with
  #
  #   Storage minio://.../git-factory/ is not empty; please clean it up or pick
  #   another volume name
  #
  # which is the right refusal — those blocks belong to a filesystem whose metadata
  # says what they are, and a new engine would have no idea. It is worth knowing
  # before an engine swap rather than during one: changing `metaurl` alone does not
  # migrate anything, it asks for a NEW filesystem, and the old bucket contents
  # block it. Either start on a clean prefix (change `name` above, which changes the
  # object prefix) or empty the old one, and either way re-run the migration job —
  # the repos do not follow the metadata engine.
  #
  # It is also why "one bucket or prefix per shard" appears in the sharding design:
  # one engine, one prefix, no sharing.
  bucket: http://juicefs-minio.juicefs.svc.cluster.local:9000/git-factory
  access-key: juicefs
  secret-key: juicefs123
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: juicefs-git-factory
provisioner: csi.juicefs.com
# Retain, not Delete. Pushed source lives only here, and the whole reason the
# chart takes `persistence.existingClaim` is that this store must outlive any one
# release's lifecycle (values.yaml, gitFactory.persistence.existingClaim).
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/provisioner-secret-name: juicefs-git-factory
  csi.storage.k8s.io/provisioner-secret-namespace: juicefs
  csi.storage.k8s.io/node-publish-secret-name: juicefs-git-factory
  csi.storage.k8s.io/node-publish-secret-namespace: juicefs
  # Give the subdirectory a name a human can recognise in the metadata engine.
  pathPattern: "${.PVC.namespace}-${.PVC.name}"
mountOptions:
  # Local read cache in front of the object store (ARCHITECTURE §5 Step 2: "a
  # local NVMe read cache in front"). Git is read-heavy on packfiles.
  - cache-size=2048
  # NEVER add --writeback here. ARCHITECTURE §"Never enable JuiceFS --writeback"
  # is explicit: it buffers writes locally and uploads them later, so a node loss
  # loses acknowledged pushes, and a second pod does not see them at all — which
  # would quietly break the very cross-pod visibility this setup exists to give.
---
# The repo store itself. ReadWriteMany is the thing that makes
# gitFactory.replicaCount > 1 legal at all — the chart refuses to render more
# than one replica against a ReadWriteOnce claim (git-factory-deployment.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-factory-repos
  namespace: gitfactory
spec:
  accessModes: [ReadWriteMany]
  storageClassName: juicefs-git-factory
  resources:
    requests:
      # JuiceFS does not preallocate; this is the quota the CSI driver records,
      # not space taken from the object store.
      storage: 20Gi
