# codearmory dogfood CI pipeline (state machine authored as YAML).
# Converted from codearmory-ci.json; run scripts are block scalars for readability.
name: codearmory-ci
description: 'dogfood CI: checkout -> [build+test per module] -> image builds, with a gocache that persists across runs'
project: codearmory
# Whole-run wall-clock cap (default 1800/30m). Raised to 1h: a cold-cache run that must
# rebuild every service (e.g. after the reaper clears the gocache) can exceed 30 minutes.
timeout_secs: 3600
# No declared inputs: the hooks service injects every webhook payload field at run
# time as HOOK_<KEY> (HOOK_REF, HOOK_COMMIT, HOOK_REPO, …), so ${inputs.HOOK_*} resolves
# without needing declarations. The outpost deploy target is a fixed value, hardcoded
# at its use sites below rather than passed in.
steps:
- action: forge/create-volume
  name: workspace
  with:
    workflow_id: ${run_id}
    name: workspace
    size_mb: 512
    medium: disk
- action: forge/create-volume
  name: gocache
  with:
    # NOT ${run_id}: a fixed workflow_id makes this volume outlive the run, the same trick
    # gitcache uses. create-volume is idempotent on (workflow_id, name), so the first run
    # provisions the PVC and every later run re-attaches it with the Go module cache AND the
    # compile (build) cache intact — the build cache is what collapses the `test` step
    # from minutes to seconds. This replaces the old restore/save-gocache artifact dance.
    # Caveat: forge's reaper deletes volumes older than FORGE_VOLUME_MAX_AGE_SECS (default
    # 2h), so the cache is periodically rebuilt; warm-cache handles a cold cache by
    # re-downloading, so a reap costs one slow run, never a failure. Raise that env on the
    # forge deployment to make the cache longer-lived.
    workflow_id: codearmory-ci-gocache
    name: gocache
    size_mb: 8192
    medium: disk
- action: forge/create-volume
  name: gitcache
  with:
    # NOT ${run_id}: a fixed workflow_id is what makes this volume outlive the run.
    # create-volume is idempotent on (workflow_id, name), so the first run provisions the
    # PVC and every later run re-attaches the same one with its object store intact.
    # Caveat: forge's reaper deletes volumes older than FORGE_VOLUME_MAX_AGE_SECS
    # (default 2h), so the cache is periodically rebuilt — checkout handles a cold cache
    # by cloning, so a reap costs one slow run, never a failure.
    workflow_id: codearmory-ci-gitcache
    name: gitcache
    size_mb: 4096
    medium: disk
- action: forge/create-volume
  name: npmcache
  with:
    # The npm counterpart of gocache, and a fixed workflow_id for the same reason: it
    # must outlive the run. `npm ci` deletes node_modules and reinstalls ~254 packages
    # every time; with npm_config_cache pointed here the tarballs come off disk instead
    # of the network. Same reaper caveat as gocache — if the volume is reaped the next
    # run simply repopulates it, so a cold cache costs time, never a failure.
    workflow_id: codearmory-ci-npmcache
    name: npmcache
    size_mb: 2048
    medium: disk
- action: forge/run
  name: checkout
  timeout: 900
  with:
    image: golang:1.25
    runner_class: ci
    timeout: 900
    env:
      HOOK_REF: ${inputs.HOOK_REF}
      # Bare ${HOOK_BEFORE}, deliberately NOT ${inputs.HOOK_BEFORE}. A bare reference is
      # indistinguishable from shell syntax, so the engine resolves it when the webhook
      # supplied it and passes the literal through untouched when it did not, instead of
      # failing the step. That decoupling is the point: git_factory only started sending
      # this field recently, and this pipeline must keep working against a git_factory
      # that has not been redeployed yet. The script below treats anything that is not a
      # hex SHA as absent, which covers the unresolved literal.
      HOOK_BEFORE: ${HOOK_BEFORE}
    secret_refs:
      # Clone the monorepo from git_factory (admin/codearmory), brokered by git_connector,
      # instead of forgejo — git_factory is now the git host. (The image registry below is
      # separate: git_factory is not a container registry, so pushes still go to forgejo.)
      #
      # The IN-CLUSTER service address, deliberately, not the public ingress hostname.
      # A sandbox reaches git_factory directly over the pod network, so routing the clone
      # out through the ingress buys nothing and costs a TLS hop whose certificate a stock
      # runner image does not trust. The host here must also match the host of the
      # git_connector backend that owns this repo — the broker selects the backend by the
      # URL's host, so the two are one setting in two places.
      GIT_CLONE_URL: git:http://ca-codearmory-git-factory:9002/admin/codearmory.git
    volumes:
    - workflow_id: codearmory-ci-gitcache
      name: gitcache
      mount_path: /gitcache
    - workflow_id: ${run_id}
      name: workspace
      mount_path: /workspace
      workdir: true
    run: |
      set -eu
      # Loud, early disk check, in the FIRST step of the run. A full node does not
      # fail a build cleanly, it makes kaniko crawl: one build-push took 27 minutes
      # against a normal 90 seconds and then died on "context deadline exceeded",
      # which reads as a registry or network fault and sends you looking in the wrong
      # place. Printing the number here attaches the explanation to the run BEFORE the
      # confusing failure, instead of after an hour of debugging.
      #
      # `df /` inside a sandbox is the NODE's filesystem (the pod's writable layer
      # lives on it), so this really is the disk that image builds compete for.
      df -h / || true
      DISK_USED=$(df -P / 2>/dev/null | awk 'NR==2{print $5}' | tr -d '%')
      if [ "${DISK_USED:-0}" -ge 85 ]; then
        echo "=== WARNING: node disk is ${DISK_USED}% full ==="
        echo '=== Image builds will be slow or time out with "context deadline exceeded". ==='
        echo '=== prune-images reclaims the REGISTRY only. The node containerd cache, the  ==='
        echo '=== forge volume PVCs and the host docker images/volumes need cleanup on the ==='
        echo '=== host — none of them are reachable from inside a sandbox. See the         ==='
        echo '=== prune-images step output for the full list and the commands.             ==='
      fi
      # Never block on a credential prompt: without this a clone whose credential was
      # rejected waits for a username on a TTY that does not exist, and the step burns
      # its whole timeout instead of failing immediately with the auth error that
      # explains it — a wrong credential and an unreachable host look identical
      # otherwise, both just hanging until the timeout.
      export GIT_TERMINAL_PROMPT=0
      git config --global --add safe.directory /workspace
      git config --global --add safe.directory /gitcache/repo.git
      # 1. Keep a bare mirror on the cache volume. The full transfer happens only when the
      # cache is cold (first run, or after the reaper); every other run pays an
      # incremental fetch of just the new objects.
      if [ -d /gitcache/repo.git ]; then
        git -C /gitcache/repo.git remote set-url origin "$GIT_CLONE_URL"
        git -C /gitcache/repo.git fetch --prune --quiet
        echo '=== gitcache warm: incremental fetch ==='
      else
        git clone --mirror --quiet "$GIT_CLONE_URL" /gitcache/repo.git
        echo '=== gitcache cold: full mirror cloned ==='
      fi
      du -sh /gitcache/repo.git
      # 2. Check out from the LOCAL mirror rather than over the network: no pack
      # negotiation and no delta recompression, git just reads objects off the volume.
      # depth 2 keeps HEAD~1 present, which is discover's FALLBACK diff base — see the
      # base commit step below for the base it actually prefers.
      cd /workspace
      git init -q .
      git remote add origin file:///gitcache/repo.git 2>/dev/null \
        || git remote set-url origin file:///gitcache/repo.git
      git fetch -q --depth 2 origin "+refs/heads/${HOOK_REF}:refs/remotes/origin/${HOOK_REF}"
      git checkout -q -B "${HOOK_REF}" "refs/remotes/origin/${HOOK_REF}"
      git --no-pager log --oneline -1
      # 3. Make the push's BASE commit resolvable, so discover can diff the whole push
      # instead of just its last commit. HEAD~1 answers "what did the final commit
      # change", which for a push of n commits silently hides everything the other n-1
      # touched — services then never rebuild and the run still reports success.
      #
      # Only the base commit's own tree is needed (git diff A B compares two trees and
      # does not walk the history between them), so this is a depth-1 fetch of one
      # commit out of the local mirror, not a deepening of the clone. Fetched into a ref
      # rather than left dangling at FETCH_HEAD so nothing can reclaim it before
      # discover runs in a later container.
      #
      # allowAnySHA1InWant lets the mirror serve a raw SHA that no ref points at, which
      # is exactly the case here: the base commit is the ref's PREVIOUS tip. The mirror
      # is our own cache volume, not a published remote.
      #
      # A branch CREATION reports an all-zero base. That is hex and long enough to look
      # like a real SHA, so it must be excluded explicitly: fetching it fails, and the
      # HEAD~1 fallback would then build only the last commit's services on a push where
      # every file is new — the first push to a fresh remote would ship a near-empty
      # image set. Creation means "no base", which discover reads as rebuild-everything.
      BEFORE=""
      CREATED=""
      if [ -n "${HOOK_BEFORE:-}" ] && [ -z "$(printf '%s' "${HOOK_BEFORE}" | tr -d '0')" ]; then
        CREATED=1
      else
        case "${HOOK_BEFORE:-}" in
          "" | *[!0-9a-fA-F]*) ;;                      # absent, or the unresolved literal
          ???????*)            BEFORE="${HOOK_BEFORE}" ;;   # hex and >= 7 chars
        esac
      fi
      if [ -n "$CREATED" ]; then
        git update-ref refs/ci/created HEAD
        echo '=== branch creation (all-zero base): rebuilding every service ==='
      elif [ -n "$BEFORE" ]; then
        git -C /gitcache/repo.git config uploadpack.allowAnySHA1InWant true
        if git fetch -q --depth 1 origin "+${BEFORE}:refs/ci/before" 2>/dev/null; then
          echo "=== push base: ${BEFORE} (diffing the whole push) ==="
        else
          # The base is genuinely unreachable — a force-push that discarded it, or a
          # mirror reaped and recloned since. Falling back to HEAD~1 under-builds, so
          # say so loudly rather than letting it look like a normal run.
          echo "=== WARNING: push base ${BEFORE} not found in the mirror; discover falls back to HEAD~1 ==="
        fi
      else
        echo '=== no push base supplied; discover falls back to HEAD~1 ==='
      fi
- action: forge/run
  name: warm-cache
  timeout: 1800
  with:
    image: golang:1.25
    runner_class: ci
    timeout: 1800
    env:
      GOCACHE: /gocache/build
      GOFLAGS: -p=2
      GOMODCACHE: /gocache/mod
    volumes:
    - workflow_id: ${run_id}
      name: workspace
      mount_path: /workspace
      workdir: true
    - workflow_id: codearmory-ci-gocache
      name: gocache
      mount_path: /gocache
    run: |
      set -eu
      mkdir -p /gocache/mod /gocache/build
      cd /workspace/src/systems
      for d in $(go list -m -f '{{.Dir}}'); do ( cd "$d" && go mod download ); done
      ( cd /workspace/src/cli && go mod download )
      echo '=== module cache primed ==='
      du -sh /gocache/mod
- action: forge/run
  name: commit
  timeout: 120
  with:
    image: golang:1.25
    runner_class: standard
    timeout: 120
    output_env:
    - SHA
    - SUBJECT
    volumes:
    - workflow_id: ${run_id}
      name: workspace
      mount_path: /workspace
    run: |
      set -eu
      git config --global --add safe.directory /workspace
      cd /workspace
      SHA=$(git rev-parse --short HEAD)
      SUBJECT=$(git log -1 --pretty=%s)
      echo "commit: $SHA — $SUBJECT"
- action: tickets/create
  name: open-ticket
  timeout: 60
  with:
    title: codearmory-ci — ${steps.commit.output.SHA} ${steps.commit.output.SUBJECT}
    description: |-
      Automated CI for commit `${steps.commit.output.SHA}` on dev-2.

      Run: `${run_id}`
    status: in_progress
    run_id: ${run_id}
    workflow_id: ${workflow_id}
- action: forge/run
  name: discover
  timeout: 120
  with:
    image: golang:1.25
    runner_class: standard
    timeout: 120
    output_env:
    - MODULES
    - IMAGES
    - EXTRAS
    - PORTAL
    volumes:
    - workflow_id: ${run_id}
      name: workspace
      mount_path: /workspace
    run: |
      set -eu
      git config --global --add safe.directory /workspace
      cd /workspace
      # Files changed by this PUSH. The base is refs/ci/before when checkout managed to
      # resolve it (the SHA the ref pointed at before the push), else HEAD~1.
      #
      # The distinction is the whole point: HEAD~1 is the base of the last COMMIT, so a
      # push of n commits was read as a push of one and everything the other n-1 touched
      # was skipped — while the run still went green. Preferring the push base is what
      # makes "changed" mean changed-by-this-push.
      #
      # HAVE_BASE still distinguishes the two empty-CHANGED cases that must behave
      # OPPOSITELY: no base at all (first commit, or a shallow clone without a parent)
      # means we cannot tell what changed, so rebuild everything; a real base with an
      # empty diff (an empty "trigger" commit that touched no files) means genuinely
      # nothing changed, so build nothing.
      BASE=""
      if git rev-parse --verify -q refs/ci/created >/dev/null 2>&1; then
        # checkout saw a branch creation: there is no base to diff against and every
        # file is new, so build every service rather than diffing HEAD~1.
        echo '=== diff base: none (branch creation) — rebuilding everything ==='
      elif git rev-parse --verify -q refs/ci/before >/dev/null 2>&1; then
        BASE=refs/ci/before
        echo "=== diff base: push base $(git rev-parse --short refs/ci/before) ==="
      elif git rev-parse --verify -q HEAD~1 >/dev/null 2>&1; then
        BASE=HEAD~1
        echo '=== diff base: HEAD~1 (last commit only — push base unavailable) ==='
      else
        echo '=== diff base: none — rebuilding everything ==='
      fi
      if [ -n "$BASE" ]; then
        HAVE_BASE=1
        CHANGED=$(git diff --name-only "$BASE" HEAD)
      else
        HAVE_BASE=0
        CHANGED=""
      fi
      cd /workspace/src
      changed_dir() {
        [ "$HAVE_BASE" = 0 ] && return 0       # no base: cannot tell → rebuild everything
        [ -z "$CHANGED" ] && return 1          # base + empty diff: nothing changed → build nothing
        printf '%s\n' "$CHANGED" | grep -q "^src/$1/"
      }
      # MODULES: changed go modules only (like IMAGES) — test just what this push touched.
      MODULES=""
      for f in systems/*/go.mod cli/go.mod; do [ -f "$f" ] || continue; d=${f%/go.mod}; if changed_dir "$d"; then MODULES="$MODULES $d"; fi; done
      MODULES="${MODULES# }"
      # IMAGES: services whose Dockerfile builds from their OWN dir AND whose sources this
      # push touched. portal-bff is excluded — its Dockerfile also COPYs portal/, so it needs
      # the parent context and gets its own step (gated by PORTAL below).
      IMAGES=""
      for f in systems/*/Dockerfile; do
        [ -f "$f" ] || continue
        d=${f%/Dockerfile}; svc=${d#systems/}
        [ "$svc" = "portal-bff" ] && continue
        if changed_dir "systems/$svc"; then IMAGES="$IMAGES $svc"; fi
      done
      IMAGES="${IMAGES# }"
      # EXTRAS: changed go modules that are NOT a buildable service image (cli, portal-bff,
      # any lib) — tested but not image-built. The per-service map (test+build over IMAGES)
      # and the per-extra map (test-only over EXTRAS) together cover every changed module
      # exactly once.
      EXTRAS=""
      for m in $MODULES; do svc=${m#systems/}; case " $IMAGES " in *" $svc "*) continue ;; esac; EXTRAS="$EXTRAS $m"; done
      EXTRAS="${EXTRAS# }"
      # PORTAL rebuilds when either the SPA (portal/) or its BFF (portal-bff/) changed.
      PORTAL=""
      if changed_dir systems/portal || changed_dir systems/portal-bff; then PORTAL="1"; fi
      echo "modules: $MODULES"
      echo "changed: $(printf '%s' "$CHANGED" | tr '\n' ' ')"
      echo "images:  $IMAGES"
      echo "extras:  $EXTRAS"
      echo "portal:  $PORTAL"
- action: forge/run
  name: test
  map_id: per-service
  # 1800, not 2400. No single step here exceeds the 3600s run cap, but `test` and
  # `image` run SEQUENTIALLY within the per-service map region, so at their old
  # 2400+2400 that chain alone budgeted 4800s against a 3600s cap: the run could be
  # killed mid-image with every individual step still nominally within its own
  # timeout, which is a confusing way to fail. 1800+1200 keeps the pair under the cap.
  # These are backstops against a hung step, not target durations — a warm-cache test
  # step is seconds and the image build is ~90s, so the headroom is still large.
  timeout: 1800
  with:
    image: golang:1.25
    runner_class: ci
    timeout: 1800
    env:
      GOCACHE: /gocache/build
      GOFLAGS: -p=2
      GOMODCACHE: /gocache/mod
    volumes:
    - workflow_id: codearmory-ci-gocache
      name: gocache
      mount_path: /gocache
    run: |
      set -eu
      cd "/workspace/src/systems/${map.svc}"
      echo "=== test ${map.svc} ==="
      go test ./...
      # Build the release binary in the SAME pod, on the warm build cache `go test` just
      # populated — nearly free (every dependency is already compiled). It lands in the
      # workspace shard so the image step (which the map runs sequentially after this one,
      # on the same shard) only COPYs it — kaniko never recompiles Go. A map region clones
      # the workspace into ONE RWO shard per iteration, shared by the region's steps in
      # sequence; a separate concurrent build step would multi-attach that shard and fail.
      echo "=== build ${map.svc} ==="
      CGO_ENABLED=0 go build -o "${map.svc}" .
- action: forge/run
  name: test-extra
  map_id: per-extra
  timeout: 2400
  with:
    image: golang:1.25
    runner_class: ci
    timeout: 2400
    env:
      GOCACHE: /gocache/build
      GOFLAGS: -p=2
      GOMODCACHE: /gocache/mod
    volumes:
    - workflow_id: codearmory-ci-gocache
      name: gocache
      mount_path: /gocache
    run: |
      set -eu
      cd "/workspace/src/${map.module}"
      echo "=== test ${map.module} ==="
      go test ./...
- action: forge/run
  name: test-portal
  timeout: 1200
  with:
    image: node:22-alpine
    runner_class: large
    timeout: 1200
    env:
      # Point npm's package cache at the persistent volume, so `npm ci` resolves its
      # ~254 packages from disk instead of re-fetching the lot on every run.
      npm_config_cache: /npmcache
    volumes:
    - workflow_id: ${run_id}
      name: workspace
      mount_path: /workspace
    - workflow_id: codearmory-ci-npmcache
      name: npmcache
      mount_path: /npmcache
    run: |
      set -eu
      cd /workspace/src/systems/portal
      npm ci
      npm test
      # Build the SPA in the SAME pod, on the node_modules `npm ci` just installed —
      # nearly free. dist/ lands in the workspace, so the image step only COPYs it and
      # kaniko never runs npm. This is what stops the portal's npm install happening
      # twice per pipeline.
      echo "=== build portal SPA ==="
      npm run build
- action: forge/run
  name: build-portal-bff
  timeout: 1200
  with:
    image: golang:1.25
    runner_class: ci
    timeout: 1200
    env:
      GOCACHE: /gocache/build
      GOFLAGS: -p=2
      GOMODCACHE: /gocache/mod
    volumes:
    - workflow_id: ${run_id}
      name: workspace
      mount_path: /workspace
    - workflow_id: codearmory-ci-gocache
      name: gocache
      mount_path: /gocache
    # Its own step rather than folding into test-portal, which runs a node image with no
    # Go toolchain. Sequenced after test-portal (not parallel with it) because both mount
    # the run's workspace volume, which is RWO.
    #
    # portal-bff is a go.work member here, so an ordinary build works — the GOWORK=off in
    # ./Dockerfile is only needed there, where the module is copied out of the workspace.
    run: |
      set -eu
      cd /workspace/src/systems/portal-bff
      echo "=== build portal-bff ==="
      CGO_ENABLED=0 go build -o portal-bff .
- action: forge/build-image
  name: image
  map_id: per-service
  # 1200: the second half of the per-service chain budget described on `test` above.
  # A COPY-only kaniko build is ~90s; the one time it took 27 minutes it was crawling
  # on a full disk and produced nothing useful, so capping here converts "run dies at
  # the cap with a confusing error" into "this step timed out", and the prune-images
  # step still runs on that failure edge to try to fix the cause.
  timeout: 1200
  with:
    runner_class: xlarge
    timeout: 1200
    secret_refs:
      REGISTRY_AUTH: secret:forgejo-registry-auth
    build:
      context: /workspace/src/systems/${map.svc}
      # COPY-only image over the binary the `test` step built into this same workspace
      # shard — see Dockerfile.ci. kaniko never compiles Go. The self-contained multi-stage
      # ./Dockerfile stays for local `docker build`.
      dockerfile: Dockerfile.ci
      destinations:
      - 192.168.53.171:3000/jp01/${map.svc}:${steps.commit.output.SHA}
      no_push: false
- action: forge/build-image
  name: image-portal
  timeout: 2400
  with:
    runner_class: xlarge
    timeout: 2400
    secret_refs:
      REGISTRY_AUTH: secret:forgejo-registry-auth
    volumes:
    - workflow_id: ${run_id}
      name: workspace
      mount_path: /workspace
    build:
      context: /workspace/src/systems
      # COPY-only image over the SPA dist and portal-bff binary the two steps above
      # built into this workspace — see portal-bff/Dockerfile.ci. The self-contained
      # multi-stage ./Dockerfile stays for local `docker build`.
      dockerfile: portal-bff/Dockerfile.ci
      destinations:
      - 192.168.53.171:3000/jp01/portal:${steps.commit.output.SHA}
      no_push: false
- action: outpost-gateway/enqueueCommand
  name: redeploy-portal
  timeout: 120
  with:
    id: b38de6c5-6393-4dd2-aa93-b1ec5cf1bb86
    integration: deploy
    type: set-image
    payload:
      deployment: ca-codearmory-portal
      image: 192.168.53.171:3000/jp01/portal:${steps.commit.output.SHA}
      ignore_missing: true
- action: tickets/comment
  name: track-tested
  timeout: 60
  with:
    id: ${steps.open-ticket.output.ticket_id}
    body: ✅ **build + unit tests** passed for all modules.
- action: tickets/comment
  name: track-images
  timeout: 60
  with:
    id: ${steps.open-ticket.output.ticket_id}
    body: '✅ **images** built and pushed to Forgejo: `192.168.53.171:3000/jp01/<svc>:${steps.commit.output.SHA}` (changed services only).'
- action: outpost-gateway/enqueueCommand
  name: redeploy
  timeout: 120
  with:
    id: b38de6c5-6393-4dd2-aa93-b1ec5cf1bb86
    integration: deploy
    type: set-image
    payload:
      deployment: ca-codearmory-${matrix.svc}
      image: 192.168.53.171:3000/jp01/${matrix.svc}:${steps.commit.output.SHA}
      ignore_missing: true
  matrix:
    var: svc
    values_from: ${steps.discover.output.IMAGES}
    max_concurrent: 2
    # A commit that changed no buildable service yields an empty IMAGES; redeploy
    # nothing rather than failing the run (mirrors the build maps' allow_empty).
    allow_empty: true
- action: forge/run
  name: prune-images
  timeout: 600
  with:
    image: golang:1.25
    runner_class: standard
    timeout: 600
    secret_refs:
      # The same docker config.json kaniko pushes with — its credentials also
      # authenticate the Forgejo packages API, so pruning needs no second secret.
      REGISTRY_AUTH: secret:forgejo-registry-auth
    volumes:
    - workflow_id: ${run_id}
      name: workspace
      mount_path: /workspace
    # Runs AFTER redeploy so a tag can never be reclaimed before the rollout that
    # uses it, and the SHA just deployed is protected explicitly on top of that.
    # It ALSO runs when the build or the tests failed, and when there was nothing to
    # build at all (see the unconditional discover edge in routes): a run that died
    # because the disk was full is exactly the run whose housekeeping must not be
    # skipped, or the pipeline never recovers on its own — the next run hits the same
    # full disk and dies the same way.
    # Housekeeping must not turn a green pipeline red: the tool exits 0 on API
    # failure unless -strict.
    #
    # keep 5, not 10: ~16 images x 10 tags is the ~190-image, ~52GB state that filled
    # the disk in the first place. max-age trims further, down to a floor of 2, so a
    # service that stopped being rebuilt does not sit on a full keep-window of stale
    # images for good. The floor is what guarantees the tag its running deployment
    # references survives however long it goes without a rebuild.
    #
    # -disk reports the space it can measure and, above the threshold, lists what it
    # canNOT reclaim from inside a sandbox. / is the node filesystem; /workspace is
    # the hostpath PVC backing this run's volume.
    run: |
      set -eu
      cd /workspace
      go run ./infra/ci -apply -keep 5 -keep-min 2 -max-age 168h \
        -keep-tags "$PROTECTED_TAGS" -disk /,/workspace -disk-warn-pct 85
    env:
      PROTECTED_TAGS: ${steps.commit.output.SHA}
- action: outpost-gateway/enqueueCommand
  name: integration-tests
  timeout: 900
  with:
    id: b38de6c5-6393-4dd2-aa93-b1ec5cf1bb86
    integration: test
    type: run
    payload:
      image: 192.168.53.171:3000/jp01/ci-e2e:latest
      timeout_secs: 600
- action: tickets/update
  name: close-ticket
  timeout: 60
  with:
    id: ${steps.open-ticket.output.ticket_id}
    status: resolved
- action: tickets/update
  name: fail-ticket
  timeout: 60
  with:
    id: ${steps.open-ticket.output.ticket_id}
    status: open
maps:
- id: per-service
  var: svc
  values_from: ${steps.discover.output.IMAGES}
  # allow_empty: a push that touches no buildable service yields an empty IMAGES; the
  # mapped test/image steps must then skip cleanly rather than error.
  allow_empty: true
  volume: workspace
  mount_path: /workspace
  size_mb: 512
  medium: disk
  max_concurrent: 4
- id: per-extra
  var: module
  values_from: ${steps.discover.output.EXTRAS}
  allow_empty: true
  volume: workspace
  mount_path: /workspace
  size_mb: 512
  medium: disk
  max_concurrent: 4
routes:
- from: workspace
  to: checkout
- from: gitcache
  to: checkout
- from: gocache
  to: warm-cache
# Ordered against checkout, NOT test-portal. Readiness is allResolved && anyTaken, so
# an unconditional edge into test-portal would satisfy anyTaken by itself and defeat
# the PORTAL=="1" gate — running npm on every commit. checkout is unconditional and
# runs long before the portal steps, so the volume is provisioned in time regardless.
- from: npmcache
  to: checkout
- from: checkout
  to: commit
- from: commit
  to: open-ticket
- from: checkout
  to: warm-cache
- from: warm-cache
  to: discover
- from: open-ticket
  to: discover
- from: discover
  to: test
- from: test
  to: image
- from: test
  to: track-tested
- from: discover
  to: test-extra
- from: test-extra
  to: fail-ticket
  when: steps["test-extra"].status == 'failed'
- from: image
  to: track-images
- from: discover
  to: fail-ticket
  when: steps.discover.status == 'failed'
- from: test
  to: fail-ticket
  when: steps.test.status == 'failed'
- from: image
  to: fail-ticket
  when: steps.image.status == 'failed'
- from: image-portal
  to: fail-ticket
  when: steps["image-portal"].status == 'failed'
- from: discover
  to: test-portal
  when: steps.discover.json.PORTAL == "1"
- from: test-portal
  to: build-portal-bff
- from: build-portal-bff
  to: image-portal
- from: test-portal
  to: fail-ticket
  when: steps["test-portal"].status == 'failed'
- from: build-portal-bff
  to: fail-ticket
  when: steps["build-portal-bff"].status == 'failed'
- from: image
  to: redeploy
- from: image-portal
  to: redeploy-portal
- from: redeploy
  to: integration-tests
# Pruning hangs off redeploy in parallel with the integration tests rather than in
# front of them: it must not delay the run's verdict, but the run still waits for it
# (the scheduler joins every in-flight node before finishing).
- from: redeploy
  to: prune-images
# The second edge is what makes housekeeping actually happen. With only the redeploy
# edge above, prune ran on the happy path and NOWHERE else: a build-push that timed
# out under disk pressure skipped it entirely (test/image/redeploy all skipped or
# failed, so nothing was taken), which meant the run that most needed disk reclaimed
# was the one run that reclaimed none — and the next run met the same full disk and
# died identically. The failure compounded, because past a certain point even
# `crictl rmi --prune` on the node fails with DeadlineExceeded: the deletions
# themselves need free space. Reclaiming has to be unconditional to be self-healing.
# It also covers the empty-IMAGES case (a docs-only push), where every downstream
# node is skipped but old tags are still sitting there.
#
# The two edges do different jobs and both are needed. Readiness is
# ALL-INBOUND-RESOLVED + AT-LEAST-ONE-TAKEN: the discover edge supplies "taken" in
# every case, while the redeploy edge supplies the ORDERING — prune cannot start
# until redeploy has resolved one way or another, so a tag is still never reclaimed
# before the rollout that uses it. The step runs exactly once regardless.
- from: discover
  to: prune-images
- from: integration-tests
  to: close-ticket
- from: integration-tests
  to: fail-ticket
  when: steps["integration-tests"].status == 'failed'
