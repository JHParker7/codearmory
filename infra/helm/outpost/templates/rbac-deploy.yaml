{{- if and (eq (include "outpost.hasModule" (list . "deploy")) "true") .Values.deploy.rbac }}
{{- $full := include "outpost.fullname" . -}}
{{- /* The deploy module redeploys workloads: get/patch Deployments. Scoped to a
       namespaced Role per target namespace — least privilege, unlike a ClusterRole —
       so the outpost can only touch the namespaces it is meant to. */ -}}
{{- range .Values.deploy.targetNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-deploy
  namespace: {{ . }}
  labels:
    {{- include "outpost.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # get for the single-container lookup; patch to roll/set-image; list/watch for a
    # future rollout-status watch. No create/delete — this only redeploys what exists.
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-deploy
  namespace: {{ . }}
  labels:
    {{- include "outpost.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-deploy
subjects:
  - kind: ServiceAccount
    name: {{ include "outpost.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
