apiVersion: v2
name: codearmory
description: Helm chart for the CodeArmory platform core services (gatekeeper, registry, conductor, builder, portal, and the forge + workflows CI/CD pair). Non-core services are deployed at runtime by builder.
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: postgresql
    version: ">=15.5.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
