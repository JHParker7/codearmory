{{- if not .Values.global.externalSecrets }}
{{- if .Values.gitFactory.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-git-factory" $fullName) -}}
{{- /* gatekeeper-service-key: bootstrap arg "git_factory" must match the identity
       gatekeeper-secret seeds into GATEKEEPER_SERVICES (codearmory_git_factory=...). */ -}}
{{- $gkKey := .Values.gitFactory.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "git_factory") -}}
  {{- end -}}
{{- end -}}
{{- /* hooks-trigger-key is the shared HMAC signing git_factory's push events to hooks
       (POST /internal/events). It MUST equal the key hooks/workflows/events use, so it
       follows the SAME lookup chain workflows-secret.yaml and events-secret.yaml use and
       ends at the SAME bootstrapServiceKey "hooks-trigger" fallback — a "git-factory-trigger"
       seed would be a different value and every push-triggered pipeline would 401. An
       already-deployed hooks or workflows secret wins over this secret's own key so an
       upgrade adopts the value hooks verifies with instead of keeping a stale one. */ -}}
{{- $triggerKey := .Values.gitFactory.secret.hooksTriggerKey -}}
{{- if not $triggerKey -}}
  {{- $hooksSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-hooks" $fullName) -}}
  {{- $workflowsSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-workflows" $fullName) -}}
  {{- if and $hooksSecret (index $hooksSecret.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $hooksSecret.data "hooks-trigger-key" | b64dec -}}
  {{- else if and $workflowsSecret (index $workflowsSecret.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $workflowsSecret.data "hooks-trigger-key" | b64dec -}}
  {{- else if and $existing (index $existing.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $existing.data "hooks-trigger-key" | b64dec -}}
  {{- else -}}
    {{- $triggerKey = include "codearmory.bootstrapServiceKey" (list $ "hooks-trigger") -}}
  {{- end -}}
{{- end -}}
{{- /* git-factory-internal-key: shared secret on the X-Internal-Key header that
       authenticates git_connector → git_factory /internal/mirrors and
       /internal/clone-token. This secret is the canonical owner; git-secret derives the
       same key (bootstrap arg "git-factory-internal"), looking this one up first so both
       sides agree. An unset key does NOT open the surface — git_factory rejects every
       internal call when it is empty. */ -}}
{{- $internalKey := .Values.gitFactory.secret.gitFactoryInternalKey -}}
{{- if not $internalKey -}}
  {{- if and $existing (index $existing.data "git-factory-internal-key") -}}
    {{- $internalKey = index $existing.data "git-factory-internal-key" | b64dec -}}
  {{- else -}}
    {{- $internalKey = include "codearmory.bootstrapServiceKey" (list $ "git-factory-internal") -}}
  {{- end -}}
{{- end -}}
{{- /* git-factory-clone-token-key: HMAC key for the short-lived read-only clone tokens
       git_factory mints for runners. Deliberately DISTINCT from the internal key above so
       the credential a runner carries is never the key that authorises minting. Nothing
       else needs it — only git_factory signs and verifies these tokens — so it is not
       cross-synced anywhere. Empty would leave every token rejected, so it is always
       emitted; it is preserved across upgrades so tokens minted before an upgrade stay
       valid for their remaining TTL. */ -}}
{{- $cloneTokenKey := .Values.gitFactory.secret.cloneTokenKey -}}
{{- if not $cloneTokenKey -}}
  {{- if and $existing (index $existing.data "git-factory-clone-token-key") -}}
    {{- $cloneTokenKey = index $existing.data "git-factory-clone-token-key" | b64dec -}}
  {{- else -}}
    {{- $cloneTokenKey = include "codearmory.bootstrapServiceKey" (list $ "git-factory-clone-token") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-git-factory
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: git-factory
type: Opaque
stringData:
{{- if .Values.gitFactory.secret.databaseUrl }}
  database-url: {{ .Values.gitFactory.secret.databaseUrl | quote }}
{{- end }}
{{- if .Values.gitFactory.secret.databaseReadUrl }}
  database-read-url: {{ .Values.gitFactory.secret.databaseReadUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  hooks-trigger-key: {{ $triggerKey | quote }}
  git-factory-internal-key: {{ $internalKey | quote }}
  git-factory-clone-token-key: {{ $cloneTokenKey | quote }}
{{- end }}
{{- end }}
