{{- if not .Values.global.externalSecrets }}
{{- if .Values.containers.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-containers" $fullName) -}}
{{- $gkKey := .Values.containers.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "containers") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-containers
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: containers
type: Opaque
stringData:
{{- if .Values.containers.secret.databaseUrl }}
  database-url: {{ .Values.containers.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
{{- if .Values.containers.secret.registryPassword }}
  registry-password: {{ .Values.containers.secret.registryPassword | quote }}
{{- end }}
{{- end }}
{{- end }}
