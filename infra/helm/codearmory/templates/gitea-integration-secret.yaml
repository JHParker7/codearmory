{{- if .Values.giteaIntegration.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-gitea-integration" $fullName) -}}
{{- $gkKey := .Values.giteaIntegration.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-gitea-integration
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea-integration
type: Opaque
stringData:
{{- if .Values.giteaIntegration.secret.databaseUrl }}
  database-url: {{ .Values.giteaIntegration.secret.databaseUrl | quote }}
{{- end }}
  gitea-url: {{ .Values.giteaIntegration.secret.giteaUrl | quote }}
  gitea-admin-token: {{ .Values.giteaIntegration.secret.giteaAdminToken | quote }}
  gatekeeper-service-key: {{ $gkKey | quote }}
{{- end }}
