{{- if not .Values.global.externalSecrets }}
{{- if .Values.giteaIntegration.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-gitea-integration" $fullName) -}}
{{- /* gatekeeper-service-key: bootstrap arg "gitea_integration" must match the identity
       gatekeeper-secret seeds into GATEKEEPER_SERVICES (the registry name, with underscore). */ -}}
{{- $gkKey := .Values.giteaIntegration.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "gitea_integration") -}}
  {{- end -}}
{{- end -}}
{{- /* gitea-internal-key: shared HMAC secret authenticating forge → gitea_integration
       /internal/clone-token calls. forge-secret derives the same key (bootstrap arg
       "gitea-internal"), looking this secret up first so both sides agree. */ -}}
{{- $internalKey := .Values.giteaIntegration.secret.giteaInternalKey -}}
{{- if not $internalKey -}}
  {{- if and $existing (index $existing.data "gitea-internal-key") -}}
    {{- $internalKey = index $existing.data "gitea-internal-key" | b64dec -}}
  {{- else -}}
    {{- $internalKey = include "codearmory.bootstrapServiceKey" (list $ "gitea-internal") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-gitea-integration
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea-integration
type: Opaque
stringData:
{{- if .Values.giteaIntegration.secret.databaseUrl }}
  database-url: {{ .Values.giteaIntegration.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  gitea-internal-key: {{ $internalKey | quote }}
{{- if .Values.giteaIntegration.secret.giteaAdminToken }}
  gitea-admin-token: {{ .Values.giteaIntegration.secret.giteaAdminToken | quote }}
{{- end }}
{{- end }}
{{- end }}
