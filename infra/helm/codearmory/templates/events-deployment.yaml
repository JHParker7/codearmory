{{- if .Values.events.enabled }}
{{- $fullname := include "codearmory.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-events
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: events
spec:
  replicas: {{ .Values.events.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: events
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: events
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: events
          image: "{{ include "codearmory.image" (list . .Values.events) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.events.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.events.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.events.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ $fullname }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            # Where events dispatches a matched rule's run. It signs the call with
            # events-trigger-key, which the workflows service verifies.
            - name: WORKFLOWS_URL
              value: "http://{{ $fullname }}-workflows:{{ .Values.workflows.port }}"
            {{- include "codearmory.otel.envs" (list . .Values.events.env) | nindent 12 }}
            {{- include "codearmory.postgresql.env" (list . "events" "events" $fullname) | nindent 12 }}
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-events
                  key: gatekeeper-service-key
            - name: EVENTS_TRIGGER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-events
                  key: events-trigger-key
            {{- include "codearmory.tls.envs" .Values.events.tls | nindent 12 }}
          {{- with (include "codearmory.tls.volumeMounts" .Values.events.tls) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.events.resources | nindent 12 }}
      {{- with (include "codearmory.tls.volumes" .Values.events.tls) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
