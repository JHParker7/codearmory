{{- if and .Values.containers.enabled .Values.containers.deploy }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codearmory.fullname" . }}-containers
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: containers
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.containers.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "codearmory.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: containers
{{- end }}
