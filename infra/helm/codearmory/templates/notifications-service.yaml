{{- if .Values.notifications.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codearmory.fullname" . }}-notifications
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifications
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.notifications.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "codearmory.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: notifications
{{- end }}
