{{- if not .Values.global.externalSecrets }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $redisUrl := coalesce .Values.gatekeeper.secret.redisUrl (ternary (printf "redis://%s-gatekeeper-redis:6379/0" $fullName) "" .Values.gatekeeper.redis.enabled) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-gatekeeper" $fullName) -}}
{{- $registryKey := .Values.gatekeeper.secret.registryServiceKey -}}
{{- if not $registryKey -}}
  {{- if and $existing (index $existing.data "registry-service-key") -}}
    {{- $registryKey = index $existing.data "registry-service-key" | b64dec -}}
  {{- else -}}
    {{- $registryKey = include "codearmory.bootstrapServiceKey" (list $ "gatekeeper") -}}
  {{- end -}}
{{- end -}}
{{- /* Assemble gatekeeper-services from each enabled service's secret.
       On upgrade the service Secrets exist and their keys are read directly.
       On first install no Secrets exist yet — each service uses
       codearmory.bootstrapServiceKey, a deterministic sha256sum of the release
       name, namespace, and service name. The same helper is used in each
       service's own Secret template, so both sides always agree on first install
       without requiring a second helm upgrade to sync. */ -}}
{{- $gkServices := .Values.gatekeeper.secret.gatekeeperServices -}}
{{- if not $gkServices -}}
  {{- $parts := list -}}
  {{- if .Values.blueprints.enabled -}}
    {{- $svc := lookup "v1" "Secret" .Release.Namespace (printf "%s-blueprints" $fullName) -}}
    {{- $k := "" -}}
    {{- if and $svc (index $svc.data "gatekeeper-service-key") -}}
      {{- $k = index $svc.data "gatekeeper-service-key" | b64dec -}}
    {{- else -}}
      {{- $k = include "codearmory.bootstrapServiceKey" (list $ "blueprints") -}}
    {{- end -}}
    {{- $parts = append $parts (printf "blueprints=%s" $k) -}}
  {{- end -}}
  {{- if .Values.forge.enabled -}}
    {{- $svc := lookup "v1" "Secret" .Release.Namespace (printf "%s-forge" $fullName) -}}
    {{- $k := "" -}}
    {{- if and $svc (index $svc.data "gatekeeper-service-key") -}}
      {{- $k = index $svc.data "gatekeeper-service-key" | b64dec -}}
    {{- else -}}
      {{- $k = include "codearmory.bootstrapServiceKey" (list $ "forge") -}}
    {{- end -}}
    {{- $parts = append $parts (printf "forge=%s" $k) -}}
  {{- end -}}
  {{- if .Values.workflows.enabled -}}
    {{- $svc := lookup "v1" "Secret" .Release.Namespace (printf "%s-workflows" $fullName) -}}
    {{- $k := "" -}}
    {{- if and $svc (index $svc.data "gatekeeper-service-key") -}}
      {{- $k = index $svc.data "gatekeeper-service-key" | b64dec -}}
    {{- else -}}
      {{- $k = include "codearmory.bootstrapServiceKey" (list $ "workflows") -}}
    {{- end -}}
    {{- $parts = append $parts (printf "workflows=%s" $k) -}}
  {{- end -}}
  {{- if .Values.tickets.enabled -}}
    {{- $svc := lookup "v1" "Secret" .Release.Namespace (printf "%s-tickets" $fullName) -}}
    {{- $k := "" -}}
    {{- if and $svc (index $svc.data "gatekeeper-service-key") -}}
      {{- $k = index $svc.data "gatekeeper-service-key" | b64dec -}}
    {{- else -}}
      {{- $k = include "codearmory.bootstrapServiceKey" (list $ "tickets") -}}
    {{- end -}}
    {{- $parts = append $parts (printf "tickets=%s" $k) -}}
  {{- end -}}
  {{- if .Values.hooks.enabled -}}
    {{- $svc := lookup "v1" "Secret" .Release.Namespace (printf "%s-hooks" $fullName) -}}
    {{- $k := "" -}}
    {{- if and $svc (index $svc.data "gatekeeper-service-key") -}}
      {{- $k = index $svc.data "gatekeeper-service-key" | b64dec -}}
    {{- else -}}
      {{- $k = include "codearmory.bootstrapServiceKey" (list $ "hooks") -}}
    {{- end -}}
    {{- $parts = append $parts (printf "hooks=%s" $k) -}}
  {{- end -}}
  {{- if .Values.containers.enabled -}}
    {{- $svc := lookup "v1" "Secret" .Release.Namespace (printf "%s-containers" $fullName) -}}
    {{- $k := "" -}}
    {{- if and $svc (index $svc.data "gatekeeper-service-key") -}}
      {{- $k = index $svc.data "gatekeeper-service-key" | b64dec -}}
    {{- else -}}
      {{- $k = include "codearmory.bootstrapServiceKey" (list $ "containers") -}}
    {{- end -}}
    {{- $parts = append $parts (printf "containers=%s" $k) -}}
  {{- end -}}
  {{- if .Values.outpostGateway.enabled -}}
    {{- $svc := lookup "v1" "Secret" .Release.Namespace (printf "%s-outpost-gateway" $fullName) -}}
    {{- $k := "" -}}
    {{- if and $svc (index $svc.data "gatekeeper-service-key") -}}
      {{- $k = index $svc.data "gatekeeper-service-key" | b64dec -}}
    {{- else -}}
      {{- $k = include "codearmory.bootstrapServiceKey" (list $ "outpost-gateway") -}}
    {{- end -}}
    {{- $parts = append $parts (printf "outpost-gateway=%s" $k) -}}
  {{- end -}}
  {{- if .Values.chaos.enabled -}}
    {{- $svc := lookup "v1" "Secret" .Release.Namespace (printf "%s-chaos" $fullName) -}}
    {{- $k := "" -}}
    {{- if and $svc (index $svc.data "gatekeeper-service-key") -}}
      {{- $k = index $svc.data "gatekeeper-service-key" | b64dec -}}
    {{- else -}}
      {{- $k = include "codearmory.bootstrapServiceKey" (list $ "chaos") -}}
    {{- end -}}
    {{- $parts = append $parts (printf "chaos=%s" $k) -}}
  {{- end -}}
  {{- if .Values.argo.enabled -}}
    {{- $svc := lookup "v1" "Secret" .Release.Namespace (printf "%s-argo" $fullName) -}}
    {{- $k := "" -}}
    {{- if and $svc (index $svc.data "gatekeeper-service-key") -}}
      {{- $k = index $svc.data "gatekeeper-service-key" | b64dec -}}
    {{- else -}}
      {{- $k = include "codearmory.bootstrapServiceKey" (list $ "argo") -}}
    {{- end -}}
    {{- $parts = append $parts (printf "argo=%s" $k) -}}
  {{- end -}}
  {{- $svc := lookup "v1" "Secret" .Release.Namespace (printf "%s-registry" $fullName) -}}
  {{- $k := "" -}}
  {{- if and $svc (index $svc.data "gatekeeper-service-key") -}}
    {{- $k = index $svc.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $k = include "codearmory.bootstrapServiceKey" (list $ "registry") -}}
  {{- end -}}
  {{- $parts = append $parts (printf "registry=%s" $k) -}}
  {{- if .Values.giteaIntegration.enabled -}}
    {{- $svc := lookup "v1" "Secret" .Release.Namespace (printf "%s-gitea-integration" $fullName) -}}
    {{- $k := "" -}}
    {{- if and $svc (index $svc.data "gatekeeper-service-key") -}}
      {{- $k = index $svc.data "gatekeeper-service-key" | b64dec -}}
    {{- else -}}
      {{- $k = include "codearmory.bootstrapServiceKey" (list $ "gitea_integration") -}}
    {{- end -}}
    {{- $parts = append $parts (printf "gitea_integration=%s" $k) -}}
  {{- end -}}
  {{- $gkServices = join "," $parts -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-gatekeeper
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gatekeeper
type: Opaque
stringData:
{{- if .Values.gatekeeper.secret.databaseUrl }}
  database-url: {{ .Values.gatekeeper.secret.databaseUrl | quote }}
{{- end }}
  redis-url: {{ $redisUrl | quote }}
  gatekeeper-services: {{ $gkServices | quote }}
  registry-service-key: {{ $registryKey | quote }}
  secrets-lookup-allowed-callers: {{ .Values.gatekeeper.secret.secretsLookupAllowedCallers | default "containers" | quote }}
{{- if .Values.gatekeeper.secret.secretsKey }}
  gatekeeper-secrets-key: {{ .Values.gatekeeper.secret.secretsKey | quote }}
{{- end }}
{{- if .Values.gatekeeper.secret.oidcSigningKey }}
  oidc-signing-key: {{ .Values.gatekeeper.secret.oidcSigningKey | quote }}
{{- end }}
{{- end }}
