{{- if and .Values.gitFactory.enabled .Values.gitFactory.ingress.enabled }}
{{- /*
Every other core service is reached only through conductor, so the chart gives it no
Ingress. git_factory is the exception: a git client talks to the git plane DIRECTLY over
Smart-HTTP (/{ns}/{repo}.git/info/refs and friends), which is not a JSON API conductor can
front. So the wire routes need their own way in from outside the cluster, and this is it.

The backend is the Service this chart creates in git-factory-service.yaml —
<fullname>-git-factory, the usual chart naming. (It used to point at a Service builder
created, back when git_factory was deployed at runtime by builder rather than by the
chart.) The annotations in values.yaml matter as much as the route: an ingress tuned for
JSON truncates clones and rejects pushes.
*/}}
{{- $fullname := include "codearmory.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "codearmory.fullname" . }}-git-factory
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: git-factory
  {{- with .Values.gitFactory.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.gitFactory.ingress.className }}
  ingressClassName: {{ .Values.gitFactory.ingress.className }}
  {{- end }}
  {{- with .Values.gitFactory.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.gitFactory.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullname }}-git-factory
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
