{{- if and .Values.notifications.enabled .Values.notifications.deploy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearmory.fullname" . }}-notifications
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifications
spec:
  replicas: {{ .Values.notifications.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: notifications
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: notifications
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: notifications
          image: "{{ include "codearmory.image" (list . .Values.notifications) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.notifications.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.notifications.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.notifications.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ include "codearmory.fullname" . }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            {{- include "codearmory.otel.envs" (list . .Values.notifications.env) | nindent 12 }}
            {{- include "codearmory.postgresql.env" (list . "notifications" "notifications" (include "codearmory.fullname" .)) | nindent 12 }}
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-notifications
                  key: gatekeeper-service-key
            {{- include "codearmory.tls.envs" .Values.notifications.tls | nindent 12 }}
          {{- with (include "codearmory.tls.volumeMounts" .Values.notifications.tls) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.notifications.resources | nindent 12 }}
      {{- with (include "codearmory.tls.volumes" .Values.notifications.tls) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
