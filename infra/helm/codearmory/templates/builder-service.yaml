{{- if .Values.builder.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codearmory.fullname" . }}-builder
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: builder
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.builder.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "codearmory.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: builder
{{- end }}
