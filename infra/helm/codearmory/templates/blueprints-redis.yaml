{{- if and .Values.blueprints.enabled .Values.blueprints.deploy .Values.blueprints.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearmory.fullname" . }}-blueprints-redis
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: blueprints-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: blueprints-redis
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: blueprints-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "{{ .Values.blueprints.redis.image.repository }}:{{ .Values.blueprints.redis.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["redis-server", "--save", "", "--appendonly", "no", "--dir", "/data"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.blueprints.redis.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.blueprints.redis.dataSizeLimit }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codearmory.fullname" . }}-blueprints-redis
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: blueprints-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: {{ include "codearmory.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: blueprints-redis
{{- end }}
