{{- if and .Values.argo.enabled .Values.argo.deploy }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codearmory.fullname" . }}-argo
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: argo
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.argo.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "codearmory.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: argo
{{- end }}
