{{- $fullname := include "codearmory.fullname" . -}}
{{- $manifest := .Files.Get "files/registry-manifest.json" -}}
{{- $manifest = replace "http://gatekeeper:"        (printf "http://%s-gatekeeper:" $fullname)        $manifest -}}
{{- $manifest = replace "http://blueprints:"        (printf "http://%s-blueprints:" $fullname)        $manifest -}}
{{- $manifest = replace "http://forge:"             (printf "http://%s-forge:" $fullname)             $manifest -}}
{{- $manifest = replace "http://workflows:"         (printf "http://%s-workflows:" $fullname)         $manifest -}}
{{- $manifest = replace "http://tickets:"           (printf "http://%s-tickets:" $fullname)           $manifest -}}
{{- $manifest = replace "http://notifications:"     (printf "http://%s-notifications:" $fullname)     $manifest -}}
{{- $manifest = replace "http://hooks:"             (printf "http://%s-hooks:" $fullname)             $manifest -}}
{{- $manifest = replace "http://gitea-integration:" (printf "http://%s-gitea-integration:" $fullname) $manifest -}}
{{- $manifest = replace "http://containers:"        (printf "http://%s-containers:" $fullname)        $manifest -}}
{{- $manifest = replace "http://outpost-gateway:"   (printf "http://%s-outpost-gateway:" $fullname)   $manifest -}}
{{- $manifest = replace "http://chaos:"             (printf "http://%s-chaos:" $fullname)             $manifest -}}
{{- $manifest = replace "http://argo:"              (printf "http://%s-argo:" $fullname)              $manifest -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-registry-manifest
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
data:
  manifest.json: |
{{ $manifest | indent 4 }}
