{{- $fullname := include "codearmory.fullname" . -}}
{{- $manifest := .Files.Get "files/registry-manifest.json" -}}
{{- /* The chart ships the CORE service manifest entries (gatekeeper, builder, the
       forge + workflows CI/CD pair, and the tickets + git + containers trio). Every
       non-core service registers its own routes/RBAC with the registry at runtime via
       builder, so their URLs are not substituted here. */ -}}
{{- $manifest = replace "http://gatekeeper:"        (printf "http://%s-gatekeeper:" $fullname)        $manifest -}}
{{- $manifest = replace "http://builder:"           (printf "http://%s-builder:" $fullname)           $manifest -}}
{{- if .Values.forge.enabled -}}
{{- $manifest = replace "http://forge:"             (printf "http://%s-forge:" $fullname)             $manifest -}}
{{- end -}}
{{- if .Values.workflows.enabled -}}
{{- $manifest = replace "http://workflows:"         (printf "http://%s-workflows:" $fullname)         $manifest -}}
{{- end -}}
{{- if .Values.tickets.enabled -}}
{{- $manifest = replace "http://tickets:"           (printf "http://%s-tickets:" $fullname)           $manifest -}}
{{- end -}}
{{- if .Values.events.enabled -}}
{{- $manifest = replace "http://events:"            (printf "http://%s-events:" $fullname)            $manifest -}}
{{- end -}}
{{- if .Values.outpostGateway.enabled -}}
{{- $manifest = replace "http://outpost-gateway:"    (printf "http://%s-outpost-gateway:" $fullname)    $manifest -}}
{{- end -}}
{{- if .Values.git.enabled -}}
{{- $manifest = replace "http://git:"               (printf "http://%s-git:" $fullname)               $manifest -}}
{{- end -}}
{{- if .Values.artifacts.enabled -}}
{{- $manifest = replace "http://artifacts:"         (printf "http://%s-artifacts:" $fullname)         $manifest -}}
{{- end -}}
{{- if .Values.containers.enabled -}}
{{- $manifest = replace "http://containers:"        (printf "http://%s-containers:" $fullname)        $manifest -}}
{{- end -}}
{{- /* git_factory: its compose hostname may be spelled either way (the registry name is
       codearmory_git_factory, the k8s Service is git-factory), so rewrite both — a missed
       spelling leaves conductor routing at a host that does not resolve in-cluster. Both
       replaces are no-ops when the manifest does not contain them. */ -}}
{{- if .Values.gitFactory.enabled -}}
{{- $manifest = replace "http://git-factory:"       (printf "http://%s-git-factory:" $fullname)       $manifest -}}
{{- $manifest = replace "http://git_factory:"       (printf "http://%s-git-factory:" $fullname)       $manifest -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-registry-manifest
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
data:
  manifest.json: |
{{ $manifest | indent 4 }}
