{{- if not .Values.global.externalSecrets }}
{{- if .Values.workflows.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-workflows" $fullName) -}}
{{- $gkKey := .Values.workflows.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "workflows") -}}
  {{- end -}}
{{- end -}}
{{- /* events-trigger-key authenticates the events service's internal pipeline dispatch and
       run polling. It MUST equal the events secret's key of the same name, so both derive it
       from the same bootstrapServiceKey "hooks-trigger" seed — the seed name is historical and
       must NOT be "renamed to match", since changing it would mint a different value on one
       side and 401 every event-triggered run. An already-deployed events (or pre-migration
       hooks) secret wins, so an upgrade adopts the value already in use. */ -}}
{{- $triggerKey := .Values.workflows.secret.eventsTriggerKey -}}
{{- if not $triggerKey -}}
  {{- $eventsSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-events" $fullName) -}}
  {{- $hooksSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-hooks" $fullName) -}}
  {{- if and $eventsSecret (index $eventsSecret.data "events-trigger-key") -}}
    {{- $triggerKey = index $eventsSecret.data "events-trigger-key" | b64dec -}}
  {{- else if and $hooksSecret (index $hooksSecret.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $hooksSecret.data "hooks-trigger-key" | b64dec -}}
  {{- else if and $existing (index $existing.data "events-trigger-key") -}}
    {{- $triggerKey = index $existing.data "events-trigger-key" | b64dec -}}
  {{- else if and $existing (index $existing.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $existing.data "hooks-trigger-key" | b64dec -}}
  {{- else -}}
    {{- $triggerKey = include "codearmory.bootstrapServiceKey" (list $ "hooks-trigger") -}}
  {{- end -}}
{{- end -}}
{{- $tokenKey := .Values.workflows.secret.tokenKey -}}
{{- if not $tokenKey -}}
  {{- if and $existing (index $existing.data "token-key") -}}
    {{- $tokenKey = index $existing.data "token-key" | b64dec -}}
  {{- else -}}
    {{- /* Must be HEX: workflows decodes this into a 32-byte AES key and exits if it
           is not 64 hex characters. randAlphaNum 32 produced 32 arbitrary alphanumerics,
           which never hex-decodes — so an install that did not set tokenKey explicitly
           generated a key the service always rejected, and workflows could not start at
           all. sha256sum of a random string is 64 hex characters by construction. */ -}}
    {{- $tokenKey = randAlphaNum 32 | sha256sum -}}
  {{- end -}}
{{- end -}}
{{- /* registry-service-key: workflows is a registry READ account, so it can poll
       GET /actions and GET /services to resolve pipeline step targets. Matches the
       workflows entry seeded in registry-secret's service-accounts. */ -}}
{{- $registryServiceKey := .Values.workflows.secret.registryServiceKey -}}
{{- if not $registryServiceKey -}}
  {{- if and $existing (index $existing.data "registry-service-key") -}}
    {{- $registryServiceKey = index $existing.data "registry-service-key" | b64dec -}}
  {{- else -}}
    {{- $registryServiceKey = include "codearmory.bootstrapServiceKey" (list $ "workflows-registry") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-workflows
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflows
type: Opaque
stringData:
{{- if .Values.workflows.secret.databaseUrl }}
  database-url: {{ .Values.workflows.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  events-trigger-key: {{ $triggerKey | quote }}
  token-key: {{ $tokenKey | quote }}
  registry-service-key: {{ $registryServiceKey | quote }}
{{- end }}
{{- end }}
