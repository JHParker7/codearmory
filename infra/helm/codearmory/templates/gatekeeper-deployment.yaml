apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearmory.fullname" . }}-gatekeeper
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gatekeeper
spec:
  replicas: {{ .Values.gatekeeper.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gatekeeper
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: gatekeeper
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gatekeeper
          image: "{{ .Values.gatekeeper.image.repository }}:{{ include "codearmory.imageTag" (list . .Values.gatekeeper) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.gatekeeper.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.gatekeeper.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.gatekeeper.env.logLevel | quote }}
            - name: PERMITTED_SERVICES
              value: {{ .Values.gatekeeper.env.permittedServices | quote }}
            {{- if .Values.gatekeeper.env.trustedProxyCIDRs }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.gatekeeper.env.trustedProxyCIDRs | quote }}
            {{- end }}
            {{- if .Values.gatekeeper.env.otelEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.gatekeeper.env.otelEndpoint | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-gatekeeper
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-gatekeeper
                  key: redis-url
            - name: GATEKEEPER_SERVICES
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-gatekeeper
                  key: gatekeeper-services
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gatekeeper.resources | nindent 12 }}
