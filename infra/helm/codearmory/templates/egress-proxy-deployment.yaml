{{- if and .Values.egressProxy.enabled .Values.egressProxy.deploy }}
{{- $fullname := include "codearmory.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-egress-proxy
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress-proxy
spec:
  replicas: {{ .Values.egressProxy.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: egress-proxy
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: egress-proxy
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: egress-proxy
          image: "{{ include "codearmory.image" (list . .Values.egressProxy) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: proxy
              containerPort: {{ .Values.egressProxy.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.egressProxy.port | quote }}
            - name: PROXY_ALLOWED_DOMAINS
              value: {{ .Values.egressProxy.env.allowedDomains | quote }}
            {{- include "codearmory.otel.envs" (list . .Values.egressProxy.env) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: proxy
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: proxy
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.egressProxy.resources | nindent 12 }}
{{- end }}
