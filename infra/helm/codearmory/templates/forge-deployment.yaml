{{- if .Values.forge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearmory.fullname" . }}-forge
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: forge
spec:
  replicas: {{ .Values.forge.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: forge
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: forge
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "codearmory.forge.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: forge
          image: "{{ include "codearmory.image" (list . .Values.forge) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.forge.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.forge.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.forge.env.logLevel | quote }}
            - name: RUNTIME
              {{- if and .Values.forge.kata.enabled .Values.forge.gvisor.enabled }}
              {{- fail "forge.kata.enabled and forge.gvisor.enabled are mutually exclusive — enable only one" }}
              {{- end }}
              {{- if .Values.forge.kata.enabled }}
              # kata: the Kubernetes runtime pinned to a VM-isolating RuntimeClass
              # (env.k8sRuntimeClass). Each sandbox Job runs in a Cloud Hypervisor microVM.
              value: "kata"
              {{- else if .Values.forge.gvisor.enabled }}
              # gvisor: the Kubernetes runtime pinned to a gVisor RuntimeClass
              # (env.k8sRuntimeClass). Each sandbox Job runs under the gVisor userspace
              # kernel (the Sentry) — no hardware virtualization (/dev/kvm) required.
              value: "gvisor"
              {{- else }}
              value: {{ .Values.forge.env.runtime | quote }}
              {{- end }}
            - name: ALLOWED_IMAGES
              value: {{ .Values.forge.env.allowedImages | quote }}
            {{- with .Values.forge.admission }}
            # Admission control: count caps per org/user plus cluster-wide CPU/memory
            # budgets that pace a large fan-out to what the cluster can actually run.
            # Each is emitted only when non-zero; a 0/unset value keeps that gate off.
            {{- if .maxConcurrentPerOrg }}
            - name: FORGE_MAX_CONCURRENT_PER_ORG
              value: {{ .maxConcurrentPerOrg | quote }}
            {{- end }}
            {{- if .maxConcurrentPerUser }}
            - name: FORGE_MAX_CONCURRENT_PER_USER
              value: {{ .maxConcurrentPerUser | quote }}
            {{- end }}
            {{- if .maxTotalCpuMillicores }}
            - name: FORGE_MAX_TOTAL_CPU_MILLICORES
              value: {{ .maxTotalCpuMillicores | quote }}
            {{- end }}
            {{- if .maxTotalMemoryMB }}
            - name: FORGE_MAX_TOTAL_MEMORY_MB
              value: {{ .maxTotalMemoryMB | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.forge.volumes }}
            # Shared workspace volumes: per-workflow total-size cap (0 disables the
            # feature), optional per-volume cap, PVC StorageClass/access mode, and the
            # orphan-reaper age. Empty values fall back to the binary defaults.
            - name: FORGE_MAX_WORKFLOW_VOLUME_MB
              value: {{ .maxWorkflowMB | quote }}
            {{- if .maxVolumeMB }}
            - name: FORGE_MAX_VOLUME_MB
              value: {{ .maxVolumeMB | quote }}
            {{- end }}
            {{- if .storageClass }}
            - name: FORGE_VOLUME_STORAGE_CLASS
              value: {{ .storageClass | quote }}
            {{- end }}
            {{- if .accessMode }}
            - name: FORGE_VOLUME_ACCESS_MODE
              value: {{ .accessMode | quote }}
            {{- end }}
            {{- if .maxAgeSecs }}
            - name: FORGE_VOLUME_MAX_AGE_SECS
              value: {{ .maxAgeSecs | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.forge.build }}
            # Image builds (forge/build-image) use Kaniko. Override the builder image
            # to point at a private mirror in an air-gapped install; empty = the binary
            # default (gcr.io/kaniko-project/executor:debug).
            {{- if .builderImage }}
            - name: FORGE_BUILDER_IMAGE
              value: {{ .builderImage | quote }}
            {{- end }}
            {{- end }}
            # The forge/git-clone step runs on a forge-controlled minimal git image,
            # versioned in lockstep with forge (same release pipeline, same tag). When
            # gitImage is unset, default it to the runner-git image at forge's own
            # registry and tag — NOT the binary default runner-git:latest, which the
            # pipeline publishes only from the main branch, so an alpha/beta deployment
            # would try to pull a tag that was never built (ImagePullBackOff). Override
            # gitImage to pin a digest or point at a private mirror.
            # Where the artifact store lives. Forge config, never a request field: a
            # sandbox must not be able to aim a workspace upload at an arbitrary host.
            {{- if .Values.artifacts.enabled }}
            - name: FORGE_ARTIFACTS_URL
              value: "http://{{ include "codearmory.fullname" . }}-artifacts:{{ .Values.artifacts.port }}"
            {{- end }}
            - name: FORGE_GIT_IMAGE
            {{- if .Values.forge.gitImage }}
              value: {{ .Values.forge.gitImage | quote }}
            {{- else }}
              {{- $gitTag := include "codearmory.imageTag" (list . .Values.forge) }}
              {{- if .Values.imageRegistry }}
              value: {{ printf "%s/runner-git:%s" .Values.imageRegistry $gitTag | quote }}
              {{- else }}
              value: {{ printf "runner-git:%s" $gitTag | quote }}
              {{- end }}
            {{- end }}
            - name: GATEKEEPER_URL
              value: "http://{{ include "codearmory.fullname" . }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            {{- if or (eq .Values.forge.env.runtime "kubernetes") .Values.forge.kata.enabled .Values.forge.gvisor.enabled }}
            - name: K8S_NAMESPACE
              value: {{ .Values.forge.env.k8sNamespace | default .Release.Namespace | quote }}
            {{- if .Values.forge.kata.enabled }}
            {{- if not .Values.forge.env.k8sRuntimeClass }}
            {{- fail "forge.kata.enabled=true requires forge.env.k8sRuntimeClass to name the VM-isolating RuntimeClass (e.g. \"kata\")" }}
            {{- end }}
            - name: K8S_RUNTIME_CLASS
              value: {{ .Values.forge.env.k8sRuntimeClass | quote }}
            {{- else if .Values.forge.gvisor.enabled }}
            {{- if not .Values.forge.env.k8sRuntimeClass }}
            {{- fail "forge.gvisor.enabled=true requires forge.env.k8sRuntimeClass to name the gVisor RuntimeClass (e.g. \"gvisor\")" }}
            {{- end }}
            - name: K8S_RUNTIME_CLASS
              value: {{ .Values.forge.env.k8sRuntimeClass | quote }}
            {{- else if .Values.forge.env.k8sRuntimeClass }}
            - name: K8S_RUNTIME_CLASS
              value: {{ .Values.forge.env.k8sRuntimeClass | quote }}
            {{- end }}
            - name: CONTAINER_MEMORY_LIMIT
              value: {{ .Values.forge.env.containerMemoryLimit | quote }}
            - name: CONTAINER_CPU_LIMIT
              value: {{ .Values.forge.env.containerCpuLimit | quote }}
            {{- end }}
            {{- include "codearmory.otel.envs" (list . .Values.forge.env) | nindent 12 }}
            {{- if and .Values.forge.egressProxy.enabled (not .Values.forge.kata.enabled) }}
            # Domain-allowlisting egress proxy for sandbox traffic — deployed by this
            # chart (forge-egress-proxy.yaml) and enabled by default. Skipped under kata,
            # whose microVMs filter egress at the VM level; KEPT under gvisor, which is a
            # kernel sandbox, not a network boundary, so it still needs the proxy.
            - name: FORGE_EGRESS_PROXY
              value: {{ .Values.forge.egressProxy.url | default (printf "http://%s-forge-egress-proxy:3128" (include "codearmory.fullname" .)) | quote }}
            {{- end }}
            {{- include "codearmory.postgresql.env" (list . "forge" "forge" (include "codearmory.fullname" .)) | nindent 12 }}
            - name: CONDUCTOR_FORWARD_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-forge
                  key: conductor-forward-key
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-forge
                  key: gatekeeper-service-key
            {{- if .Values.git.enabled }}
            # git is the core (Helm-deployed) credential broker; wire forge → its
            # /internal/clone-token so private-repo clone credentials work. Shared key
            # matches git-secret (the canonical owner of git-internal-key).
            - name: GIT_INTERNAL_URL
              value: "http://{{ include "codearmory.fullname" . }}-git:{{ .Values.git.port }}"
            - name: GIT_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-forge
                  key: git-internal-key
            {{- end }}
            {{- include "codearmory.tls.envs" .Values.forge.tls | nindent 12 }}
          {{- $tlsMounts := include "codearmory.tls.volumeMounts" .Values.forge.tls }}
          {{- if or (and (eq .Values.forge.env.runtime "docker") .Values.forge.dockerSocket.enabled) $tlsMounts }}
          volumeMounts:
            {{- if and (eq .Values.forge.env.runtime "docker") .Values.forge.dockerSocket.enabled }}
            - name: docker-socket
              mountPath: /var/run/docker.sock
            {{- end }}
            {{- $tlsMounts | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.forge.resources | nindent 12 }}
      {{- $tlsVols := include "codearmory.tls.volumes" .Values.forge.tls }}
      {{- if or (and (eq .Values.forge.env.runtime "docker") .Values.forge.dockerSocket.enabled) $tlsVols }}
      volumes:
        {{- if and (eq .Values.forge.env.runtime "docker") .Values.forge.dockerSocket.enabled }}
        - name: docker-socket
          hostPath:
            path: {{ .Values.forge.dockerSocket.path }}
            type: Socket
        {{- end }}
        {{- $tlsVols | nindent 8 }}
      {{- end }}
{{- end }}
