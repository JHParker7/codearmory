{{- if and .Values.forge.enabled .Values.forge.deploy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearmory.fullname" . }}-forge
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: forge
spec:
  replicas: {{ .Values.forge.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: forge
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: forge
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "codearmory.forge.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: forge
          image: "{{ include "codearmory.image" (list . .Values.forge) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.forge.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.forge.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.forge.env.logLevel | quote }}
            - name: RUNTIME
              value: {{ .Values.forge.env.runtime | quote }}
            - name: ALLOWED_IMAGES
              value: {{ .Values.forge.env.allowedImages | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ include "codearmory.fullname" . }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            {{- if eq .Values.forge.env.runtime "kubernetes" }}
            - name: K8S_NAMESPACE
              value: {{ .Values.forge.env.k8sNamespace | quote }}
            {{- if .Values.forge.env.k8sRuntimeClass }}
            - name: K8S_RUNTIME_CLASS
              value: {{ .Values.forge.env.k8sRuntimeClass | quote }}
            {{- end }}
            - name: CONTAINER_MEMORY_LIMIT
              value: {{ .Values.forge.env.containerMemoryLimit | quote }}
            - name: CONTAINER_CPU_LIMIT
              value: {{ .Values.forge.env.containerCpuLimit | quote }}
            {{- end }}
            {{- include "codearmory.otel.envs" (list . .Values.forge.env) | nindent 12 }}
            {{- if and (eq .Values.forge.env.runtime "docker") .Values.egressProxy.enabled }}
            - name: FORGE_EGRESS_PROXY
              value: "http://{{ include "codearmory.fullname" . }}-egress-proxy:{{ .Values.egressProxy.port }}"
            {{- end }}
            {{- include "codearmory.postgresql.env" (list . "forge" "forge" (include "codearmory.fullname" .)) | nindent 12 }}
            - name: CONDUCTOR_FORWARD_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-forge
                  key: conductor-forward-key
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-forge
                  key: gatekeeper-service-key
            {{- if .Values.giteaIntegration.enabled }}
            # Resolve "gitea:<owner>/<repo>" job secret_refs into Forgejo clone URLs
            # via gitea-integration. The shared key is sourced from that service's
            # secret so the two always match.
            - name: GITEA_INTERNAL_URL
              value: "http://{{ include "codearmory.fullname" . }}-gitea-integration:{{ .Values.giteaIntegration.port }}"
            - name: GITEA_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-gitea-integration
                  key: gitea-internal-key
            {{- end }}
            {{- if .Values.forge.proxmox.enabled }}
            # Proxmox VE API token consumed by a runtime backend of type "proxmox"
            # via secret_refs {token: "PROXMOX_TOKEN"}. Optional so a missing key
            # degrades to that backend's executions failing, not the whole pod.
            - name: PROXMOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-forge
                  key: proxmox-token
                  optional: true
            {{- end }}
            {{- include "codearmory.tls.envs" .Values.forge.tls | nindent 12 }}
          {{- $tlsMounts := include "codearmory.tls.volumeMounts" .Values.forge.tls }}
          {{- if or (and (eq .Values.forge.env.runtime "docker") .Values.forge.dockerSocket.enabled) $tlsMounts }}
          volumeMounts:
            {{- if and (eq .Values.forge.env.runtime "docker") .Values.forge.dockerSocket.enabled }}
            - name: docker-socket
              mountPath: /var/run/docker.sock
            {{- end }}
            {{- $tlsMounts | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.forge.resources | nindent 12 }}
      {{- $tlsVols := include "codearmory.tls.volumes" .Values.forge.tls }}
      {{- if or (and (eq .Values.forge.env.runtime "docker") .Values.forge.dockerSocket.enabled) $tlsVols }}
      volumes:
        {{- if and (eq .Values.forge.env.runtime "docker") .Values.forge.dockerSocket.enabled }}
        - name: docker-socket
          hostPath:
            path: {{ .Values.forge.dockerSocket.path }}
            type: Socket
        {{- end }}
        {{- $tlsVols | nindent 8 }}
      {{- end }}
{{- end }}
