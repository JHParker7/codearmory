{{- if not .Values.global.externalSecrets }}
{{- if .Values.outpostGateway.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-outpost-gateway" $fullName) -}}
{{- $gkKey := .Values.outpostGateway.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "outpost-gateway") -}}
  {{- end -}}
{{- end -}}
{{- /* outpost-internal-key: shared HMAC secret across the gateway and every
       integration consumer (chaos, argo). Derived deterministically from a
       shared name so all parties agree on first install. */ -}}
{{- $internalKey := .Values.outpostGateway.secret.outpostInternalKey -}}
{{- if not $internalKey -}}
  {{- if and $existing (index $existing.data "outpost-internal-key") -}}
    {{- $internalKey = index $existing.data "outpost-internal-key" | b64dec -}}
  {{- else -}}
    {{- $internalKey = include "codearmory.bootstrapServiceKey" (list $ "outpost-internal") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-outpost-gateway
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: outpost-gateway
type: Opaque
stringData:
{{- if .Values.outpostGateway.secret.databaseUrl }}
  database-url: {{ .Values.outpostGateway.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  outpost-internal-key: {{ $internalKey | quote }}
{{- end }}
{{- end }}
