apiVersion: v1
kind: Service
metadata:
  name: {{ include "codearmory.fullname" . }}-conductor
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: conductor
spec:
  type: {{ .Values.conductor.service.type }}
  ports:
    - port: {{ .Values.conductor.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "codearmory.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: conductor
