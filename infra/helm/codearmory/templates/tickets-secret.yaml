{{- if not .Values.global.externalSecrets }}
{{- if .Values.tickets.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-tickets" $fullName) -}}
{{- $gkKey := .Values.tickets.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "tickets") -}}
  {{- end -}}
{{- end -}}
{{- /* events-trigger-key is the shared HMAC signing tickets' lifecycle events to the events service
       (POST /internal/events). It MUST equal the key events and workflows use, so it follows
       the SAME lookup chain their secrets use and ends at the SAME bootstrapServiceKey
       "hooks-trigger" fallback — the seed name is historical and must NOT be "renamed to
       match", since a different seed would mint a different value and every ticket-triggered pipeline would
       401. An already-deployed events (or pre-migration hooks) secret wins over this secret's
       own key, so an upgrade adopts the value already in use. */ -}}
{{- $triggerKey := .Values.tickets.secret.eventsTriggerKey -}}
{{- if not $triggerKey -}}
  {{- $eventsSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-events" $fullName) -}}
  {{- $hooksSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-hooks" $fullName) -}}
  {{- $workflowsSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-workflows" $fullName) -}}
  {{- if and $eventsSecret (index $eventsSecret.data "events-trigger-key") -}}
    {{- $triggerKey = index $eventsSecret.data "events-trigger-key" | b64dec -}}
  {{- else if and $hooksSecret (index $hooksSecret.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $hooksSecret.data "hooks-trigger-key" | b64dec -}}
  {{- else if and $workflowsSecret (index $workflowsSecret.data "events-trigger-key") -}}
    {{- $triggerKey = index $workflowsSecret.data "events-trigger-key" | b64dec -}}
  {{- else if and $existing (index $existing.data "events-trigger-key") -}}
    {{- $triggerKey = index $existing.data "events-trigger-key" | b64dec -}}
  {{- else if and $existing (index $existing.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $existing.data "hooks-trigger-key" | b64dec -}}
  {{- else -}}
    {{- $triggerKey = include "codearmory.bootstrapServiceKey" (list $ "hooks-trigger") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-tickets
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: tickets
type: Opaque
stringData:
{{- if .Values.tickets.secret.databaseUrl }}
  database-url: {{ .Values.tickets.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  events-trigger-key: {{ $triggerKey | quote }}
{{- end }}
{{- end }}
