{{- if .Values.containers.enabled }}
{{- $fullname := include "codearmory.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-containers
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: containers
spec:
  replicas: {{ .Values.containers.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: containers
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: containers
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: containers
          image: "{{ include "codearmory.image" (list . .Values.containers) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.containers.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.containers.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.containers.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ $fullname }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            - name: REGISTRY_URL
              value: {{ .Values.containers.env.registryUrl | quote }}
            # gitea_integration is now a non-core service builder deploys on demand;
            # builder deploys it under the fullname-prefixed name on its fixed port 8088.
            # Kept (not removed) so containers always boots; resolves once an admin
            # enables gitea via builder.
            - name: GITEA_INTEGRATION_URL
              value: "http://{{ $fullname }}-gitea-integration:8088"
            {{- if .Values.containers.env.registryUsername }}
            - name: REGISTRY_USERNAME
              value: {{ .Values.containers.env.registryUsername | quote }}
            {{- end }}
            {{- include "codearmory.otel.envs" (list . .Values.containers.env) | nindent 12 }}
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-containers
                  key: gatekeeper-service-key
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-containers
                  key: registry-password
                  optional: true
            {{- include "codearmory.tls.envs" .Values.containers.tls | nindent 12 }}
          {{- with (include "codearmory.tls.volumeMounts" .Values.containers.tls) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.containers.resources | nindent 12 }}
      {{- with (include "codearmory.tls.volumes" .Values.containers.tls) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
