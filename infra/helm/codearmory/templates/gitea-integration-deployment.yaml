{{- if and .Values.giteaIntegration.enabled .Values.giteaIntegration.deploy }}
{{- $fullname := include "codearmory.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-gitea-integration
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea-integration
spec:
  replicas: {{ .Values.giteaIntegration.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gitea-integration
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: gitea-integration
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: gitea-integration
          image: "{{ include "codearmory.image" (list . .Values.giteaIntegration) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.giteaIntegration.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.giteaIntegration.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.giteaIntegration.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ $fullname }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            {{- include "codearmory.otel.envs" (list . .Values.giteaIntegration.env) | nindent 12 }}
            {{- include "codearmory.postgresql.env" (list . "gitea-integration" "gitea_integration" $fullname) | nindent 12 }}
            - name: GITEA_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-gitea-integration
                  key: gitea-url
            - name: GITEA_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-gitea-integration
                  key: gitea-admin-token
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-gitea-integration
                  key: gatekeeper-service-key
            - name: GITEA_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-gitea-integration
                  key: gitea-internal-key
            {{- include "codearmory.tls.envs" .Values.giteaIntegration.tls | nindent 12 }}
          {{- with (include "codearmory.tls.volumeMounts" .Values.giteaIntegration.tls) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.giteaIntegration.resources | nindent 12 }}
      {{- with (include "codearmory.tls.volumes" .Values.giteaIntegration.tls) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
