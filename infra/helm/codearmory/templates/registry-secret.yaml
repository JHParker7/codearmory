apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codearmory.fullname" . }}-registry
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
type: Opaque
stringData:
{{- if .Values.registry.secret.databaseUrl }}
  database-url: {{ .Values.registry.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ .Values.registry.secret.gatekeeperServiceKey | quote }}
  service-accounts: {{ .Values.registry.secret.serviceAccounts | quote }}
  admin-accounts: {{ .Values.registry.secret.adminAccounts | quote }}
