{{- if not .Values.global.externalSecrets }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-registry" $fullName) -}}
{{- $gkKey := .Values.registry.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "registry") -}}
  {{- end -}}
{{- end -}}
{{- /* service-accounts: assemble conductor=<key>,gatekeeper=<key> from their secrets if not set */ -}}
{{- $serviceAccounts := .Values.registry.secret.serviceAccounts -}}
{{- if not $serviceAccounts -}}
  {{- $conductorSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-conductor" $fullName) -}}
  {{- $conductorKey := "" -}}
  {{- if and $conductorSecret (index $conductorSecret.data "registry-service-key") -}}
    {{- $conductorKey = index $conductorSecret.data "registry-service-key" | b64dec -}}
  {{- else if and $existing (index $existing.data "service-accounts") -}}
    {{- /* on upgrade fall back to existing registry secret */ -}}
  {{- else -}}
    {{- $conductorKey = include "codearmory.bootstrapServiceKey" (list $ "conductor") -}}
  {{- end -}}
  {{- $gkSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-gatekeeper" $fullName) -}}
  {{- $gkRegistryKey := "" -}}
  {{- if and $gkSecret (index $gkSecret.data "registry-service-key") -}}
    {{- $gkRegistryKey = index $gkSecret.data "registry-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkRegistryKey = include "codearmory.bootstrapServiceKey" (list $ "gatekeeper") -}}
  {{- end -}}
  {{- if $conductorKey -}}
    {{- $serviceAccounts = printf "conductor=%s,gatekeeper=%s" $conductorKey $gkRegistryKey -}}
  {{- else if and $existing (index $existing.data "service-accounts") -}}
    {{- $serviceAccounts = index $existing.data "service-accounts" | b64dec -}}
  {{- else -}}
    {{- $serviceAccounts = printf "conductor=%s,gatekeeper=%s" (include "codearmory.bootstrapServiceKey" (list $ "conductor")) $gkRegistryKey -}}
  {{- end -}}
{{- end -}}
{{- /* workflows is a registry READ account: it polls GET /actions and GET /services to
       resolve pipeline step targets. Key matches workflows' own registry-service-key
       (bootstrap seed "workflows-registry"), preserved from its secret on upgrade. */ -}}
{{- if .Values.workflows.enabled -}}
  {{- $wfSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-workflows" $fullName) -}}
  {{- $wfRegKey := "" -}}
  {{- if and $wfSecret (index $wfSecret.data "registry-service-key") -}}
    {{- $wfRegKey = index $wfSecret.data "registry-service-key" | b64dec -}}
  {{- else -}}
    {{- $wfRegKey = include "codearmory.bootstrapServiceKey" (list $ "workflows-registry") -}}
  {{- end -}}
  {{- if not (contains "workflows=" $serviceAccounts) -}}
    {{- if $serviceAccounts -}}
      {{- $serviceAccounts = printf "%s,workflows=%s" $serviceAccounts $wfRegKey -}}
    {{- else -}}
      {{- $serviceAccounts = printf "workflows=%s" $wfRegKey -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $adminAccounts := .Values.registry.secret.adminAccounts -}}
{{- if not $adminAccounts -}}
  {{- if and $existing (index $existing.data "admin-accounts") -}}
    {{- $adminAccounts = index $existing.data "admin-accounts" | b64dec -}}
  {{- end -}}
{{- end -}}
{{- /* builder must be an ADMIN registry account: its reconciler registers, updates and
       removes non-core services (POST/PUT/DELETE /services) at runtime. Admin accounts
       also satisfy read auth, so builder still fetches the live catalog via GET /services.
       Key is the deterministic bootstrap (or preserved from builder's own secret). */ -}}
{{- if .Values.builder.enabled -}}
  {{- $builderSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-builder" $fullName) -}}
  {{- $builderRegKey := "" -}}
  {{- if and $builderSecret (index $builderSecret.data "registry-service-key") -}}
    {{- $builderRegKey = index $builderSecret.data "registry-service-key" | b64dec -}}
  {{- else -}}
    {{- $builderRegKey = include "codearmory.bootstrapServiceKey" (list $ "builder-registry") -}}
  {{- end -}}
  {{- if not (contains "builder=" $adminAccounts) -}}
    {{- if $adminAccounts -}}
      {{- $adminAccounts = printf "%s,builder=%s" $adminAccounts $builderRegKey -}}
    {{- else -}}
      {{- $adminAccounts = printf "builder=%s" $builderRegKey -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-registry
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
type: Opaque
stringData:
{{- if .Values.registry.secret.databaseUrl }}
  database-url: {{ .Values.registry.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  service-accounts: {{ $serviceAccounts | quote }}
  admin-accounts: {{ $adminAccounts | quote }}
{{- end }}
