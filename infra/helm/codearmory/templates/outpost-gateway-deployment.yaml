{{- if and .Values.outpostGateway.enabled .Values.outpostGateway.deploy }}
{{- $full := include "codearmory.fullname" . -}}
{{- $consumers := list -}}
{{- if .Values.chaos.enabled }}{{- $consumers = append $consumers (printf "chaos=http://%s-chaos:%v" $full .Values.chaos.port) -}}{{- end }}
{{- if .Values.argo.enabled }}{{- $consumers = append $consumers (printf "argo=http://%s-argo:%v" $full .Values.argo.port) -}}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-outpost-gateway
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: outpost-gateway
spec:
  replicas: {{ .Values.outpostGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: outpost-gateway
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: outpost-gateway
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: outpost-gateway
          image: "{{ include "codearmory.image" (list . .Values.outpostGateway) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.outpostGateway.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.outpostGateway.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.outpostGateway.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ $full }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            - name: EVENT_CONSUMERS
              value: {{ join "," $consumers | quote }}
            {{- include "codearmory.otel.envs" (list . .Values.outpostGateway.env) | nindent 12 }}
            {{- include "codearmory.postgresql.env" (list . "outpost-gateway" "outpost_gateway" $full) | nindent 12 }}
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $full }}-outpost-gateway
                  key: gatekeeper-service-key
            - name: OUTPOST_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $full }}-outpost-gateway
                  key: outpost-internal-key
            {{- include "codearmory.tls.envs" .Values.outpostGateway.tls | nindent 12 }}
          {{- with (include "codearmory.tls.volumeMounts" .Values.outpostGateway.tls) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.outpostGateway.resources | nindent 12 }}
      {{- with (include "codearmory.tls.volumes" .Values.outpostGateway.tls) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
