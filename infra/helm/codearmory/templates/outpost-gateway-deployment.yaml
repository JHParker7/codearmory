{{- if .Values.outpostGateway.enabled }}
{{- $fullname := include "codearmory.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-outpost-gateway
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: outpost-gateway
spec:
  replicas: {{ .Values.outpostGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: outpost-gateway
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: outpost-gateway
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: outpost-gateway
          image: "{{ include "codearmory.image" (list . .Values.outpostGateway) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.outpostGateway.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.outpostGateway.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.outpostGateway.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ $fullname }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            {{- include "codearmory.otel.envs" (list . .Values.outpostGateway.env) | nindent 12 }}
            {{- include "codearmory.postgresql.env" (list . "outpost-gateway" "outpost_gateway" $fullname) | nindent 12 }}
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-outpost-gateway
                  key: gatekeeper-service-key
            # Shared HMAC for the internal command/event plane (consumers ↔ gateway).
            - name: OUTPOST_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-outpost-gateway
                  key: internal-key
            {{- with .Values.outpostGateway.env.eventConsumers }}
            # integration=url,... — where the gateway POSTs an integration's events.
            - name: EVENT_CONSUMERS
              value: {{ . | quote }}
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.outpostGateway.resources | nindent 12 }}
{{- end }}
