{{- if not .Values.global.externalSecrets }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-conductor" $fullName) -}}
{{- $registryKey := .Values.conductor.secret.registryServiceKey -}}
{{- if not $registryKey -}}
  {{- if and $existing (index $existing.data "registry-service-key") -}}
    {{- $registryKey = index $existing.data "registry-service-key" | b64dec -}}
  {{- else -}}
    {{- $registryKey = include "codearmory.bootstrapServiceKey" (list $ "conductor") -}}
  {{- end -}}
{{- end -}}
{{- $forwardKey := .Values.conductor.secret.conductorForwardKey -}}
{{- if not $forwardKey -}}
  {{- if and $existing (index $existing.data "conductor-forward-key") -}}
    {{- $forwardKey = index $existing.data "conductor-forward-key" | b64dec -}}
  {{- else -}}
    {{- $forwardKey = include "codearmory.bootstrapServiceKey" (list $ "conductor-forward") -}}
  {{- end -}}
{{- end -}}
{{- $notifyKey := .Values.conductor.secret.conductorNotifyKey -}}
{{- if not $notifyKey -}}
  {{- if and $existing (index $existing.data "conductor-notify-key") -}}
    {{- $notifyKey = index $existing.data "conductor-notify-key" | b64dec -}}
  {{- else -}}
    {{- $notifyKey = include "codearmory.bootstrapServiceKey" (list $ "conductor-notify") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-conductor
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: conductor
type: Opaque
stringData:
  registry-service-key: {{ $registryKey | quote }}
  conductor-forward-key: {{ $forwardKey | quote }}
  conductor-notify-key: {{ $notifyKey | quote }}
{{- end }}
