{{- if not .Values.global.externalSecrets }}
{{- if .Values.artifacts.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-artifacts" $fullName) -}}
{{- $gkKey := .Values.artifacts.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "artifacts") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-artifacts
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifacts
type: Opaque
stringData:
{{- if .Values.artifacts.secret.databaseUrl }}
  database-url: {{ .Values.artifacts.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
{{- end }}
{{- end }}
