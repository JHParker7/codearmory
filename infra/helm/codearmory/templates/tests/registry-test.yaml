{{- if .Values.tests.registry.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "codearmory.fullname" . }}-test-registry
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-registry
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "10"
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test
      image: "{{ .Values.tests.registry.image.repository }}:{{ include "codearmory.imageTag" (list . .Values.tests.registry) }}"
      imagePullPolicy: {{ .Values.imagePullPolicy }}
      env:
        - name: REGISTRY_URL
          value: "http://{{ include "codearmory.fullname" . }}-registry:{{ .Values.registry.port }}"
        - name: REGISTRY_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "codearmory.fullname" . }}-registry
              key: admin-key
        - name: REGISTRY_READ_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "codearmory.fullname" . }}-registry
              key: read-key
{{- end }}
