{{- if .Values.tests.gatekeeper.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "codearmory.fullname" . }}-test-gatekeeper
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-gatekeeper
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "10"
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test
      image: "{{ include "codearmory.image" (list . .Values.tests.gatekeeper) }}"
      imagePullPolicy: {{ .Values.imagePullPolicy }}
      env:
        - name: API_URL
          value: "http://{{ include "codearmory.fullname" . }}-gatekeeper:{{ .Values.gatekeeper.port }}"
        {{- if .Values.tests.gatekeeper.databaseUrl }}
        - name: DATABASE_URL
          value: {{ .Values.tests.gatekeeper.databaseUrl | quote }}
        {{- else }}
        {{- include "codearmory.postgresql.env" (list . "gatekeeper" "gatekeeper" (include "codearmory.fullname" .)) | nindent 8 }}
        {{- end }}
{{- end }}
