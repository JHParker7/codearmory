{{- if and .Values.blueprints.enabled .Values.tests.blueprints.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "codearmory.fullname" . }}-test-blueprints
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-blueprints
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "20"
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test
      image: "{{ include "codearmory.image" (list . .Values.tests.blueprints) }}"
      imagePullPolicy: {{ .Values.imagePullPolicy }}
      env:
        - name: BLUEPRINTS_URL
          value: "http://{{ include "codearmory.fullname" . }}-blueprints:{{ .Values.blueprints.port }}"
        - name: GATEKEEPER_URL
          value: "http://{{ include "codearmory.fullname" . }}-gatekeeper:{{ .Values.gatekeeper.port }}"
{{- end }}
