{{- if and .Values.hooks.enabled .Values.tests.hooks.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "codearmory.fullname" . }}-test-hooks
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-hooks
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "20"
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test
      image: "{{ include "codearmory.image" (list . .Values.tests.hooks) }}"
      imagePullPolicy: {{ .Values.imagePullPolicy }}
      env:
        - name: HOOKS_URL
          value: "http://{{ include "codearmory.fullname" . }}-hooks:{{ .Values.hooks.port }}"
        - name: WORKFLOWS_URL
          value: "http://{{ include "codearmory.fullname" . }}-workflows:{{ .Values.workflows.port }}"
        - name: GATEKEEPER_URL
          value: "http://{{ include "codearmory.fullname" . }}-gatekeeper:{{ .Values.gatekeeper.port }}"
{{- end }}
