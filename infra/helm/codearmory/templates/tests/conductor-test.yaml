{{- if .Values.tests.conductor.enabled }}
{{- $dbUrl := coalesce .Values.tests.conductor.databaseUrl (ternary (include "codearmory.postgresql.dsn" (list . "gatekeeper")) "" .Values.postgresql.enabled) }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "codearmory.fullname" . }}-test-conductor
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-conductor
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "30"
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test
      image: "{{ .Values.tests.conductor.image.repository }}:{{ include "codearmory.imageTag" (list . .Values.tests.conductor) }}"
      imagePullPolicy: {{ .Values.imagePullPolicy }}
      env:
        - name: CONDUCTOR_URL
          value: "http://{{ include "codearmory.fullname" . }}-conductor:{{ .Values.conductor.port }}"
        - name: DATABASE_URL
          value: {{ $dbUrl | quote }}
{{- end }}
