{{- if and .Values.forge.enabled .Values.tests.forge.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "codearmory.fullname" . }}-test-forge
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-forge
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "20"
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test
      image: "{{ .Values.tests.forge.image.repository }}:{{ include "codearmory.imageTag" (list . .Values.tests.forge) }}"
      imagePullPolicy: {{ .Values.imagePullPolicy }}
      env:
        - name: FORGE_URL
          value: "http://{{ include "codearmory.fullname" . }}-forge:{{ .Values.forge.port }}"
        - name: GATEKEEPER_URL
          value: "http://{{ include "codearmory.fullname" . }}-gatekeeper:{{ .Values.gatekeeper.port }}"
{{- end }}
