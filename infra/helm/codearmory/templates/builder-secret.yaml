{{- if not .Values.global.externalSecrets }}
{{- if .Values.builder.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-builder" $fullName) -}}
{{- $gkKey := .Values.builder.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "builder") -}}
  {{- end -}}
{{- end -}}
{{- /* registry-service-key: builder is a registry read account so it can fetch
       the live service catalog (GET /services). registry-secret.yaml seeds the
       matching account with the same bootstrap seed. */ -}}
{{- $registryKey := .Values.builder.secret.registryServiceKey -}}
{{- if not $registryKey -}}
  {{- if and $existing (index $existing.data "registry-service-key") -}}
    {{- $registryKey = index $existing.data "registry-service-key" | b64dec -}}
  {{- else -}}
    {{- $registryKey = include "codearmory.bootstrapServiceKey" (list $ "builder-registry") -}}
  {{- end -}}
{{- end -}}
{{- /* builder-internal-key: shared with gatekeeper so its disable-gate can read
       effective org-service state. gatekeeper-secret.yaml resolves the same key. */ -}}
{{- $internalKey := .Values.builder.secret.internalKey -}}
{{- if not $internalKey -}}
  {{- if and $existing (index $existing.data "builder-internal-key") -}}
    {{- $internalKey = index $existing.data "builder-internal-key" | b64dec -}}
  {{- else -}}
    {{- $internalKey = include "codearmory.bootstrapServiceKey" (list $ "builder-internal") -}}
  {{- end -}}
{{- end -}}
{{- /* builder-secrets-key: AES-256-GCM key encrypting admin-supplied per-service DB
       URLs at rest. Random (64 hex chars) on first install and PRESERVED across
       upgrades — rotating it would orphan stored URLs. Distinct from gatekeeper's
       secrets key so a builder compromise can't read gatekeeper's org secrets. */ -}}
{{- $secretsKey := .Values.builder.secret.secretsKey -}}
{{- if not $secretsKey -}}
  {{- if and $existing (index $existing.data "builder-secrets-key") -}}
    {{- $secretsKey = index $existing.data "builder-secrets-key" | b64dec -}}
  {{- else -}}
    {{- $secretsKey = randAlphaNum 64 | sha256sum -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-builder
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: builder
type: Opaque
stringData:
{{- if .Values.builder.secret.databaseUrl }}
  database-url: {{ .Values.builder.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  registry-service-key: {{ $registryKey | quote }}
  builder-internal-key: {{ $internalKey | quote }}
  builder-secrets-key: {{ $secretsKey | quote }}
{{- /* sql db backend credentials — only the stored (non-ephemeral) cases. The
       maintenance URL is a CREATEDB/CREATEROLE crown-jewel; the owner password is for
       the CREATEDB-only profile (db.sql.createRole=false). Wired into the Deployment as
       optional secretKeyRefs, so omitting them here leaves builder in ephemeral mode. */ -}}
{{- with .Values.builder.db.sql.maintenanceUrl }}
  db-sql-maintenance-url: {{ . | quote }}
{{- end }}
{{- with .Values.builder.db.sql.ownerPassword }}
  db-sql-owner-password: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
