{{- if not .Values.global.externalSecrets }}
{{- if .Values.events.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-events" $fullName) -}}
{{- $gkKey := .Values.events.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "events") -}}
  {{- end -}}
{{- end -}}
{{- /* events-trigger-key is the shared HMAC that signs hook→workflows trigger calls.
       It MUST equal what workflows verifies with. Both derive it from the same
       bootstrapServiceKey "events-trigger" fallback, so this joins with the identical
       value even before any cross-sync — no mismatch window. An existing events secret
       is preserved so a rotation here is deliberate, not incidental. */ -}}
{{- $triggerKey := .Values.events.secret.eventsTriggerKey -}}
{{- if not $triggerKey -}}
  {{- if and $existing (index $existing.data "events-trigger-key") -}}
    {{- $triggerKey = index $existing.data "events-trigger-key" | b64dec -}}
  {{- else -}}
    {{- $triggerKey = include "codearmory.bootstrapServiceKey" (list $ "events-trigger") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-events
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: events
type: Opaque
stringData:
{{- if .Values.events.secret.databaseUrl }}
  database-url: {{ .Values.events.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  events-trigger-key: {{ $triggerKey | quote }}
{{- end }}
{{- end }}
