{{- if not .Values.global.externalSecrets }}
{{- if .Values.events.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-events" $fullName) -}}
{{- $gkKey := .Values.events.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "events") -}}
  {{- end -}}
{{- end -}}
{{- /* events-trigger-key is the shared HMAC that signs event→workflows trigger calls.
       It MUST equal the hooks-trigger-key workflows verifies with, so it follows the
       SAME lookup chain workflows-secret.yaml uses and ends at the SAME
       bootstrapServiceKey "hooks-trigger" fallback — a "events-trigger" seed would be a
       different value and every event-triggered run would 401. An already-deployed hooks
       or workflows secret wins over this secret's own key so an upgrade adopts the value
       workflows verifies with instead of keeping a stale one. */ -}}
{{- $triggerKey := .Values.events.secret.eventsTriggerKey -}}
{{- if not $triggerKey -}}
  {{- $hooksSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-hooks" $fullName) -}}
  {{- $workflowsSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-workflows" $fullName) -}}
  {{- if and $hooksSecret (index $hooksSecret.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $hooksSecret.data "hooks-trigger-key" | b64dec -}}
  {{- else if and $workflowsSecret (index $workflowsSecret.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $workflowsSecret.data "hooks-trigger-key" | b64dec -}}
  {{- else if and $existing (index $existing.data "events-trigger-key") -}}
    {{- $triggerKey = index $existing.data "events-trigger-key" | b64dec -}}
  {{- else -}}
    {{- $triggerKey = include "codearmory.bootstrapServiceKey" (list $ "hooks-trigger") -}}
  {{- end -}}
{{- end -}}
{{- /* events-webhook-secret keys the provider HMAC on the public POST /hooks/git. It is
       the secret the operator also configures on the git provider's webhook, so it cannot
       be auto-generated: unset simply leaves the endpoint closed (events rejects every
       unsigned webhook). An existing value is preserved across upgrades. */ -}}
{{- $webhookSecret := .Values.events.secret.webhookSecret -}}
{{- if and (not $webhookSecret) $existing (index $existing.data "events-webhook-secret") -}}
  {{- $webhookSecret = index $existing.data "events-webhook-secret" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-events
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: events
type: Opaque
stringData:
{{- if .Values.events.secret.databaseUrl }}
  database-url: {{ .Values.events.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  events-trigger-key: {{ $triggerKey | quote }}
{{- if $webhookSecret }}
  events-webhook-secret: {{ $webhookSecret | quote }}
{{- end }}
{{- end }}
{{- end }}
