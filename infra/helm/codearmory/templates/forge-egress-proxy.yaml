{{- if and .Values.forge.enabled .Values.forge.egressProxy.enabled (not .Values.forge.kata.enabled) }}
# Domain-allowlisting egress proxy for forge's sandbox traffic. Enabled by default;
# skipped under forge.kata.enabled (kata microVMs filter egress at the VM level), but
# KEPT under forge.gvisor.enabled (gVisor is a kernel sandbox, not a network boundary).
# The forge-egress NetworkPolicy (forge-egress-networkpolicy.yaml) confines sandbox Job
# pods to this proxy so the allowlist cannot be bypassed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearmory.fullname" . }}-forge-egress-proxy
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: forge-egress-proxy
spec:
  replicas: {{ .Values.forge.egressProxy.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: forge-egress-proxy
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: forge-egress-proxy
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: egress-proxy
          image: "{{ include "codearmory.image" (list . .Values.forge.egressProxy) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3128
              protocol: TCP
          env:
            - name: PORT
              value: "3128"
            - name: PROXY_ALLOWED_DOMAINS
              value: {{ .Values.forge.egressProxy.allowedDomains | quote }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.forge.egressProxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codearmory.fullname" . }}-forge-egress-proxy
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: forge-egress-proxy
spec:
  type: ClusterIP
  ports:
    - port: 3128
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "codearmory.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: forge-egress-proxy
{{- end }}
