{{- if .Values.registryMirror.enabled }}
{{- $fullname := include "codearmory.fullname" . }}
{{- $name := printf "%s-registry-mirror" $fullname }}
# In-cluster mirror of the base images builds pull FROM, so a fan-out of image builds
# does not pull the same base once per leg from a public registry and earn a
# TOOMANYREQUESTS. See values.yaml (registryMirror) for why this is seeded rather than
# a pull-through proxy.
#
# Plain HTTP: this serves public base images inside the cluster only — there is nothing
# secret here and no credential is accepted, so TLS would buy nothing but a certificate
# to rotate. Forge marks it insecure for kaniko accordingly. It is NOT exposed outside
# the cluster (ClusterIP) and is not a codearmory service: no registry manifest entry,
# no routes, no RBAC — conductor never fronts it.
{{- if and .Values.registryMirror.storage.enabled (not .Values.registryMirror.s3.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-mirror
  {{- if .Values.registryMirror.storage.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.registryMirror.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.registryMirror.storage.size | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-mirror
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.registryMirror.port }}
      targetPort: registry
      protocol: TCP
      name: registry
  selector:
    app.kubernetes.io/name: {{ include "codearmory.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: registry-mirror
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-mirror
spec:
  replicas: {{ .Values.registryMirror.replicaCount }}
  {{- if not .Values.registryMirror.s3.enabled }}
  # The PVC is ReadWriteOnce, so two replicas could not mount it on different nodes.
  # Recreate avoids a rolling update deadlocking on the old pod holding the volume.
  # With the S3 backend storage is shared, so neither restriction applies — the default
  # RollingUpdate and replicaCount > 1 are fine.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: registry-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "codearmory.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: registry-mirror
    spec:
      containers:
        - name: registry
          image: "{{ .Values.registryMirror.image.repository }}:{{ .Values.registryMirror.image.tag }}"
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          env:
            {{- if .Values.registryMirror.s3.enabled }}
            # S3 storage driver (registry:2 native). Shared object storage means the
            # mirror is no longer pinned to one node by a ReadWriteOnce PVC, so it can
            # scale to several replicas behind the Service. Point it at the same MinIO /
            # Ceph RGW the artifacts store uses.
            - name: REGISTRY_STORAGE
              value: s3
            - name: REGISTRY_STORAGE_S3_BUCKET
              value: {{ .Values.registryMirror.s3.bucket | quote }}
            - name: REGISTRY_STORAGE_S3_REGION
              value: {{ .Values.registryMirror.s3.region | quote }}
            {{- with .Values.registryMirror.s3.endpoint }}
            - name: REGISTRY_STORAGE_S3_REGIONENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE
              value: {{ .Values.registryMirror.s3.forcePathStyle | quote }}
            # http endpoints (in-cluster MinIO/Ceph) need secure=false.
            - name: REGISTRY_STORAGE_S3_SECURE
              value: {{ .Values.registryMirror.s3.secure | quote }}
            {{- /* Both halves of a static credential or neither. Gating the pair on
                   accessKeySecret alone renders `name: ""` on the secret key ref when
                   only one is filled in, which the API server rejects at install time
                   with an error naming no values key at all. Fail here instead, where
                   we can say which one is missing. */ -}}
            {{- if and (or .Values.registryMirror.s3.accessKeySecret .Values.registryMirror.s3.secretKeySecret) (not (and .Values.registryMirror.s3.accessKeySecret .Values.registryMirror.s3.secretKeySecret)) }}
            {{- fail "registryMirror.s3: set BOTH registryMirror.s3.accessKeySecret and registryMirror.s3.secretKeySecret, or neither (to use the default AWS credential chain)" }}
            {{- end }}
            {{- if .Values.registryMirror.s3.accessKeySecret }}
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registryMirror.s3.accessKeySecret }}
                  key: {{ .Values.registryMirror.s3.accessKeySecretKey }}
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registryMirror.s3.secretKeySecret }}
                  key: {{ .Values.registryMirror.s3.secretKeySecretKey }}
            {{- end }}
            {{- else }}
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            {{- end }}
          volumeMounts:
            {{- if not .Values.registryMirror.s3.enabled }}
            - name: data
              mountPath: /var/lib/registry
            {{- end }}
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.registryMirror.resources | nindent 12 }}
      {{- if not .Values.registryMirror.s3.enabled }}
      volumes:
        - name: data
        {{- if .Values.registryMirror.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- end }}
{{- end }}
