{{- if .Values.tickets.enabled }}
{{- $fullname := include "codearmory.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-tickets
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: tickets
spec:
  replicas: {{ .Values.tickets.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: tickets
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: tickets
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: tickets
          image: "{{ include "codearmory.image" (list . .Values.tickets) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.tickets.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.tickets.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.tickets.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ $fullname }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            # hooks is a non-core service builder deploys on demand; its port is fixed at 8087.
            - name: HOOKS_URL
              value: "http://{{ $fullname }}-hooks:8087"
            {{- include "codearmory.otel.envs" (list . .Values.tickets.env) | nindent 12 }}
            {{- include "codearmory.postgresql.env" (list . "tickets" "tickets" $fullname) | nindent 12 }}
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-tickets
                  key: gatekeeper-service-key
            - name: HOOKS_TRIGGER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-tickets
                  key: hooks-trigger-key
            {{- include "codearmory.tls.envs" .Values.tickets.tls | nindent 12 }}
          {{- with (include "codearmory.tls.volumeMounts" .Values.tickets.tls) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.tickets.resources | nindent 12 }}
      {{- with (include "codearmory.tls.volumes" .Values.tickets.tls) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
