{{- if .Values.tickets.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearmory.fullname" . }}-tickets
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: tickets
spec:
  replicas: {{ .Values.tickets.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: tickets
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: tickets
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tickets
          image: "{{ .Values.tickets.image.repository }}:{{ include "codearmory.imageTag" (list . .Values.tickets) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.tickets.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.tickets.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.tickets.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ include "codearmory.fullname" . }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            {{- if .Values.tickets.env.otelEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tickets.env.otelEndpoint | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-tickets
                  key: database-url
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-tickets
                  key: gatekeeper-service-key
            {{- include "codearmory.tls.envs" .Values.tickets.tls | nindent 12 }}
          {{- with (include "codearmory.tls.volumeMounts" .Values.tickets.tls) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.tickets.resources | nindent 12 }}
      {{- with (include "codearmory.tls.volumes" .Values.tickets.tls) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
