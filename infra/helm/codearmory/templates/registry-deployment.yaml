{{- /* Non-core service URLs are registered with the registry at runtime by builder
       (POST /services), not seeded here — the chart ships only core services. SERVICES
       remains an optional admin override for pre-seeding extra service URLs. */ -}}
{{- $services := .Values.registry.env.services -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearmory.fullname" . }}-registry
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  {{- /* replicas is omitted when this service has an HPA — see codearmory.replicas */}}
  {{- include "codearmory.replicas" .Values.registry }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: registry
  template:
    metadata:
      annotations:
        # Roll the registry pod whenever the manifest ConfigMap changes. The
        # registry only ingests the manifest into its DB at startup (no runtime
        # reload), so without this a manifest update (e.g. a new default_grant)
        # silently never takes effect until the pod is restarted by hand.
        checksum/registry-manifest: {{ include (print $.Template.BasePath "/registry-manifest-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: registry
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: registry
          image: "{{ include "codearmory.image" (list . .Values.registry) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.registry.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.registry.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.registry.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ include "codearmory.fullname" . }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            - name: SERVICES
              value: {{ $services | quote }}
            {{- include "codearmory.otel.envs" (list . .Values.registry.env) | nindent 12 }}
            {{- include "codearmory.postgresql.env" (list . "registry" "registry" (include "codearmory.fullname" .)) | nindent 12 }}
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-registry
                  key: gatekeeper-service-key
            - name: REGISTRY_SERVICE_ACCOUNTS
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-registry
                  key: service-accounts
            - name: REGISTRY_ADMIN_ACCOUNTS
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-registry
                  key: admin-accounts
                  optional: true
            - name: MANIFEST_FILE
              value: /etc/registry/manifest.json
            - name: CONDUCTOR_URL
              value: "http://{{ include "codearmory.fullname" . }}-conductor:{{ .Values.conductor.port }}"
            - name: CONDUCTOR_NOTIFY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-conductor
                  key: conductor-notify-key
            {{- /* The registry no longer push-notifies workflows (a builder-managed,
                   non-core service): workflows pulls the action catalog via its own
                   periodic GET /actions poll, so the registry needs no workflows key. */}}
            {{- include "codearmory.tls.envs" .Values.registry.tls | nindent 12 }}
          volumeMounts:
            - name: registry-manifest
              mountPath: /etc/registry/manifest.json
              subPath: manifest.json
              readOnly: true
            {{- with (include "codearmory.tls.volumeMounts" .Values.registry.tls) }}
            {{- . | nindent 12 }}
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
      volumes:
        - name: registry-manifest
          configMap:
            name: {{ include "codearmory.fullname" . }}-registry-manifest
        {{- with (include "codearmory.tls.volumes" .Values.registry.tls) }}
        {{- . | nindent 8 }}
        {{- end }}
