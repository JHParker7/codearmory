{{- $services := .Values.registry.env.services -}}
{{- if not $services -}}
{{- $fullname := include "codearmory.fullname" . -}}
{{- $svcs := list -}}
{{- if .Values.blueprints.enabled -}}
{{- $svcs = append $svcs (printf "blueprints=http://%s-blueprints:%d" $fullname (.Values.blueprints.port | int)) -}}
{{- end -}}
{{- if .Values.forge.enabled -}}
{{- $svcs = append $svcs (printf "forge=http://%s-forge:%d" $fullname (.Values.forge.port | int)) -}}
{{- end -}}
{{- $services = join "," $svcs -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearmory.fullname" . }}-registry
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  replicas: {{ .Values.registry.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: registry
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: "{{ .Values.registry.image.repository }}:{{ include "codearmory.imageTag" (list . .Values.registry) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.registry.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.registry.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.registry.env.logLevel | quote }}
            - name: SERVICES
              value: {{ $services | quote }}
            {{- if .Values.registry.env.otelEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.registry.env.otelEndpoint | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-registry
                  key: database-url
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-registry
                  key: admin-key
            - name: READ_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-registry
                  key: read-key
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
