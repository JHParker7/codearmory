{{- $services := .Values.registry.env.services -}}
{{- if not $services -}}
{{- $fullname := include "codearmory.fullname" . -}}
{{- $svcs := list -}}
{{- if .Values.blueprints.enabled -}}
{{- $svcs = append $svcs (printf "blueprints=http://%s-blueprints:%d" $fullname (.Values.blueprints.port | int)) -}}
{{- end -}}
{{- if .Values.forge.enabled -}}
{{- $svcs = append $svcs (printf "forge=http://%s-forge:%d" $fullname (.Values.forge.port | int)) -}}
{{- end -}}
{{- if .Values.containers.enabled -}}
{{- $svcs = append $svcs (printf "containers=http://%s-containers:%d" $fullname (.Values.containers.port | int)) -}}
{{- end -}}
{{- if .Values.giteaIntegration.enabled -}}
{{- $svcs = append $svcs (printf "gitea_integration=http://%s-gitea-integration:%d" $fullname (.Values.giteaIntegration.port | int)) -}}
{{- end -}}
{{- $services = join "," $svcs -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearmory.fullname" . }}-registry
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  replicas: {{ .Values.registry.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: registry
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: "{{ include "codearmory.image" (list . .Values.registry) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.registry.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.registry.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.registry.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ include "codearmory.fullname" . }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            - name: SERVICES
              value: {{ $services | quote }}
            {{- if .Values.registry.env.otelEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.registry.env.otelEndpoint | quote }}
            {{- end }}
            {{- include "codearmory.postgresql.env" (list . "registry" "registry" (include "codearmory.fullname" .)) | nindent 12 }}
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-registry
                  key: gatekeeper-service-key
            - name: REGISTRY_SERVICE_ACCOUNTS
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-registry
                  key: service-accounts
            - name: REGISTRY_ADMIN_ACCOUNTS
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-registry
                  key: admin-accounts
            {{- include "codearmory.tls.envs" .Values.registry.tls | nindent 12 }}
          {{- with (include "codearmory.tls.volumeMounts" .Values.registry.tls) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
      {{- with (include "codearmory.tls.volumes" .Values.registry.tls) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
