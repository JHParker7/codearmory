{{- if .Values.blacksmith.enabled }}
{{- if not .Values.global.externalSecrets }}
{{- $fullname := include "codearmory.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-blacksmith
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: blacksmith
type: Opaque
stringData:
  # The registry service key: conductor forward-auths callers, then forwards to
  # blacksmith signed with this key. Must match the "blacksmith" entry's
  # service_key in the registry manifest.
  registry-service-key: {{ .Values.blacksmith.secret.registryServiceKey | quote }}
  # Forge admin credentials — blacksmith logs in to forge to acquire sandbox
  # leases (the executions that run agent code) and to mint the per-run delegated
  # identity through forge's gatekeeper.
  forge-password: {{ .Values.blacksmith.secret.forgePassword | quote }}
{{- end }}
{{- end }}
