apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearmory.fullname" . }}-conductor
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: conductor
spec:
  replicas: {{ .Values.conductor.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: conductor
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: conductor
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
        {{- include "codearmory.initContainer.waitForRegistry" . | nindent 8 }}
      containers:
        - name: conductor
          image: "{{ include "codearmory.image" (list . .Values.conductor) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.conductor.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.conductor.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.conductor.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ include "codearmory.fullname" . }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            - name: REGISTRY_URL
              value: "http://{{ include "codearmory.fullname" . }}-registry:{{ .Values.registry.port }}"
            {{- if .Values.conductor.env.otelEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.conductor.env.otelEndpoint | quote }}
            {{- end }}
            - name: REGISTRY_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-conductor
                  key: registry-service-key
            - name: CONDUCTOR_FORWARD_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codearmory.fullname" . }}-conductor
                  key: conductor-forward-key
            {{- include "codearmory.tls.envs" .Values.conductor.tls | nindent 12 }}
          {{- with (include "codearmory.tls.volumeMounts" .Values.conductor.tls) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.conductor.resources | nindent 12 }}
      {{- with (include "codearmory.tls.volumes" .Values.conductor.tls) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
