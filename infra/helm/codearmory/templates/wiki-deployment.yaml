{{- if .Values.wiki.enabled }}
{{- $fullname := include "codearmory.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-wiki
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: wiki
spec:
  {{- include "codearmory.replicas" .Values.wiki }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: wiki
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: wiki
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: wiki
          image: "{{ include "codearmory.image" (list . .Values.wiki) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.wiki.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.wiki.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.wiki.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ $fullname }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            # The wiki stores content in git via git-factory (model B: it acts as its own
            # bot identity, so callers need only wiki permissions).
            - name: GIT_FACTORY_URL
              value: "http://{{ $fullname }}-git-factory:{{ .Values.gitFactory.port }}"
            # The wiki IS its bot: it logs in as this account and uses that session for git
            # (model B). No privileged token minting — the bot only touches its own namespace.
            - name: WIKI_BOT_EMAIL
              value: {{ .Values.wiki.env.botEmail | quote }}
            - name: WIKI_BOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-wiki
                  key: bot-password
            # The namespace the bot owns, where <project>-wiki repos live.
            - name: WIKI_NAMESPACE
              value: {{ .Values.wiki.env.namespace | quote }}
            {{- include "codearmory.otel.envs" (list . .Values.wiki.env) | nindent 12 }}
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-wiki
                  key: gatekeeper-service-key
            {{- include "codearmory.tls.envs" .Values.wiki.tls | nindent 12 }}
          {{- with (include "codearmory.tls.volumeMounts" .Values.wiki.tls) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.wiki.resources | nindent 12 }}
      {{- with (include "codearmory.tls.volumes" .Values.wiki.tls) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
