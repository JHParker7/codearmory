{{- if .Values.git.enabled }}
{{- $fullname := include "codearmory.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-git
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: git
spec:
  replicas: {{ .Values.git.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codearmory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: git
  template:
    metadata:
      labels:
        {{- include "codearmory.labels" . | nindent 8 }}
        app.kubernetes.io/component: git
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "codearmory.initContainer.waitForGatekeeper" . | nindent 8 }}
      containers:
        - name: git
          image: "{{ include "codearmory.image" (list . .Values.git) }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.git.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.git.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.git.env.logLevel | quote }}
            - name: GATEKEEPER_URL
              value: "http://{{ $fullname }}-gatekeeper:{{ .Values.gatekeeper.port }}"
            {{- include "codearmory.otel.envs" (list . .Values.git.env) | nindent 12 }}
            {{- include "codearmory.postgresql.env" (list . "git" "git" $fullname) | nindent 12 }}
            - name: GATEKEEPER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-git
                  key: gatekeeper-service-key
            # Required: encrypts linked-backend credentials at rest. The service
            # refuses to start without it.
            - name: GIT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-git
                  key: git-encryption-key
            # Shared HMAC with forge authenticating forge → git /internal/clone-token.
            # Matches the same key wired into forge-secret (bootstrap arg "git-internal").
            - name: GIT_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-git
                  key: git-internal-key
            {{- include "codearmory.tls.envs" .Values.git.tls | nindent 12 }}
          {{- with (include "codearmory.tls.volumeMounts" .Values.git.tls) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.git.resources | nindent 12 }}
      {{- with (include "codearmory.tls.volumes" .Values.git.tls) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
