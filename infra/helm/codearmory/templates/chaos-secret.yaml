{{- if not .Values.global.externalSecrets }}
{{- if .Values.chaos.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-chaos" $fullName) -}}
{{- $gkKey := .Values.chaos.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "chaos") -}}
  {{- end -}}
{{- end -}}
{{- /* outpost-internal-key: shared with the gateway and other consumers. */ -}}
{{- $internalKey := .Values.chaos.secret.outpostInternalKey -}}
{{- if not $internalKey -}}
  {{- $gw := lookup "v1" "Secret" .Release.Namespace (printf "%s-outpost-gateway" $fullName) -}}
  {{- if and $gw (index $gw.data "outpost-internal-key") -}}
    {{- $internalKey = index $gw.data "outpost-internal-key" | b64dec -}}
  {{- else if and $existing (index $existing.data "outpost-internal-key") -}}
    {{- $internalKey = index $existing.data "outpost-internal-key" | b64dec -}}
  {{- else -}}
    {{- $internalKey = include "codearmory.bootstrapServiceKey" (list $ "outpost-internal") -}}
  {{- end -}}
{{- end -}}
{{- /* hooks-trigger-key: shared with hooks for emitting experiment events. */ -}}
{{- $triggerKey := .Values.chaos.secret.hooksTriggerKey -}}
{{- if and .Values.hooks.enabled (not $triggerKey) -}}
  {{- $hooksSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-hooks" $fullName) -}}
  {{- if and $hooksSecret (index $hooksSecret.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $hooksSecret.data "hooks-trigger-key" | b64dec -}}
  {{- else if and $existing (index $existing.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $existing.data "hooks-trigger-key" | b64dec -}}
  {{- else -}}
    {{- $triggerKey = include "codearmory.bootstrapServiceKey" (list $ "hooks-trigger") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-chaos
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: chaos
type: Opaque
stringData:
{{- if .Values.chaos.secret.databaseUrl }}
  database-url: {{ .Values.chaos.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  outpost-internal-key: {{ $internalKey | quote }}
{{- if $triggerKey }}
  hooks-trigger-key: {{ $triggerKey | quote }}
{{- end }}
{{- end }}
{{- end }}
