{{- if .Values.hooks.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-hooks" $fullName) -}}
{{- $gkKey := .Values.hooks.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
{{- /* hooks-trigger-key is authoritative here; workflows reads from this secret */ -}}
{{- $triggerKey := .Values.hooks.secret.hooksTriggerKey -}}
{{- if not $triggerKey -}}
  {{- if and $existing (index $existing.data "hooks-trigger-key") -}}
    {{- $triggerKey = index $existing.data "hooks-trigger-key" | b64dec -}}
  {{- else -}}
    {{- $triggerKey = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-hooks
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: hooks
type: Opaque
stringData:
{{- if .Values.hooks.secret.databaseUrl }}
  database-url: {{ .Values.hooks.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  hooks-trigger-key: {{ $triggerKey | quote }}
{{- end }}
