{{- if not .Values.global.externalSecrets }}
{{- if .Values.wiki.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-wiki" $fullName) -}}
{{- $gkKey := .Values.wiki.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "wiki") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-wiki
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: wiki
type: Opaque
stringData:
  gatekeeper-service-key: {{ $gkKey | quote }}
{{- end }}
{{- end }}
