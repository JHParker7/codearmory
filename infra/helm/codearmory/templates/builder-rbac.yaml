{{- if and .Values.builder.enabled .Values.builder.serviceAccount.create }}
# Role in the instance namespace lets builder's reconciler create, reconfigure and
# tear down the Deployments and Services for the non-core services an instance admin
# enables. It can read existing Deployments (to clone a platform service's spec) and
# the Secrets those workloads reference. Scoped to .Release.Namespace — builder
# deploys into the instance it runs in, not arbitrary namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "codearmory.fullname" . }}-builder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: builder
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Pods (read-only) so the reconciler can observe rollout/readiness of what it
  # deployed.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # PodDisruptionBudgets so the reconciler can keep a managed workload above its
  # replica floor during node drains / involuntary evictions.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # PersistentVolumeClaims for services that declare durable storage. Create + read
  # only, deliberately no delete: the claim is made once and never reconciled (a PVC's
  # spec is near-immutable), and tearing a service down must not destroy its data.
  # Reclaiming or resizing a volume stays a deliberate admin action, enforced here
  # rather than left to the code path that would otherwise be free to do it.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch"]
  # Secrets: read (resolve references, read conductor-forward-key) and write
  # (synthesize a service's Secret when provisioning it with no Helm change).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # ServiceAccounts + RBAC so the reconciler can grant forge the rights to create its
  # sandbox Jobs (its SA in this namespace, bound to a Role in the exec namespace —
  # which defaults to this namespace). Scoped to .Release.Namespace, like the rest.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  {{- if or (eq .Values.builder.db.backend "cnpg") .Values.builder.db.cnpg.cluster }}
  # cnpg db backend: create/read CloudNativePG Database CRs so builder can provision a
  # service's database declaratively. Builder never edits or deletes the CR (teardown
  # leaves data intact), so no update/delete — its only DB privilege is this RBAC grant.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["databases"]
    verbs: ["get", "list", "watch", "create"]
  {{- end }}
  {{- if or (eq .Values.builder.db.backend "external") .Values.builder.db.external.storeRef }}
  # external db backend: manage ExternalSecret CRs so the External Secrets Operator
  # materializes the per-service db Secret. Builder holds only the reference; delete is
  # for teardown of its own ExternalSecret (the remote store is never touched).
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch", "create", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "codearmory.fullname" . }}-builder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "codearmory.fullname" . }}-builder
subjects:
  - kind: ServiceAccount
    name: {{ include "codearmory.builder.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
