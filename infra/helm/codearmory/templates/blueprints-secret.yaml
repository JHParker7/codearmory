{{- if .Values.blueprints.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $redisUrl := coalesce .Values.blueprints.secret.redisUrl (ternary (printf "redis://%s-blueprints-redis:6379/0" $fullName) "" .Values.blueprints.redis.enabled) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-blueprints" $fullName) -}}
{{- $encKey := .Values.blueprints.secret.encryptionKey -}}
{{- if not $encKey -}}
  {{- if and $existing (index $existing.data "encryption-key") -}}
    {{- $encKey = index $existing.data "encryption-key" | b64dec -}}
  {{- else -}}
    {{- $encKey = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
{{- $gkKey := .Values.blueprints.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-blueprints
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: blueprints
type: Opaque
stringData:
{{- if .Values.blueprints.secret.databaseUrl }}
  database-url: {{ .Values.blueprints.secret.databaseUrl | quote }}
{{- end }}
  redis-url: {{ $redisUrl | quote }}
  encryption-key: {{ $encKey | quote }}
  gatekeeper-service-key: {{ $gkKey | quote }}
{{- end }}
