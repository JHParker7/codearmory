{{- if .Values.forge.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codearmory.fullname" . }}-forge
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: forge
type: Opaque
stringData:
{{- if .Values.forge.secret.databaseUrl }}
  database-url: {{ .Values.forge.secret.databaseUrl | quote }}
{{- end }}
  conductor-forward-key: {{ .Values.forge.secret.conductorForwardKey | quote }}
  gatekeeper-service-key: {{ .Values.forge.secret.gatekeeperServiceKey | quote }}
{{- end }}
