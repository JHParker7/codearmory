{{- if not .Values.global.externalSecrets }}
{{- if .Values.forge.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-forge" $fullName) -}}
{{- $gkKey := .Values.forge.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "forge") -}}
  {{- end -}}
{{- end -}}
{{- /* conductor-forward-key must match conductor; look up conductor secret first */ -}}
{{- $forwardKey := .Values.forge.secret.conductorForwardKey -}}
{{- if not $forwardKey -}}
  {{- $conductorSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-conductor" $fullName) -}}
  {{- if and $conductorSecret (index $conductorSecret.data "conductor-forward-key") -}}
    {{- $forwardKey = index $conductorSecret.data "conductor-forward-key" | b64dec -}}
  {{- else if and $existing (index $existing.data "conductor-forward-key") -}}
    {{- $forwardKey = index $existing.data "conductor-forward-key" | b64dec -}}
  {{- else -}}
    {{- $forwardKey = include "codearmory.bootstrapServiceKey" (list $ "conductor-forward") -}}
  {{- end -}}
{{- end -}}
{{- /* gitea-internal-key: shared HMAC with gitea_integration authenticating forge →
       /internal/clone-token. Matches gitea-integration-secret (bootstrap arg "gitea-internal"),
       looking that secret up first so both sides agree. Only wired when gitea_integration is
       deployed (it is now a core, Helm-deployed service). */ -}}
{{- $giteaInternalKey := "" -}}
{{- if .Values.giteaIntegration.enabled -}}
  {{- $giteaInternalKey = .Values.giteaIntegration.secret.giteaInternalKey -}}
  {{- if not $giteaInternalKey -}}
    {{- $giteaSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-gitea-integration" $fullName) -}}
    {{- if and $giteaSecret (index $giteaSecret.data "gitea-internal-key") -}}
      {{- $giteaInternalKey = index $giteaSecret.data "gitea-internal-key" | b64dec -}}
    {{- else if and $existing (index $existing.data "gitea-internal-key") -}}
      {{- $giteaInternalKey = index $existing.data "gitea-internal-key" | b64dec -}}
    {{- else -}}
      {{- $giteaInternalKey = include "codearmory.bootstrapServiceKey" (list $ "gitea-internal") -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-forge
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: forge
type: Opaque
stringData:
{{- if .Values.forge.secret.databaseUrl }}
  database-url: {{ .Values.forge.secret.databaseUrl | quote }}
{{- end }}
  conductor-forward-key: {{ $forwardKey | quote }}
  gatekeeper-service-key: {{ $gkKey | quote }}
{{- if .Values.giteaIntegration.enabled }}
  gitea-internal-key: {{ $giteaInternalKey | quote }}
{{- end }}
{{- if and .Values.forge.proxmox.enabled .Values.forge.secret.proxmoxToken }}
  proxmox-token: {{ .Values.forge.secret.proxmoxToken | quote }}
{{- end }}
{{- end }}
{{- end }}
