{{- if not .Values.global.externalSecrets }}
{{- if .Values.git.enabled }}
{{- $fullName := include "codearmory.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-git" $fullName) -}}
{{- /* gatekeeper-service-key: bootstrap arg "git" must match the identity
       gatekeeper-secret seeds into GATEKEEPER_SERVICES. */ -}}
{{- $gkKey := .Values.git.secret.gatekeeperServiceKey -}}
{{- if not $gkKey -}}
  {{- if and $existing (index $existing.data "gatekeeper-service-key") -}}
    {{- $gkKey = index $existing.data "gatekeeper-service-key" | b64dec -}}
  {{- else -}}
    {{- $gkKey = include "codearmory.bootstrapServiceKey" (list $ "git") -}}
  {{- end -}}
{{- end -}}
{{- /* git-encryption-key: REQUIRED — the git broker encrypts linked-backend
       credentials at rest with it and refuses to start without it. Persisted
       across upgrades; a deterministic bootstrap seed only on first install so
       early-encrypted rows stay decryptable. Override secret.gitEncryptionKey
       for a managed key. */ -}}
{{- $encKey := .Values.git.secret.gitEncryptionKey -}}
{{- if not $encKey -}}
  {{- if and $existing (index $existing.data "git-encryption-key") -}}
    {{- $encKey = index $existing.data "git-encryption-key" | b64dec -}}
  {{- else -}}
    {{- $encKey = include "codearmory.bootstrapServiceKey" (list $ "git-encryption") -}}
  {{- end -}}
{{- end -}}
{{- /* git-internal-key: shared HMAC secret authenticating forge → git
       /internal/clone-token calls. The git secret is the canonical owner; forge-secret
       derives the same key (bootstrap arg "git-internal"), looking this secret up first
       so both sides agree. */ -}}
{{- $internalKey := .Values.git.secret.gitInternalKey -}}
{{- if not $internalKey -}}
  {{- if and $existing (index $existing.data "git-internal-key") -}}
    {{- $internalKey = index $existing.data "git-internal-key" | b64dec -}}
  {{- else -}}
    {{- $internalKey = include "codearmory.bootstrapServiceKey" (list $ "git-internal") -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-git
  labels:
    {{- include "codearmory.labels" . | nindent 4 }}
    app.kubernetes.io/component: git
type: Opaque
stringData:
{{- if .Values.git.secret.databaseUrl }}
  database-url: {{ .Values.git.secret.databaseUrl | quote }}
{{- end }}
  gatekeeper-service-key: {{ $gkKey | quote }}
  git-encryption-key: {{ $encKey | quote }}
  git-internal-key: {{ $internalKey | quote }}
{{- end }}
{{- end }}
