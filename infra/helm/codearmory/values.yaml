global:
  # When true, all Secret resources are managed externally (e.g. via ESO+Vault).
  # The helm chart will not create any Secret objects. Set to true when using
  # Vault + External Secrets Operator.
  externalSecrets: false

nameOverride: ""
fullnameOverride: ""

# Registry prefix prepended to all codearmory service images.
# Set to your registry host, e.g. "ghcr.io/myorg" or "registry.example.com/codearmory".
# Leave empty to use the repository value as-is.
imageRegistry: "ghcr.io/code-armory-app"

# Default image tag applied to all services when the per-service tag is empty.
imageTag: alpha-0.1.0
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# Image used by initContainers that poll dependency readiness (e.g. wait-for-gatekeeper).
# Override to use a private mirror: e.g. "registry.example.com/busybox:1.36"
waitContainerImage: "public.ecr.aws/docker/library/busybox:1.36"

# OpenTelemetry trace sampling, applied to every service that has an otelEndpoint
# set (services with no endpoint export nothing, so sampling is moot). Names follow
# the OTEL_TRACES_SAMPLER spec. The default traces every request; for high-volume
# production set sampler=parentbased_traceidratio with samplerArg as a fraction
# (e.g. "0.1" to sample 10% of traces). Leave samplerArg empty for ratio-less
# samplers like parentbased_always_on.
otel:
  sampler: parentbased_always_on
  samplerArg: ""

# ── Gatekeeper ────────────────────────────────────────────────────────────────
gatekeeper:
  image:
    repository: gatekeeper
    tag: ""
  replicaCount: 1
  port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    logLevel: info
    # Comma-separated list of service names permitted to register. Core services
    # deployed by this chart (incl. the forge + workflows CI/CD pair) are listed
    # here; non-core services are auto-permitted at runtime when builder registers them.
    permittedServices: "gatekeeper,registry,builder,forge,workflows,tickets,git_connector,containers,events,outpost-gateway,wiki"
    # Comma-separated services allowed to resolve org secrets via the internal
    # lookup endpoint (deny-all when empty). Defaults to "forge" so forge can resolve
    # "secret:<name>" job secret_refs; add "containers" to let the container registry
    # resolve per-org creds, and "events" so a trigger's webhook_out "secret:<name>"
    # sign_secret resolves. Requires the secrets feature (gatekeeperSecretsKey).
    secretsLookupAllowedCallers: "forge,containers,events"
    # Comma-separated CIDRs of trusted reverse proxies (optional).
    trustedProxyCIDRs: ""
    # OpenTelemetry collector OTLP/HTTP endpoint (optional, e.g. http://otel:4318).
    otelEndpoint: ""
    # Publicly reachable base URL for OIDC discovery and token endpoints.
    # Must match the URL Forgejo/Gitea clients use to reach this instance.
    # e.g. https://codearmory.example.com
    oidcIssuer: ""
    # Optional bootstrap admin. When adminEmail and secret.adminPassword are both
    # set, gatekeeper seeds this account on startup with full administrative access
    # and the "first user becomes admin" fallback is disabled.
    adminEmail: ""
    # Optional; defaults to the email local-part when left empty.
    adminUsername: ""
  secret:
    # PostgreSQL DSN. Auto-constructed from the postgresql subchart when left empty.
    databaseUrl: ""
    # Redis URL. Auto-constructed from gatekeeper.redis when left empty.
    # Override to use an external Redis instance.
    redisUrl: ""
    # Comma-separated "name=key" pairs for service-to-service authentication,
    # e.g. "blueprints=<key>,forge=<key>,workflows=<key>,tickets=<key>,events=<key>".
    # Auto-assembled from each service's secret on upgrade. Leave empty for auto-generation.
    # Set explicitly only if you need to pin specific keys or add services outside this chart.
    gatekeeperServices: ""
    # Read key gatekeeper uses to fetch default grants from the registry.
    # Auto-generated on first install and preserved across upgrades. Leave empty for auto-generation.
    registryServiceKey: ""
    # PEM-encoded ECDSA P-256 private key used to sign OIDC ID tokens.
    # Must be stable across pod restarts — rotating this key invalidates existing
    # ID tokens and forces all connected clients to re-authenticate.
    # Generate with: openssl ecparam -name prime256v1 -genkey -noout | openssl ec -out -
    # If unset, an ephemeral key is generated on startup (not suitable for production).
    oidcSigningKey: ""
    # Password for the optional bootstrap admin (see gatekeeper.env.adminEmail).
    # Leave empty to disable env-var admin seeding.
    adminPassword: ""
    # AES-256-GCM key (64 hex chars = 32 bytes) encrypting stored user/org secrets.
    # Auto-generated on first install and preserved across upgrades (reading the
    # existing in-cluster key) — rotating it orphans every stored ciphertext. Leave
    # empty for auto-generation. Enables the secrets feature and secret: job refs.
    secretsKey: ""
  redis:
    enabled: true
    image:
      repository: redis
      tag: "7-alpine"
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
    # Size of the in-memory tmpfs volume mounted at /data.
    dataSizeLimit: 64Mi

# ── Registry ──────────────────────────────────────────────────────────────────
registry:
  image:
    repository: registry
    tag: ""
  replicaCount: 1
  port: 8082
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    # Optional comma-separated "name=url" pre-seed of service URLs. Non-core services
    # register their own URLs with the registry at runtime (via builder), so this is
    # normally left empty and used only to pre-seed extra/custom service URLs.
    services: ""
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed when left empty.
    databaseUrl: ""
    # Must match the registry entry in gatekeeper.secret.gatekeeperServices.
    # Auto-generated on first install and preserved across upgrades. Leave empty for auto-generation.
    gatekeeperServiceKey: ""
    # Comma-separated "name=key" pairs for read-only service accounts (e.g. Conductor, Gatekeeper).
    # Auto-assembled from conductor and gatekeeper secrets on upgrade. Leave empty for auto-generation.
    # Set explicitly only if you need additional service accounts beyond conductor and gatekeeper.
    serviceAccounts: ""
    # Comma-separated "name=key" pairs for admin service accounts (e.g. CI pipelines).
    # The builder service is auto-added here as an admin account when builder.enabled
    # is true, so its reconciler can register/update/remove non-core services in the
    # registry at runtime (POST/PUT/DELETE /services). Admin accounts also satisfy read
    # auth, so builder still fetches the live catalog.
    adminAccounts: ""
  tls:
    certSecret: ""     # Kubernetes TLS secret (tls.crt + tls.key) for server TLS
    clientAuth: ""     # "require" or "request" — enables mTLS on incoming connections
    caSecret: ""       # Secret containing ca.crt used to verify client certificates
    clientCertSecret: "" # TLS secret (tls.crt + tls.key) presented on outbound calls
    caBundle: ""       # Secret containing ca.crt used to verify outbound server certs

# ── Conductor ─────────────────────────────────────────────────────────────────
conductor:
  image:
    repository: conductor
    tag: ""
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    # Initial service key for conductor's account in the registry.
    # Auto-generated on first install and preserved across upgrades. Leave empty for auto-generation.
    # Rotated automatically every 25 minutes via POST /service-accounts/rotate-key on registry.
    registryServiceKey: ""
    # Shared HMAC signing key for X-Conductor-Token headers.
    # Auto-generated and synced to forge.secret.conductorForwardKey on upgrades. Leave empty for auto-generation.
    conductorForwardKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""
  service:
    type: ClusterIP
    # Set to LoadBalancer to expose conductor directly without an ingress.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: codearmory.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

# ── Portal (web app: React SPA + Express BFF) ─────────────────────────────────
# User-facing web UI. Serves the SPA and proxies /api to conductor. It is a
# conductor *client*, not a routed backend, so it has no registry manifest entry
# and no gatekeeper service key.
portal:
  image:
    repository: portal
    tag: ""
  replicaCount: 1
  port: 3001
  # Upstream conductor base URL. Defaults to the in-cluster conductor Service.
  conductorUrl: ""
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
  env:
    otelEndpoint: ""
    metricsEnabled: false
  service:
    type: ClusterIP
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: app.codearmory.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

# ── Forge ─────────────────────────────────────────────────────────────────────
# Sandboxed command execution — one half of the core CI/CD pair (with workflows).
# Shipped by this chart as a core service so pipelines can run out of the box; set
# enabled=false only if you intend to run an external forge.
forge:
  enabled: true
  image:
    repository: forge
    tag: ""
  replicaCount: 1
  port: 8083
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    logLevel: info
    # Container runtime: "kubernetes" (recommended) or "docker".
    # When set to "docker", mount the Docker socket via forge.dockerSocket.
    runtime: kubernetes
    # Comma-separated list of container images forge is permitted to run.
    allowedImages: "alpine:3.19,ubuntu:22.04,python:3.12-slim,golang:1.25,aquasec/trivy:latest,docker:27-dind"
    # Kubernetes namespace in which forge creates sandbox Jobs. Empty = the release
    # namespace (so a default install works with no prerequisite). Set a dedicated
    # namespace — which MUST already exist — for stronger isolation of sandbox Jobs.
    k8sNamespace: ""
    # Optional RuntimeClass for stronger isolation (e.g. "gvisor", "kata").
    k8sRuntimeClass: ""
    # Resource limits applied to each sandbox container.
    containerMemoryLimit: "256Mi"
    containerCpuLimit: "500m"
    otelEndpoint: ""
  # Shared workspace volumes let a workflow run's steps share a filesystem: a
  # create-volume step provisions one, a git step clones into it, and later steps
  # attach the same volume (and never need git themselves). Volumes are torn down
  # when the run ends, with an age-based reaper as the backstop.
  volumes:
    # Cap on the summed size (MB) of all of one workflow run's volumes. This is the
    # admin ceiling forge enforces on create. Set to 0 to disable shared volumes.
    maxWorkflowMB: 10240
    # Optional cap on any single volume (MB). Empty = same as maxWorkflowMB.
    maxVolumeMB: ""
    # StorageClass backing workspace PVCs. Empty = the cluster default. Point it at a
    # RAM/tmpfs-backed StorageClass to keep volumes in memory. NOTE: if the cluster has
    # no default StorageClass this MUST be set to a provisionable class, else volume
    # PVCs never bind and steps that mount them fail to schedule ("pod has unbound
    # immediate PersistentVolumeClaims"); a WaitForFirstConsumer class is preferred.
    storageClass: ""
    # PVC access mode. ReadWriteOnce suits sequential single-node runs; use
    # ReadWriteMany (on a class that supports it) when a run's steps span nodes.
    accessMode: "ReadWriteOnce"
    # Seconds before an orphaned volume is reaped. Empty = binary default
    # (longest possible run + 1h), which is safely above any live run.
    maxAgeSecs: ""
  # Admission control paces how fast queued executions are sent to the backend, so a
  # large fan-out (e.g. a matrix of `large` runners) does not dump every Job on the
  # kube-scheduler at once and leave the excess Pending until it times out. All limits
  # default to 0 (unlimited); with everything 0, forge dequeues FIFO up to the worker
  # pool size. The resource budgets are the pacing knob: forge admits a queued runner
  # only when the summed CPU/memory of already-running runners plus its own fits the
  # budget, holding the rest in the queue until running ones finish and free space.
  # Where exec (sandbox) pods are scheduled. On a multi-node cluster the kata/gvisor
  # RuntimeClass is usually installed on a subset of (often tainted) nodes; without
  # placement a sandbox pod can land on a node with no runtime handler and fail. Prefer
  # setting the RuntimeClass's own `scheduling` block (applied automatically); these are
  # the explicit override. Empty = no constraint (fine for a single-node cluster).
  execScheduling: {}
    # nodeSelector: "forge-runtime=kata"          # "k=v,k2=v2"
    # tolerateKeys: "sandbox"                      # comma-separated taint keys (Exists)
  admission:
    # Max simultaneously-running executions per org / per user (0 = unlimited).
    maxConcurrentPerOrg: 0
    maxConcurrentPerUser: 0
    # Cluster-wide CPU/memory budgets the scheduler admits runners against — forge only
    # starts a runner when the summed usage of running runners plus its class fits.
    #
    # Prefer the PERCENT knobs on a real cluster: an absolute millicore budget has to be
    # re-picked for every environment (dev/staging/prod differ) and is actively wrong on
    # an autoscaling cluster, where schedulable capacity moves under you. A percentage of
    # live allocatable capacity is correct everywhere and tracks the node count. Leave
    # ~30-40% headroom for the control plane and system daemons — a budget set at/near
    # 100% can starve the API server (learned the hard way on a single node).
    #
    # Percent takes precedence over the absolute value for the dimension it is set on.
    # Percent requires cluster-node read access (a ClusterRole, auto-created when set).
    # 0 = off for each. In docker mode percent is ignored (no cluster); use absolute.
    cpuPercent: 0
    memoryPercent: 0
    maxTotalCpuMillicores: 0
    maxTotalMemoryMB: 0
  # Image building (the forge/build-image workflow action). Builds run with Kaniko
  # (daemonless, no privileged container) and REQUIRE a privileged runner class on a
  # kata or gvisor backend (create one via the forge runner-classes API, backed by a
  # kata/gvisor runtime backend, privileged=true). Override the builder image only for
  # a private mirror / air-gapped install; empty = the forge default
  # (gcr.io/kaniko-project/executor:debug).
  build:
    builderImage: ""
    # Registries kaniko may talk to over plain HTTP (no TLS), in addition to the
    # in-cluster mirror. List a private registry the CI pushes to when it has no
    # trusted cert — e.g. a self-hosted Forgejo package registry: ["192.168.53.171:3000"].
    # Empty in production, where registries should present TLS.
    insecureRegistries: []
  # The forge/git-clone step (and any checkout-only execution that supplies no image)
  # runs on a forge-controlled minimal git image — users never pick or maintain one.
  # Empty = the runner-git image at this chart's imageRegistry and forge image tag
  # (e.g. ghcr.io/code-armory-app/runner-git:alpha-0.1.0), which the release pipeline
  # builds in lockstep with forge. Override to pin a digest or point at a private
  # mirror in an air-gapped install.
  gitImage: ""
  secret:
    # PostgreSQL DSN. Auto-constructed from the postgresql subchart when left empty.
    databaseUrl: ""
    # Must match conductor.secret.conductorForwardKey. Auto-synced on upgrades.
    conductorForwardKey: ""
    # Must match the forge entry in gatekeeper.secret.gatekeeperServices.
    # Auto-generated on first install and preserved across upgrades. Leave empty for auto-generation.
    gatekeeperServiceKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # Mount the Docker socket when forge.env.runtime is "docker".
  dockerSocket:
    enabled: false
    path: /var/run/docker.sock
  # Domain-allowlisting egress proxy for forge's sandbox traffic. Deployed by this
  # chart and ENABLED BY DEFAULT: sandbox executions reach the internet only through
  # this proxy, confined to allowedDomains. Automatically skipped when forge.kata.enabled
  # is true — kata's microVM is the isolation boundary, so runners aren't forced through
  # the proxy; a public-only egress NetworkPolicy (forge.kata.egress) blocks private IPs
  # instead. NOT skipped under forge.gvisor.enabled: gVisor is a kernel sandbox, not a
  # network boundary, so it still needs the proxy + NetworkPolicy to confine egress.
  egressProxy:
    enabled: true
    image:
      repository: egress-proxy
      tag: ""
    replicaCount: 1
    # Override the egress URL wired into forge. Empty = the in-cluster proxy this chart
    # deploys (http://<release>-forge-egress-proxy:3128).
    url: ""
    # Egress policy for sandbox traffic through the proxy. Default is "*", the
    # public-only sentinel: runners may reach ANY public host, while the proxy's IP
    # guard still blocks loopback/private/link-local/cloud-metadata addresses — so they
    # get the public internet but never cluster-internal services. To restrict instead,
    # set a comma-separated allowlist of exact hosts ("github.com") and "*.example.com"
    # subdomain wildcards (e.g.
    # "registry.terraform.io,github.com,*.github.com,registry.npmjs.org,pypi.org,files.pythonhosted.org,proxy.golang.org,sum.golang.org").
    # Empty = block all egress.
    allowedDomains: "*"
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    # Enforce egress confinement with a NetworkPolicy on the sandbox Job pods so a
    # malicious process cannot bypass the proxy and connect out directly. Only applies
    # to the kubernetes runtime (where forge runs sandbox Jobs) and requires a
    # NetworkPolicy-aware CNI; inert otherwise.
    networkPolicy:
      enabled: true
      # Allow sandboxes to reach the artifact store DIRECTLY (that service's pods, on
      # its port only) so forge/save-artifact and forge/restore-artifact work. It has to
      # be direct: the proxy refuses to dial any private address and the store is a
      # ClusterIP, so forge puts it in the sandbox's NO_PROXY. This is the one internal
      # service a sandbox may talk to; set false to deny it and give up artifact
      # caching. Access is still authenticated per user by the token forge mints.
      allowArtifacts: true
      # Allow sandboxes to reach the base-image mirror directly (that pod, on its port
      # only) so image builds pull their base — and their kaniko layer cache — from
      # in-cluster instead of the public internet. Same narrow shape and same reason it
      # cannot go through the proxy. Set false to deny it: builds then fall back to the
      # origin registry, which still works but re-exposes them to its rate limits.
      allowRegistryMirror: true
      # Allow sandboxes to reach the in-cluster git-factory directly (that pod, on its
      # port only) so a run can push its work and open a dev PR. Same narrow shape and
      # same reason it cannot go through the proxy; every operation is authenticated per
      # user by the gatekeeper run-token the git: secret_ref mints. Set false to deny it.
      allowGitFactory: true
  # Run sandbox jobs in hardware-isolated kata (Cloud Hypervisor) microVMs. When true:
  #   - forge runs RUNTIME=kata (env.k8sRuntimeClass MUST be set to the VM-isolating
  #     RuntimeClass, e.g. "kata", or the chart fails to render);
  #   - the egress PROXY is skipped (the microVM's kernel is the isolation boundary, so
  #     runners don't need to be forced through the proxy) — but a public-only egress
  #     NetworkPolicy is still applied (see kata.egress) so the VM boundary doesn't leave
  #     cluster-internal / metadata IPs reachable;
  #   - forge seeds its default runner classes privileged (root + writable rootfs), since
  #     the VM — not the container — is the isolation boundary.
  # Mutually exclusive with forge.gvisor.enabled.
  kata:
    enabled: false
    # Egress confinement for kata sandbox pods. A kata microVM is a KERNEL/VM boundary,
    # not a network one: on its own a kata pod keeps the pod network's full reach, so
    # untrusted code could still hit cluster services or the 169.254.169.254 cloud-metadata
    # endpoint. This NetworkPolicy closes that: it allows egress to ALL public IPs and
    # blocks every private/internal range (RFC1918 10/8·172.16/12·192.168/16, loopback
    # 127/8, link-local/metadata 169.254/16, CGNAT 100.64/10) plus anything in `blocklist`,
    # while still permitting DNS. IPv4 only — IPv6 egress is denied.
    #
    # ⚠ REQUIRES A NETWORKPOLICY-AWARE CNI, AND FAILS SILENTLY WITHOUT ONE. A
    # NetworkPolicy is only a request to the CNI: if the cluster's CNI does not implement
    # NetworkPolicy — kindnet (kind's default), flannel, and some managed "basic" network
    # add-ons do not — Kubernetes still accepts and displays the object, `kubectl get
    # networkpolicy` shows it looking entirely correct, and NOTHING is enforced. Under
    # kata this policy is the ONLY thing between a sandbox and your internal network
    # (the microVM is a kernel boundary, not a network one), so on such a cluster
    # untrusted sandbox code reaches every in-cluster service — Services, ClusterIPs and
    # pod IPs alike — with no signal that the control is doing nothing.
    #
    # DO NOT ASSUME — VERIFY: `helm test <release>` runs a probe (tests.forgeExecEgress)
    # that is selected by this very policy and tries a connection the policy claims to
    # deny; it fails the test if the connection succeeds. Run it on every cluster you
    # deploy to, and after any CNI change. The same caveat applies to any FUTURE
    # tightening of sandbox egress: on a non-enforcing CNI a stricter policy is exactly
    # as inert as this one.
    egress:
      networkPolicy:
        enabled: true
      # Private ENDPOINTS a build may egress to despite the private-range denial —
      # e.g. a self-hosted image registry the CI pushes to. Each entry is
      # "<ip>[/cidr]:<port>" and opens ONLY that port (not the whole host, so SSH and
      # other services on the box stay blocked). e.g. ["192.168.53.171:3000"].
      allowHosts: []
      # Extra CIDRs to DENY on top of the built-in private ranges — e.g. specific public
      # IPs/subnets you don't want sandboxes reaching. Each must be an IPv4 CIDR within
      # 0.0.0.0/0, e.g. "203.0.113.7/32" or "198.51.100.0/24".
      blocklist: []
      # Allow sandboxes to reach the artifact store (that service's pods, on its port
      # only) so forge/save-artifact and forge/restore-artifact work. This is the one
      # internal service a sandbox may talk to; set false to deny it and give up
      # artifact caching. Access is still authenticated per user — a step can only
      # touch artifacts the token you wire into it allows.
      allowArtifacts: true
      # Allow sandboxes to reach the base-image mirror (that pod, on its port only) so
      # image builds pull their base locally instead of from the public internet. Same
      # narrow shape as allowArtifacts. Set false to deny it: builds then fall back to
      # pulling from the origin registry, which still works but re-exposes them to that
      # registry's rate limits.
      allowRegistryMirror: true
      # Allow sandboxes to reach the in-cluster git-factory (that pod, on its port only)
      # so a run can push its work and open a dev PR. Per-user authenticated by the
      # gatekeeper run-token the git: secret_ref mints. Set false to deny it.
      allowGitFactory: true
  # Run sandbox jobs under gVisor (handler "runsc"): a userspace kernel (the Sentry)
  # intercepts each job's syscalls, giving strong isolation WITHOUT any hardware
  # virtualization — choose it over kata when nodes lack nested virt / /dev/kvm. When true:
  #   - forge runs RUNTIME=gvisor (env.k8sRuntimeClass MUST be set to the gVisor
  #     RuntimeClass, e.g. "gvisor", or the chart fails to render);
  #   - the egress proxy + NetworkPolicy are KEPT (gVisor is a kernel boundary, not a
  #     network one, so it does not confine egress on its own);
  #   - forge seeds its default runner classes privileged (root + writable rootfs), since
  #     the gVisor Sentry — not the host kernel — contains the job's root.
  # Mutually exclusive with forge.kata.enabled.
  gvisor:
    enabled: false

# ── Workflows ─────────────────────────────────────────────────────────────────
# CI/CD pipeline orchestration — the other half of the core CI/CD pair (with forge).
# Sequences forge executions (and any other registered service) into runs.
workflows:
  enabled: true
  image:
    repository: workflows
    tag: ""
  replicaCount: 1
  port: 8085
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    logLevel: info
    # Comma-separated "name=url" pairs of services that workflow steps may call.
    # Defaults to "forge=http://<fullname>-forge:8083" (the core step target) when
    # left empty. Override to add non-core targets (e.g. blueprints) that builder
    # has deployed and registered, or to change URLs.
    services: ""
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed from the postgresql subchart when left empty.
    databaseUrl: ""
    # Must match the workflows entry in gatekeeper.secret.gatekeeperServices.
    # Auto-generated on first install and preserved across upgrades. Leave empty for auto-generation.
    gatekeeperServiceKey: ""
    # Shared HMAC authenticating the events service's internal pipeline dispatch and run
    # polling. Auto-synced from events.secret.eventsTriggerKey. Leave empty for auto-generation.
    eventsTriggerKey: ""
    # AES-256 key for encrypting run tokens at rest in the database.
    # Auto-generated on first install and preserved across upgrades. Leave empty for auto-generation.
    tokenKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Tickets ─────────────────────────────────────────────────────────────────
# Issue/task tracking. Source lives in the codearmory-tickets repo; the chart deploys
# its published image as a CORE service (registered via the registry manifest).
# ── Base-image mirror ───────────────────────────────────────────────────────
# An in-cluster registry holding the base images that builds pull FROM.
#
# The problem it solves: a matrix of image builds derives from the same handful of
# bases, so every leg pulls an identical base from the same public registry, from one
# egress IP, at the same moment. A public registry answers that burst with
# TOOMANYREQUESTS and the build dies — a red pipeline caused by nothing in the code.
#
# Why seeded rather than a pull-through proxy: registry:2's proxy mode cannot serve
# BLOBS from public.ecr.aws (it negotiates an "aws"-scoped token, and blob fetches come
# back "unauthorized: authentication required" while manifests succeed) — verified
# against 2.8.3. Seeding sidesteps the upstream's auth model entirely and is strictly
# better anyway: after the seed job, builds cause ZERO upstream pulls rather than one.
#
# Forge points builds here with kaniko's --registry-map, so no Dockerfile changes: a
# FROM stays public.ecr.aws/... and is remapped at build time (which also keeps the
# Dockerfiles buildable outside the platform). Kaniko falls back to the origin registry
# on a mirror miss, so an un-seeded or disabled mirror degrades to a direct pull rather
# than breaking builds.
registryMirror:
  enabled: true
  # 1 with the filesystem (RWO PVC) backend; raise it with the s3 backend, where storage
  # is shared and the mirror can scale horizontally behind its Service.
  replicaCount: 1
  # S3 storage driver (registry:2 native). Shared object storage removes the single-node
  # RWO pin, so the mirror can run multiple replicas. Point at the same MinIO / Ceph RGW
  # the artifacts store uses. When enabled, the PVC below is not created.
  s3:
    enabled: false
    bucket: ""
    region: us-east-1
    # Endpoint of a self-hosted S3 (empty = real AWS). e.g. http://minio:9000
    endpoint: ""
    forcePathStyle: "true"
    # false for an http (in-cluster) endpoint; true for https.
    secure: "false"
    accessKeySecret: ""
    accessKeySecretKey: access-key
    secretKeySecret: ""
    secretKeySecretKey: secret-key
  # A stock upstream registry; nothing codearmory-specific runs here.
  image:
    repository: public.ecr.aws/docker/library/registry
    tag: "2"
  port: 5000
  # Kaniko layer cache: a repo ON this mirror where image builds cache intermediate
  # layers (chiefly the `go mod download` layer, whose key is just the module set, so
  # it survives most commits). In-cluster, so no external traffic. Kaniko does not
  # evict — the cache grows until the mirror PVC is pruned — so it is opt-in.
  buildCache:
    enabled: true
    # Repository path on the mirror. registry:2 creates it on first push.
    repo: kaniko-cache
  # Registries remapped to this mirror, as kaniko's --registry-map:
  # "original.registry=mirror;other=mirror". {{ mirror }} is substituted with this
  # mirror's in-cluster host:port. Empty disables remapping (builds pull from origin).
  registryMap: "public.ecr.aws={{ mirror }}"
  # Base images seeded into the mirror on install/upgrade, as repository paths under
  # the mirrored registry. These are exactly the FROM lines used across the services;
  # a base that is NOT listed still builds, by falling back to the origin registry.
  seed:
    enabled: true
    # The registry the seed job copies FROM.
    source: public.ecr.aws
    images:
      - docker/library/golang:1.26.0-alpine3.23
      - docker/library/alpine:3.23.3
      - docker/library/node:22-alpine
    image:
      repository: quay.io/skopeo/stable
      tag: latest
  storage:
    # A PVC so the seed survives a restart. With this off the mirror is an emptyDir and
    # empties on every reschedule — builds still work (origin fallback), just unmirrored.
    enabled: true
    size: 10Gi
    # Empty uses the cluster default StorageClass.
    storageClass: ""
    retain: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Artifact store — named, user-owned blobs that OUTLIVE a run: a Go build cache to
# restore next time, a CLI binary to publish after the run that made it. Forge volumes
# are run-scoped and reaped, so without this there is nowhere for either to live.
artifacts:
  enabled: true
  image:
    repository: artifacts
    tag: ""
  replicaCount: 1
  port: 8097
  # The default per-user allowance, in megabytes. An admin overrides an individual
  # user at runtime (PUT /artifacts/quotas/user/{id}); this is the fallback for
  # everyone without an override. 0 blocks storage by default.
  defaultQuotaMB: 5120
  # Object-storage backend. When enabled, blobs live in an S3-compatible store shared
  # across nodes, so artifacts can run more than one replica — this removes the
  # single-node ReadWriteOnce pin of the PVC below. Point it at MinIO or Ceph RGW
  # (self-hosted S3) in a real environment; the PVC path is the single-node default.
  s3:
    enabled: false
    bucket: ""
    # Endpoint of a self-hosted S3 (empty = real AWS S3). e.g. http://minio:9000
    endpoint: ""
    region: us-east-1
    # MinIO and Ceph RGW need path-style addressing (bucket in the path). Real AWS
    # works either way; leave true unless you know you need virtual-host style.
    forcePathStyle: "true"
    # Static credentials, read from a Secret. Leave the secret name empty to use the
    # default AWS credential chain (IRSA / instance profile) on real AWS.
    accessKeySecret: ""
    accessKeySecretKey: access-key
    secretKeySecret: ""
    secretKeySecretKey: secret-key
  storage:
    # A PVC for the blobs (ignored when s3.enabled). Disable ONLY for a throwaway
    # environment: without it the
    # store is an emptyDir and every restart loses the cache, which defeats the point.
    enabled: true
    size: 20Gi
    # Empty uses the cluster default StorageClass.
    storageClass: ""
    mountPath: /data
    # Keep the PVC when the release is uninstalled — a cache is cheap to lose, a
    # published binary is not.
    retain: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed from the postgresql subchart when left empty.
    databaseUrl: ""
    # Must match the artifacts entry in gatekeeper.secret.gatekeeperServices.
    # Auto-generated on first install and preserved across upgrades.
    gatekeeperServiceKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

tickets:
  enabled: true
  image:
    repository: tickets
    tag: ""
  replicaCount: 1
  port: 8086
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed from the postgresql subchart when left empty.
    databaseUrl: ""
    # Must match the tickets entry in gatekeeper.secret.gatekeeperServices.
    # Auto-generated on first install and preserved across upgrades. Leave empty for auto-generation.
    gatekeeperServiceKey: ""
    # Shared HMAC signing tickets' lifecycle events to the events service.
    # Auto-synced from the events secret when present. Leave empty for auto-generation.
    eventsTriggerKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Wiki ─────────────────────────────────────────────
# Project source-of-truth wiki. DB-less: content lives in git (git-factory today,
# other git connector backends later), so history/diffs are git native. Model B —
# the wiki owns its <project>-wiki repos through a bot identity, so callers need only
# wiki permissions, never git-factory grants.
wiki:
  enabled: true
  image:
    repository: wiki
    tag: ""
  replicaCount: 1
  port: 8110
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
    # The bot account the wiki logs in AS to write project wikis (owns the <project>-wiki
    # repos in its own namespace). Provisioned once at deploy.
    botEmail: "wiki-bot@codearmory.local"
    # The namespace the bot owns, where <project>-wiki repos are created (the bot's own).
    namespace: "codearmory-wiki-bot"
  secret:
    # Must match the wiki entry in gatekeeper.secret.gatekeeperServices.
    # Auto-generated on first install and preserved across upgrades. Leave empty for auto-generation.
    gatekeeperServiceKey: ""
    # The wiki bot's login password (set at provisioning, when the bot account is created).
    botPassword: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Blacksmith ───────────────────────────────────────
# The agent harness: ONE general `blacksmith/agent` action the workflows engine
# invokes to run a configured agent (roles are editable data in postgres). It
# reaches ollama as a remote OpenAI endpoint on the workstation (the host bound
# to the codearmory bridge, 192.168.67.1) and everything else over in-cluster
# DNS. Runs the plan pipeline; the sandbox that executes agent code is a forge
# execution, not a local container.
blacksmith:
  enabled: true
  image:
    repository: blacksmith
    # A locally-built image loaded with `minikube image load
    # ghcr.io/code-armory-app/blacksmith:dev`; imagePullPolicy IfNotPresent finds
    # it without reaching ghcr.
    tag: dev
  replicaCount: 1
  port: 8199
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    logLevel: info
    # OTLP collector on the workstation (deploy/observability docker-compose),
    # reached over the codearmory bridge — grafana/tempo at localhost:3000/3200.
    otelEndpoint: "http://192.168.67.1:4318"
    # ollama on the workstation, reached over the codearmory bridge.
    modelEndpoint: "http://192.168.67.1:11434/v1"
    model: "qwen3.8:latest"
    slots: 1
    forgeEmail: "admin@blacksmith.invalid"
    runnerImage: "golang:1.25"
    runnerClass: "large"
  secret:
    # Secrets are NOT stored here — pass at install with
    #   --set blacksmith.secret.registryServiceKey=... --set blacksmith.secret.forgePassword=...
    # so no credential lands in the committed chart.
    registryServiceKey: ""
    forgePassword: ""

# ── Events ───────────────────────────────────────────
# Event collector + reactor (supersedes the former hooks service): services emit JSON events to
# /internal/events; triggers whose field-filters match dispatch actions (run a
# pipeline, open a ticket, notify, ...). Also hosts the inbound webhook adapters
# (generic, git, Forgejo/Gitea, GitHub App).
events:
  enabled: true
  image:
    repository: events
    tag: ""
  replicaCount: 1
  port: 8093
  service:
    type: ClusterIP
    nodePort: ""
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    databaseUrl: ""
    gatekeeperServiceKey: ""
    # Shared HMAC authenticating emitters posting to /internal/events and signing
    # events' internal calls. Must match what emitters sign with AND what workflows
    # verifies trigger calls with (workflows.secret.eventsTriggerKey). Leave empty to
    # derive the same value workflows uses.
    eventsTriggerKey: ""
    # Secret configured on the git provider's webhook (GitHub/Gitea/Forgejo). events
    # verifies the provider HMAC on the public POST /hooks, /hooks/git and /hooks/gitea
    # against it. Leave empty to keep those endpoints closed — it is never auto-generated,
    # since the provider must be configured with the same value.
    webhookSecret: ""
  # Optional GitHub App. Setting appId registers POST /hooks/github, which normalises
  # GitHub deliveries into events AND reports each triggered pipeline run back as a check
  # run on the pushed commit. privateKey and webhookSecret are required alongside it —
  # events refuses to start with an app id but no webhook secret rather than accepting
  # unverified deliveries. The App's webhook secret is its own, distinct from
  # secret.webhookSecret above (which keys the non-App endpoints).
  githubApp:
    appId: ""
    # PEM contents of the App's private key (PKCS1 or PKCS8).
    privateKey: ""
    webhookSecret: ""
    # GitHub Enterprise Server: https://<host>/api/v3. Empty uses api.github.com.
    apiUrl: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Outpost gateway ───────────────────────────────────────────────────────────
# Connection point + event backbone for user-deployed outposts (in-cluster agents that
# actuate a target cluster — e.g. the deploy module that redeploys a workload). Off by
# default; enable to run outposts. The user-facing /outposts API is gatekeeper-authed
# via conductor; outposts dial the /outpost/* endpoints with per-outpost keys, and
# consumers use the internal HMAC key.
outpostGateway:
  enabled: false
  image:
    repository: outpost-gateway
    tag: ""
  replicaCount: 1
  port: 8092
  service:
    # ClusterIP for same-cluster outposts; NodePort/Ingress to reach it from a remote
    # cluster's outpost.
    type: ClusterIP
    nodePort: ""
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
    # integration=url,... — where the gateway delivers each integration's events.
    # Empty is fine: events are still recorded, just not fanned out to a consumer.
    eventConsumers: ""
  secret:
    databaseUrl: ""
    gatekeeperServiceKey: ""
    # Shared HMAC for the internal command/event plane. Auto-derived; leave empty.
    internalKey: ""

# ── Git ───────────────────────────────────────────────────────────────────────
# Backend-agnostic git credential broker — mints short-lived clone credentials for
# linked backends (GitHub, GitLab, Forgejo, generic). In-repo GORM CORE service.
git:
  enabled: true
  image:
    repository: git
    tag: ""
  replicaCount: 1
  port: 8096
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed from the postgresql subchart when left empty.
    databaseUrl: ""
    # Must match the git entry in gatekeeper.secret.gatekeeperServices.
    # Auto-generated on first install and preserved across upgrades. Leave empty for auto-generation.
    gatekeeperServiceKey: ""
    # REQUIRED: encrypts linked-backend credentials at rest. The service refuses to
    # start without it. Auto-generated on first install and preserved across upgrades
    # (so early-encrypted rows stay decryptable). Set a managed key for production.
    gitEncryptionKey: ""
    # Shared HMAC secret authenticating forge → git /internal/clone-token calls.
    # forge derives the same key; leave empty for auto-generation (both sides agree).
    gitInternalKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── git_factory ───────────────────────────────────────────────────────────────
# The git plane: it stores the bare repositories themselves and serves them over
# Smart HTTP, so it is the one core service that holds user data on disk rather than
# only in Postgres. A CORE service deployed by this chart (it used to be deployed at
# runtime by builder). The git_connector broker above talks to it over the internal
# key; conductor fronts its JSON API; git clients hit the Ingress at the bottom of
# this block directly, because Smart HTTP is not something conductor can proxy.
gitFactory:
  enabled: true
  image:
    repository: git-factory
    tag: ""
  # 1 is correct for the DEFAULT storage below (ReadWriteOnce), and raising it against
  # RWO is refused at render time: git has no cross-node write locking, so a second
  # replica either never schedules or becomes a second writer and corrupts objects.
  #
  # It is no longer a permanent pin. On shared storage (persistence.accessMode:
  # ReadWriteMany, backed by a filesystem with real atomic O_CREAT|O_EXCL, atomic rename
  # and ENFORCED flock — see the accessMode notes below) git pods are stateless compute
  # and this may be raised. ARCHITECTURE §5 Step 2 records the measurement behind that,
  # and infra/local/juicefs/ is a worked example with the cross-pod checks scripted.
  #
  # Before raising it, two things must be true, and the chart checks both:
  #   * accessMode is ReadWriteMany;
  #   * env.refLockMaxAge is not "0" — shared storage widens an abandoned ref lock from
  #     one host to all pods rather than fixing it.
  replicaCount: 1
  # Autoscaling is legal only on shared storage, and is refused at render time otherwise
  # (an HPA scaling to a second writer on an RWO store is the same hazard as setting
  # replicaCount > 1, but it appears later, under load).
  #
  # What made it safe at all is that the periodic repack/janitor sweep now takes a
  # cluster-wide lease rather than running in every replica — see git-factory/lease.go.
  # An older image without that lease will sweep the whole store once per replica per
  # interval, so an autoscaler multiplies the maintenance load by the replica count.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  port: 9002
  persistence:
    # ONE STORE, ONE DEPLOYMENT. The target architecture is sharded shared storage —
    # several filesystems, each with its own metadata engine and bucket, each served by
    # its own pods — and this block cannot express that: it describes a single claim.
    #
    # Deliberately not modelled yet. The service binds a shard to a mount before the
    # chart can usefully render one Deployment per shard; rendering it first would emit a
    # topology nothing knows how to route to. A single-shard install is exactly what this
    # block already describes, and it is what every install runs today.
    #
    # The bare repos. Disable ONLY for a throwaway install: without a PVC the store is
    # an emptyDir and a restart destroys every pushed commit.
    enabled: true
    size: 20Gi
    # Empty uses the cluster default StorageClass. To put the repo store on SHARED
    # storage (ARCHITECTURE §5 Step 2), name a StorageClass backed by JuiceFS here and
    # set accessMode to ReadWriteMany — see the notes on both fields below.
    storageClass: ""
    # Use a PVC that already exists instead of letting the chart create one. This is the
    # normal way to attach a JuiceFS volume: the JuiceFS CSI driver, its metadata engine
    # (Redis + Sentinel) and its object-storage backend are cluster-wide infrastructure with
    # their own lifecycle, and binding their deletion to a `helm uninstall` of this
    # release is not a trade anyone wants to make. When set, no PVC is rendered and
    # size/storageClass/retain are ignored.
    existingClaim: ""
    # ReadWriteOnce (the default) means one pod owns the bytes, which is why
    # replicaCount is pinned to 1 and the rollout strategy is Recreate.
    #
    # ReadWriteMany is what makes replicaCount > 1 legal, and it is ONLY safe on a
    # filesystem that genuinely provides atomic O_CREAT|O_EXCL, atomic rename and working
    # flock across clients — that is git's entire safety model. JuiceFS provides them;
    # object storage mounted through FUSE (s3fs, gcsfuse, Mountpoint, rclone) does not,
    # and corrupts repositories rather than merely being slow. The service runs a startup
    # preflight for exactly this (env.storagePreflight below), but it can only verify the
    # properties locally — confirming they hold ACROSS pods is a deployment check.
    # infra/local/juicefs/ is a worked example of the whole arrangement (CSI driver,
    # metadata engine, object store, RWX claim) with that cross-pod check scripted.
    #
    # Before running more than one replica, also make sure the stale ref-lock janitor is
    # on (env.refLockMaxAge). Shared storage does not fix an abandoned lock file; it
    # widens it from one host to all of them.
    accessMode: ReadWriteOnce
    # Mount path, exported to the service as GIT_STORAGE_ROOT.
    mountPath: /var/lib/git-factory
    # Keep the PVC (and the repos) when the release is uninstalled. Pushed source is not
    # recoverable from anywhere else.
    retain: true
    # fsGroup makes kubelet fix ownership of the volume so the non-root container can
    # write to it — required on a freshly provisioned block PVC, where the root is owned
    # by root and `git init --bare` would otherwise fail on the very first repo.
    #
    # Set this to false for a JuiceFS (or any shared/FUSE) mount. The volume there is
    # already owned correctly by the CSI driver, and the ownership pass is a RECURSIVE
    # chown over the whole repo store: on a metadata-engine filesystem each chown is a
    # transaction, so on a large store it turns pod startup into a long outage — and
    # every replica repeats it. OnRootMismatch limits it to the case where the root's
    # group is wrong, which is exactly the case a shared mount can hit.
    fsGroup: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    logLevel: info
    otelEndpoint: ""
    # Public base URL of the git plane — what the API reports as a repo's clone URL, so
    # it must be an address a git client OUTSIDE the cluster can reach. Left empty it is
    # derived from the first ingress host below (https when ingress.tls is set), which is
    # normally what you want; set it explicitly when something else (an external LB, a
    # different path prefix) fronts the service.
    gitHttpBaseUrl: ""
    # Per-repo size ceiling in MB; a push that would exceed it is rejected.
    # Empty/0 leaves repos unlimited.
    repoQuotaMB: ""
    # How often the repack (git maintenance) sweep runs, as a Go duration e.g. "6h".
    # Empty uses the service's own default of 1h; "0" disables it.
    #
    # Every replica ticks on this interval, but only the one holding the sweep lease
    # does any work (git-factory/lease.go) — so this is how often the STORE is swept,
    # not how often each pod sweeps it.
    maintenanceInterval: ""
    # How long the maintenance sweep lease is granted for, as a Go duration.
    #
    # It is NOT a budget for the sweep: the holder renews while it works, so a sweep
    # may run as long as it needs. It is how long the sweep stays blocked after a
    # holder dies WITHOUT releasing — a pod OOM-killed mid-sweep leaves the lease held
    # until it expires, and no other replica will sweep before then.
    #
    # Shorter means faster takeover and more renewal traffic against the database
    # (the holder renews at a third of this). Keep it well under maintenanceInterval,
    # so a lost holder costs at most one skipped tick; the service's own default of 5m
    # is sized against the default 1h interval. Empty uses that default.
    maintenanceLeaseTTL: ""
    # How long a git .lock file may sit untouched before the janitor treats it as
    # abandoned and clears it, as a Go duration. A lock left by a pod that was killed
    # mid-push blocks that ref from every pod until it is removed, and nothing can
    # distinguish it from a push in flight — only its age.
    #
    # Raise it, never lower it casually. Too long leaves a ref unpushable until the
    # next sweep and the error names the file; too short silently loses a write,
    # because unlinking a live lock does not fail the holder. Must exceed the longest
    # a single git process can hold a lock, which is a repack of your largest repo (or
    # a slow pre-receive hook), not the time a push spends on the wire.
    #
    # Empty uses the service's own default of 1h. "0" disables the janitor.
    refLockMaxAge: ""
    # Startup verification of the repo store (ARCHITECTURE §5). git's correctness rests
    # on atomic O_CREAT|O_EXCL, atomic rename and working flock; a filesystem missing
    # them corrupts repositories instead of returning errors, so the service checks
    # before it can accept a push.
    #
    #   "" / enforce — refuse to start if a property is missing (default, and correct:
    #                  a false negative is one loud error, continuing is silent corruption)
    #   warn         — log the failures and start anyway
    #   off          — skip the checks
    #
    # Leave it alone unless a check is wrong about your storage. It matters most on the
    # shared-storage path, where the whole point is that the service cannot tell from
    # the inside that GIT_STORAGE_ROOT now means something entirely different.
    storagePreflight: ""
    # Comma-separated gatekeeper user ids permitted as a createPull `author` override,
    # letting a workflow attribute a PR it opens (with its own per-run repo credential)
    # to a bot display account without that account holding any credential or grant.
    # Attribution only; the real caller stays authorised and recorded. Empty disables it.
    automationUsers: ""
  secret:
    # PostgreSQL DSN. Auto-constructed from the postgresql subchart when left empty.
    databaseUrl: ""
    # Optional read-replica DSN. Read-only queries use it when set.
    databaseReadUrl: ""
    # Must match the codearmory_git_factory entry in gatekeeper.secret.gatekeeperServices.
    # Auto-generated on first install and preserved across upgrades. Leave empty for auto-generation.
    gatekeeperServiceKey: ""
    # Shared secret authenticating git_connector → git_factory /internal/mirrors and
    # /internal/clone-token (the X-Internal-Key header). git derives the same key;
    # leave empty for auto-generation (both sides agree).
    gitFactoryInternalKey: ""
    # HMAC key for the short-lived read-only clone tokens handed to runners. Signed and
    # verified only inside git_factory, so it is shared with nothing. Leave empty for
    # auto-generation.
    cloneTokenKey: ""
    # Shared HMAC that signs git_factory's push events to the events service; events and
    # workflows must carry the identical value or push-triggered pipelines 401.
    # Auto-derived from the events/workflows secrets. Leave empty for auto-generation.
    eventsTriggerKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""
  # A git client speaks Smart HTTP to this service directly — conductor fronts the JSON
  # API but cannot carry the wire protocol — so cloning/pushing from outside the cluster
  # needs this Ingress. Without it the git plane is reachable only in-cluster.
  ingress:
    enabled: false
    className: ""
    # Defaults sized for git rather than JSON: a push uploads the whole packfile in
    # one request body (proxy-body-size 0 = unlimited) and both fetch and push are
    # long-lived streams, so the buffering and short timeouts an API ingress is happy
    # with truncate clones and reject pushes. Keys are nginx-ingress annotations;
    # substitute the equivalents when running another controller.
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    hosts:
      - host: git.codearmory.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

# ── Containers ──────────────────────────────────────────────────────────────
# Container image registry management. Stateless (no DB). Source lives in the
# codearmory-containers repo; the chart deploys its published image as a CORE service.
containers:
  enabled: true
  image:
    repository: containers
    tag: ""
  replicaCount: 1
  port: 8089
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    # Base URL of the upstream registry to seed as the default on first boot.
    # Points at the in-cluster registry mirror so the Containers page has a
    # registry without a manual /registries call (set live before; now persisted).
    registryUrl: "http://codearmory-registry-mirror:5000"
    # Display name for the seeded default registry.
    registryName: "mirror"
    # Optional registry basic-auth username (password goes in secret.registryPassword).
    registryUsername: ""
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed from the postgresql subchart when left empty.
    databaseUrl: ""
    gatekeeperServiceKey: ""
    # Optional registry basic-auth password.
    registryPassword: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Builder ───────────────────────────────────────────────────────────────────
# Org-level service control plane: org admins enable/disable/configure services
# for their org. A null/"default" org is the baseline every org inherits.
builder:
  enabled: true
  image:
    repository: builder
    tag: ""
  replicaCount: 1
  port: 8095
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  # ServiceAccount + Role granting the reconciler rights to manage Deployments and
  # Services in this namespace. Required when reconcile.enabled is true.
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # Phase 2 reconciler: an instance admin enabling a non-core service (in the
  # default/admin scope) makes builder deploy it; disabling tears it down. On by
  # default because this chart deploys only the core services and relies on builder
  # to bring up the rest on demand. Fails soft if the cluster is unreachable, so a
  # non-k8s/dev deploy is unaffected. Requires serviceAccount.create (the deploy RBAC).
  reconcile:
    enabled: true
    interval: 30s
    # Namespace to deploy workloads into. Empty = the release namespace (the pod's
    # own namespace, via the downward API).
    targetNamespace: ""
    # Name prefix for created workloads (Deployment/Service codearmory-<svc>). Empty
    # = the chart fullname, so they slot into the existing Service routing.
    releasePrefix: ""
    # Registry/tag builder composes images from for the NON-CORE services it deploys,
    # when the service itself pins neither. Empty = the chart-wide imageRegistry /
    # imageTag, which is the historical behaviour.
    #
    # Set these when builder-deployed services publish somewhere other than this
    # chart's own images. That is the common case rather than the exception: the
    # chart-wide registry names the core images the release ships, while a spun-off
    # service, a fork, or an image built straight onto the node lives wherever its own
    # pipeline pushes. When the two diverge, every reconcile that falls through to the
    # composed default produces an unpullable reference — and because a reconcile
    # applies builder's desired state to a RUNNING workload, that takes the service
    # down rather than merely failing to start it.
    #
    # Per-service registry/tag/image (builder's API, or the codearmory_org_service
    # Terraform resource) override these and are what a CD pipeline should set; these
    # are the floor for anything that does not.
    imageRegistry: ""
    imageTag: ""
    # Replica floor for every builder-managed (non-core) workload. Builder always sets
    # a surge-first rollout strategy (maxUnavailable:0, maxSurge:1); at ≥2 it also
    # creates a PodDisruptionBudget (minAvailable = replicas-1) so node drains can't
    # take it below the floor. 0/empty keeps the historical single replica. A
    # per-service override is the "replicas" key in that service's builder config.
    defaultReplicas: 2
    # Periodic rolling restart of every managed workload, restoring pods to the image
    # to shed drift or a compromised process. Go duration (e.g. "30m", "1h"); honoured
    # via a bucketed pod-template annotation, so it rolls once per interval, not every
    # reconcile. Empty disables it. Per-service override: the "rotateInterval" config key.
    rotateInterval: "30m"
  # How builder-deployed (non-core) services obtain their DATABASE_URL. Selected
  # globally; a service may override it with its "dbBackend" config key. The default
  # (manual) is unchanged — the admin PUTs a per-service db_url that builder encrypts
  # and stores. The other backends either provision the database (sql) or remove
  # builder from credential custody entirely (cnpg/external). Backend-specific blocks
  # are consulted only for the backend(s) in use. See docs/builder/db-provisioning.md.
  db:
    # manual | sql | cnpg | external
    backend: manual
    # sql: builder runs CREATE DATABASE/ROLE once at enable via a maintenance
    # connection, then stores the derived URL like a manual one.
    sql:
      # CREATEDB/CREATEROLE maintenance URL for unattended re-provisioning. Leave
      # empty for ephemeral mode (supplied per enable request, never persisted —
      # recommended). When set it is written to the builder Secret as a crown-jewel
      # credential. Honoured via secret key db-sql-maintenance-url.
      maintenanceUrl: ""
      # false = CREATEDB-only profile: reuse ownerRole instead of minting a
      # per-service svc_<service> role (avoids the sharp CREATEROLE privilege).
      createRole: true
      # Owner role for the CREATEDB-only profile (createRole=false). Its password is
      # the secret key db-sql-owner-password.
      ownerRole: ""
      ownerPassword: ""
      # sslmode forced onto derived URLs (e.g. "require"). Empty = leave unset.
      sslMode: ""
    # cnpg: provision via the CloudNativePG operator's Database CR; DATABASE_URL
    # points at an operator-owned Secret. Builder holds only k8s RBAC on the CR.
    cnpg:
      cluster: ""
      # Namespace of the CNPG Cluster/Database CRs. Empty = the workload namespace.
      namespace: ""
      # Secret-name template for the connection credential; {cluster}/{service} expand.
      credSecretTemplate: ""
      # Key in that Secret holding the connection string.
      credKey: "uri"
    # external: builder creates an ExternalSecret (External Secrets Operator) pointing
    # at a store path the admin populated (e.g. a Vault DB engine). ESO materializes
    # the Secret; builder holds only the reference.
    external:
      storeRef: ""
      # SecretStore | ClusterSecretStore
      storeKind: SecretStore
      # Remote path template; {service} expands (e.g. "codearmory/{service}/db").
      pathTemplate: ""
      # Property within the remote secret holding the URL. Empty = whole value.
      property: ""
      # ExternalSecret refreshInterval (e.g. "1h"). Empty = operator default.
      refresh: ""
      # ExternalSecret API version.
      apiVersion: v1beta1
  secret:
    databaseUrl: ""
    gatekeeperServiceKey: ""
    registryServiceKey: ""
    # Shared with gatekeeper's org-service disable-gate. Leave empty for auto-sync.
    internalKey: ""
    # AES-256-GCM key (64 hex chars) encrypting admin-supplied per-service DB URLs.
    # Auto-generated on first install and preserved across upgrades; rotating it
    # orphans stored URLs. Leave empty for auto-generation.
    secretsKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Integration tests (helm test) ────────────────────────────────────────────
# Run with: helm test <release>
# Each suite maps to a test image built from tests/<suite>/Dockerfile.
# Image tags fall back to the top-level imageTag when left empty.
tests:
  gatekeeper:
    enabled: true
    image:
      repository: test-gatekeeper
      tag: ""
    # DATABASE_URL for post-test cleanup. Auto-constructed from postgresql when empty.
    databaseUrl: ""
  conductor:
    enabled: true
    image:
      repository: test-conductor
      tag: ""
    # DATABASE_URL for post-test cleanup (targets the gatekeeper db).
    # Auto-constructed from postgresql when empty.
    databaseUrl: ""
  registry:
    enabled: true
    image:
      repository: test-registry
      tag: ""
  # Verifies that the forge-exec egress NetworkPolicy is actually ENFORCED by this
  # cluster's CNI, rather than merely present in the API. Runs a probe Pod labelled
  # app=forge in the exec namespace — so the policy selects it exactly as it selects a
  # sandbox — and tries to reach an in-cluster address the policy denies. Reaching it
  # fails the test: the control is inert (see forge.kata.egress). Rendered whenever
  # either forge-exec egress policy is (kata mode, or the proxy-confining policy).
  #
  # The probe reports FAILURE for anything it could not positively establish, so it
  # never passes for the wrong reason: it first proves it can reach an address the
  # policy ALLOWS, resolves the target by name, and requires the denied connection to be
  # silently dropped rather than refused. See the template for the full reasoning:
  # templates/tests/forge-exec-egress-test.yaml
  forgeExecEgress:
    enabled: true
    # Any image with busybox's nc, nslookup and date. Pulled as written (NOT prefixed
    # with imageRegistry) — override for an air-gapped cluster or a private mirror.
    image: busybox:1.36
    # Address the policy must deny. Empty = the gatekeeper Service, which is always
    # deployed, is always up (forge will not start without it), and is denied by both
    # policies. Override only if you have a better always-on internal target; it must be
    # an in-cluster address the policy genuinely denies (under kata: a private IP).
    target: ""
    targetPort: ""
    # Address the policy must ALLOW, used as the probe's positive control. Empty = the
    # first nameserver in /etc/resolv.conf on port 53 (both policies allow DNS). Point
    # it elsewhere (e.g. the egress proxy on 3128) if your resolver refuses TCP.
    controlHost: ""
    controlPort: 53
    # Seconds to wait on the denied connection. A dropping CNI makes it hang this long.
    connectTimeoutSeconds: 6
    # A denied connection must take at least this long to fail. A faster failure is a
    # refusal (RST) — a dead target or a CNI that rejects instead of dropping — which
    # proves nothing, and is reported as inconclusive (a failure). Set 0 to accept any
    # failure as a pass, only after verifying enforcement by hand.
    minDropSeconds: 3
    # Run the probe under the sandbox RuntimeClass and on the sandbox nodes
    # (forge.env.k8sRuntimeClass, forge.execScheduling), so it measures the path
    # sandboxes actually take. Set false if those nodes cannot admit the probe — the
    # answer is then a little weaker but still worth having.
    useSandboxRuntime: true
# ── PostgreSQL (Bitnami subchart) ─────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    # Superuser password. Leave empty to let the subchart auto-generate a random
    # password on first install (stored only in the cluster Secret, never in git).
    # Set explicitly only if you need a specific password or are migrating an
    # existing cluster. For production, create per-service users with explicit databaseUrl.
    postgresPassword: ""
    # Leave username/password empty to use the postgres superuser.
    username: ""
    password: ""
  primary:
    initdb:
      scripts:
        # Only the CORE service databases (incl. the forge + workflows CI/CD pair and the
        # DB-backed tickets + git + git_factory core members; containers is stateless).
        # Non-core services (incl. gitea_integration, now builder-deployed) are deployed
        # by builder with an admin-supplied db_url (HA Postgres / Neon / managed), so the
        # bundled subchart never provisions theirs.
        init.sql: |
          CREATE DATABASE gatekeeper;
          CREATE DATABASE registry;
          CREATE DATABASE builder;
          CREATE DATABASE forge;
          CREATE DATABASE workflows;
          CREATE DATABASE tickets;
          CREATE DATABASE git;
          CREATE DATABASE git_factory;
          CREATE DATABASE artifacts;
          CREATE DATABASE events;
          CREATE DATABASE outpost_gateway;
          CREATE DATABASE containers;
          CREATE DATABASE blacksmith;
    # Bumped from the subchart's 192Mi default: under load (registry ingesting the whole
    # manifest on cold boot) 192Mi OOM-kills postgres, whose slow recovery then crash-loops
    # registry AND git-factory until the DB warms. 1Gi keeps cold starts healthy.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
