# ── Gitea integration ─────────────────────────────────────────────────────────
giteaIntegration:
  enabled: false
  deploy: false  # deployed on demand by builder (Phase 2), not by Helm
  image:
    repository: gitea_integration
    tag: ""
  replicaCount: 1
  port: 8088
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed when left empty.
    databaseUrl: ""
    # Base URL of your Forgejo/Gitea instance, e.g. https://git.example.com
    # Required when giteaIntegration.enabled is true.
    giteaUrl: ""
    # Admin API token for the Forgejo/Gitea instance.
    # Required when giteaIntegration.enabled is true.
    giteaAdminToken: ""
    # Must match the gitea_integration entry in gatekeeper.secret.gatekeeperServices.
    # Auto-generated on first install and preserved across upgrades. Leave empty for auto-generation.
    gatekeeperServiceKey: ""
    # Shared key authenticating forge → /internal/clone-token (resolves
    # "gitea:<owner>/<repo>" job secret_refs). The forge deployment reads this same
    # secret, so the two always match. Auto-generated and preserved; leave empty.
    # NOTE: when global.externalSecrets is true the chart does not create this
    # Secret — your externally-managed "<release>-gitea-integration" Secret MUST
    # include a "gitea-internal-key" entry, or both the gitea-integration and forge
    # pods will fail to start (CreateContainerConfigError).
    internalKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Integration tests (helm test) ────────────────────────────────────────────
# Run with: helm test <release>
# Each suite maps to a test image built from tests/<suite>/Dockerfile.
# Image tags fall back to the top-level imageTag when left empty.
tests:
  gatekeeper:
    enabled: true
    image:
      repository: test-gatekeeper
      tag: ""
    # DATABASE_URL for post-test cleanup. Auto-constructed from postgresql when empty.
    databaseUrl: ""
  blueprints:
    # Also requires blueprints.enabled to be true.
    enabled: true
    image:
      repository: test-blueprints
      tag: ""
  conductor:
    enabled: true
    image:
      repository: test-conductor
      tag: ""
    # DATABASE_URL for post-test cleanup (targets the gatekeeper db).
    # Auto-constructed from postgresql when empty.
    databaseUrl: ""
  forge:
    # Also requires forge.enabled to be true.
    enabled: true
    image:
      repository: test-forge
      tag: ""
  registry:
    enabled: true
    image:
      repository: test-registry
      tag: ""
  workflows:
    # Also requires workflows.enabled to be true.
    enabled: true
    image:
      repository: test-workflows
      tag: ""
  tickets:
    # Also requires tickets.enabled to be true.
    enabled: true
    image:
      repository: test-tickets
      tag: ""
  hooks:
    # Also requires hooks.enabled and workflows.enabled to be true.
    enabled: true
    image:
      repository: test-hooks
      tag: ""
  outpostGateway:
    # Also requires outpostGateway.enabled to be true.
    enabled: true
    image:
      repository: test-outpost-gateway
      tag: ""
  chaos:
    # Also requires chaos.enabled and outpostGateway.enabled to be true.
    enabled: true
    image:
      repository: test-chaos
      tag: ""
  argo:
    # Also requires argo.enabled and outpostGateway.enabled to be true.
    enabled: true
    image:
      repository: test-argo
      tag: ""

# ── PostgreSQL (Bitnami subchart) ─────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    # Superuser password. Leave empty to let the subchart auto-generate a random
    # password on first install (stored only in the cluster Secret, never in git).
    # Set explicitly only if you need a specific password or are migrating an
    # existing cluster. For production, create per-service users with explicit databaseUrl.
    postgresPassword: ""
    # Leave username/password empty to use the postgres superuser.
    username: ""
    password: ""
  primary:
    initdb:
      scripts:
        init.sql: |
          CREATE DATABASE gatekeeper;
          CREATE DATABASE blueprints;
          CREATE DATABASE forge;
          CREATE DATABASE registry;
          CREATE DATABASE workflows;
          CREATE DATABASE tickets;
          CREATE DATABASE notifications;
          CREATE DATABASE hooks;
          CREATE DATABASE gitea_integration;
          CREATE DATABASE outpost_gateway;
          CREATE DATABASE chaos;
          CREATE DATABASE argo;
