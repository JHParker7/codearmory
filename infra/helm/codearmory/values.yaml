    repository: outpost-gateway
    tag: ""
  replicaCount: 1
  port: 8092
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  service:
    # Set to LoadBalancer/NodePort (or front with an Ingress) to expose the
    # gateway to outposts running outside the control-plane cluster (SaaS).
    type: ClusterIP
  secret:
    databaseUrl: ""
    # Must match the outpost-gateway entry in gatekeeper.secret.gatekeeperServices.
    # Auto-generated on first install and preserved across upgrades.
    gatekeeperServiceKey: ""
    # Shared HMAC secret across the gateway and every integration consumer
    # (chaos, argo). Auto-generated and synced on first install.
    outpostInternalKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Chaos ─────────────────────────────────────────────────────────────────────
# Thin control plane for chaos experiments. Holds no cluster credentials; drives
