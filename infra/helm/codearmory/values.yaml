nameOverride: ""
fullnameOverride: ""

# Default image tag applied to all services when the per-service tag is empty.
imageTag: latest
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# ── Gatekeeper ────────────────────────────────────────────────────────────────
gatekeeper:
  image:
    repository: codearmory/gatekeeper
    tag: ""
  replicaCount: 1
  port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    logLevel: info
    # Comma-separated list of service names permitted to register.
    permittedServices: "gatekeeper,blueprints,forge,workflows,tickets,hooks"
    # Comma-separated CIDRs of trusted reverse proxies (optional).
    trustedProxyCIDRs: ""
    # OpenTelemetry collector OTLP/HTTP endpoint (optional, e.g. http://otel:4318).
    otelEndpoint: ""
    # Publicly reachable base URL for OIDC discovery and token endpoints.
    # Must match the URL Forgejo/Gitea clients use to reach this instance.
    # e.g. https://codearmory.example.com
    oidcIssuer: ""
  secret:
    # PostgreSQL DSN. Auto-constructed from the postgresql subchart when left empty.
    databaseUrl: ""
    # Redis URL. Auto-constructed from gatekeeper.redis when left empty.
    # Override to use an external Redis instance.
    redisUrl: ""
    # Comma-separated "name=key" pairs for service-to-service authentication,
    # e.g. "blueprints=<key>,forge=<key>,workflows=<key>,tickets=<key>,hooks=<key>".
    # Keys must match the gatekeeperServiceKey values set in each service's secret.
    gatekeeperServices: ""
    # Read key gatekeeper uses to fetch default grants from the registry.
    # Must match an entry in registry.secret.serviceAccounts.
    registryServiceKey: ""
    # PEM-encoded ECDSA P-256 private key used to sign OIDC ID tokens.
    # Must be stable across pod restarts — rotating this key invalidates existing
    # ID tokens and forces all connected clients to re-authenticate.
    # Generate with: openssl ecparam -name prime256v1 -genkey -noout | openssl ec -out -
    # If unset, an ephemeral key is generated on startup (not suitable for production).
    oidcSigningKey: ""
  redis:
    enabled: true
    image:
      repository: redis
      tag: "7-alpine"
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
    # Size of the in-memory tmpfs volume mounted at /data.
    dataSizeLimit: 64Mi

# ── Registry ──────────────────────────────────────────────────────────────────
registry:
  image:
    repository: codearmory/registry
    tag: ""
  replicaCount: 1
  port: 8082
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    # Auto-populated as "blueprints=http://<fullname>-blueprints:8084,forge=http://<fullname>-forge:8083,
    # workflows=http://<fullname>-workflows:8085,tickets=http://<fullname>-tickets:8086,
    # hooks=http://<fullname>-hooks:8087" when left empty. Override to use custom service URLs.
    services: ""
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed when left empty.
    databaseUrl: ""
    # Must match the registry entry in gatekeeper.secret.gatekeeperServices.
    gatekeeperServiceKey: ""
    # Comma-separated "name=key" pairs for read-only service accounts (e.g. Conductor, Gatekeeper).
    # Must match conductor.secret.registryServiceKey and gatekeeper.secret.registryServiceKey.
    # Generate with: openssl rand -hex 32
    serviceAccounts: ""
    # Comma-separated "name=key" pairs for admin service accounts (e.g. CI pipelines).
    adminAccounts: ""
  tls:
    certSecret: ""     # Kubernetes TLS secret (tls.crt + tls.key) for server TLS
    clientAuth: ""     # "require" or "request" — enables mTLS on incoming connections
    caSecret: ""       # Secret containing ca.crt used to verify client certificates
    clientCertSecret: "" # TLS secret (tls.crt + tls.key) presented on outbound calls
    caBundle: ""       # Secret containing ca.crt used to verify outbound server certs

# ── Blueprints ────────────────────────────────────────────────────────────────
blueprints:
  enabled: true
  image:
    repository: codearmory/blueprints
    tag: ""
  replicaCount: 1
  port: 8084
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed when left empty.
    databaseUrl: ""
    # Redis URL. Auto-constructed from blueprints.redis when left empty.
    # Override to use an external Redis instance.
    redisUrl: ""
    # 64-character hex string for AES-256-GCM encryption of Terraform state.
    # Generate with: openssl rand -hex 32
    # Required — blueprints will refuse to start without this.
    encryptionKey: ""
    # Must match the blueprints entry in gatekeeper.secret.gatekeeperServices.
    gatekeeperServiceKey: ""
  redis:
    enabled: true
    image:
      repository: redis
      tag: "7-alpine"
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
    # Size of the in-memory tmpfs volume mounted at /data.
    dataSizeLimit: 64Mi

# ── Conductor ─────────────────────────────────────────────────────────────────
conductor:
  image:
    repository: codearmory/conductor
    tag: ""
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    # Initial service key for conductor's account in the registry.
    # Must match the conductor entry in registry.secret.serviceAccounts.
    # Rotated automatically every 25 minutes via POST /service-accounts/rotate-key on registry.
    registryServiceKey: ""
    # Shared HMAC signing key for X-Conductor-Token headers.
    # Must match forge.secret.conductorForwardKey.
    conductorForwardKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""
  service:
    type: ClusterIP
    # Set to LoadBalancer to expose conductor directly without an ingress.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: codearmory.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

# ── Forge ─────────────────────────────────────────────────────────────────────
forge:
  enabled: true
  image:
    repository: codearmory/forge
    tag: ""
  replicaCount: 1
  port: 8083
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    logLevel: info
    # Container runtime: "kubernetes" (recommended) or "docker".
    # When set to "docker", mount the Docker socket via forge.dockerSocket.
    runtime: kubernetes
    # Comma-separated list of container images forge is permitted to run.
    allowedImages: "alpine:3.19,ubuntu:22.04,python:3.12-slim,golang:1.25"
    # Kubernetes namespace in which forge creates sandbox Jobs.
    k8sNamespace: forge
    # Optional RuntimeClass for stronger isolation (e.g. "gvisor").
    k8sRuntimeClass: ""
    # Resource limits applied to each sandbox container.
    containerMemoryLimit: "256Mi"
    containerCpuLimit: "500m"
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed when left empty.
    databaseUrl: ""
    # Must match conductor.secret.conductorForwardKey.
    conductorForwardKey: ""
    # Must match the forge entry in gatekeeper.secret.gatekeeperServices.
    gatekeeperServiceKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # Mount the Docker socket when forge.env.runtime is "docker".
  dockerSocket:
    enabled: false
    path: /var/run/docker.sock

# ── Workflows ─────────────────────────────────────────────────────────────────
workflows:
  enabled: true
  image:
    repository: codearmory/workflows
    tag: ""
  replicaCount: 1
  port: 8085
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    logLevel: info
    # Comma-separated "name=url" pairs of services that workflow steps may call.
    # Auto-populated as "forge=http://<fullname>-forge:8083,blueprints=http://<fullname>-blueprints:8084"
    # when left empty. Override to add custom services or change URLs.
    services: ""
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed when left empty.
    databaseUrl: ""
    # Must match the workflows entry in gatekeeper.secret.gatekeeperServices.
    gatekeeperServiceKey: ""
    # Shared HMAC secret with the hooks service for authenticating internal trigger requests.
    # Must match hooks.secret.hooksTriggerKey. Generate with: openssl rand -hex 32
    hooksTriggerKey: ""
    # AES-256 key for encrypting run tokens at rest in the database.
    # Generate with: openssl rand -hex 32
    tokenKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Tickets ───────────────────────────────────────────────────────────────────
tickets:
  enabled: true
  image:
    repository: codearmory/tickets
    tag: ""
  replicaCount: 1
  port: 8086
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed when left empty.
    databaseUrl: ""
    # Must match the tickets entry in gatekeeper.secret.gatekeeperServices.
    gatekeeperServiceKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Hooks ─────────────────────────────────────────────────────────────────────
hooks:
  enabled: true
  image:
    repository: codearmory/hooks
    tag: ""
  replicaCount: 1
  port: 8087
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed when left empty.
    databaseUrl: ""
    # Must match the hooks entry in gatekeeper.secret.gatekeeperServices.
    gatekeeperServiceKey: ""
    # Shared HMAC secret with the workflows service for signing internal trigger requests.
    # Must match workflows.secret.hooksTriggerKey. Generate with: openssl rand -hex 32
    hooksTriggerKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Containers ────────────────────────────────────────────────────────────────
containers:
  enabled: true
  image:
    repository: codearmory/containers
    tag: ""
  replicaCount: 1
  port: 8089
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    # Base URL of your OCI/Docker registry, e.g. https://registry.example.com
    # Required — containers will refuse to start without this.
    registryUrl: ""
    # Registry credentials (optional — omit for anonymous/token-based access).
    registryUsername: ""
    registryPassword: ""
    # Must match the containers entry in gatekeeper.secret.gatekeeperServices.
    gatekeeperServiceKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Egress Proxy ──────────────────────────────────────────────────────────────
egressProxy:
  enabled: true
  image:
    repository: codearmory/egress-proxy
    tag: ""
  replicaCount: 1
  port: 3128
  resources:
    requests:
      cpu: 25m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  env:
    # Comma-separated list of domains forge execution containers may reach.
    # Exact hostnames or wildcard prefixes (*.github.com).
    allowedDomains: "registry.terraform.io,releases.hashicorp.com,github.com,*.github.com,raw.githubusercontent.com,objects.githubusercontent.com,registry.npmjs.org,pypi.org,files.pythonhosted.org,proxy.golang.org,sum.golang.org,storage.googleapis.com"

# ── Gitea integration ─────────────────────────────────────────────────────────
giteaIntegration:
  enabled: false
  image:
    repository: codearmory/gitea
    tag: ""
  replicaCount: 1
  port: 8088
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    logLevel: info
    otelEndpoint: ""
  secret:
    # PostgreSQL DSN. Auto-constructed when left empty.
    databaseUrl: ""
    # Base URL of your Forgejo/Gitea instance, e.g. https://git.example.com
    # Required when gitea.enabled is true.
    giteaUrl: ""
    # Admin API token for the Forgejo/Gitea instance.
    # Required when gitea.enabled is true.
    giteaAdminToken: ""
    # Must match the gitea entry in gatekeeper.secret.gatekeeperServices.
    gatekeeperServiceKey: ""
  tls:
    certSecret: ""
    clientAuth: ""
    caSecret: ""
    clientCertSecret: ""
    caBundle: ""

# ── Integration tests (helm test) ────────────────────────────────────────────
# Run with: helm test <release>
# Each suite maps to a test image built from tests/<suite>/Dockerfile.
# Image tags fall back to the top-level imageTag when left empty.
tests:
  gatekeeper:
    enabled: true
    image:
      repository: codearmory/test-gatekeeper
      tag: ""
    # DATABASE_URL for post-test cleanup. Auto-constructed from postgresql when empty.
    databaseUrl: ""
  blueprints:
    # Also requires blueprints.enabled to be true.
    enabled: true
    image:
      repository: codearmory/test-blueprints
      tag: ""
  conductor:
    enabled: true
    image:
      repository: codearmory/test-conductor
      tag: ""
    # DATABASE_URL for post-test cleanup (targets the gatekeeper db).
    # Auto-constructed from postgresql when empty.
    databaseUrl: ""
  forge:
    # Also requires forge.enabled to be true.
    enabled: true
    image:
      repository: codearmory/test-forge
      tag: ""
  registry:
    enabled: true
    image:
      repository: codearmory/test-registry
      tag: ""
  workflows:
    # Also requires workflows.enabled to be true.
    enabled: true
    image:
      repository: codearmory/test-workflows
      tag: ""
  tickets:
    # Also requires tickets.enabled to be true.
    enabled: true
    image:
      repository: codearmory/test-tickets
      tag: ""
  hooks:
    # Also requires hooks.enabled and workflows.enabled to be true.
    enabled: true
    image:
      repository: codearmory/test-hooks
      tag: ""

# ── PostgreSQL (Bitnami subchart) ─────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    # Superuser password. Leave empty to let the subchart auto-generate a random
    # password on first install (stored only in the cluster Secret, never in git).
    # Set explicitly only if you need a specific password or are migrating an
    # existing cluster. For production, create per-service users with explicit databaseUrl.
    postgresPassword: ""
    # Leave username/password empty to use the postgres superuser.
    username: ""
    password: ""
  primary:
    initdb:
      scripts:
        init.sql: |
          CREATE DATABASE gatekeeper;
          CREATE DATABASE blueprints;
          CREATE DATABASE forge;
          CREATE DATABASE registry;
          CREATE DATABASE workflows;
          CREATE DATABASE tickets;
          CREATE DATABASE hooks;
          CREATE DATABASE gitea_integration;
