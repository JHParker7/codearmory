# ── Outpost Gateway ───────────────────────────────────────────────────────────
# Outpost-facing connection point + Postgres event backbone for cluster
# integrations (chaos, argo). Distinct from conductor.
outpostGateway:
  enabled: true
  deploy: false  # deployed on demand by builder (Phase 2), not by Helm
